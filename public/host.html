<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ホスト画面</title>
<style>
*{box-sizing:border-box}html,body{margin:0;height:100%;font-family:-apple-system,"Noto Sans JP",sans-serif;background:#0b1f33;color:#fff}.wrap{height:100vh;display:grid;grid-template-columns:420px 1fr}.side{padding:16px;background:#0e2947;overflow:auto}.main{padding:22px;overflow:auto}h1,h2{margin:.2em 0}.qr{background:#fff;color:#123;min-height:160px;display:flex;align-items:center;justify-content:center;border-radius:14px;padding:8px}.qr img{width:150px;height:150px}.url{font-size:.78rem;word-break:break-all;background:#08315a;padding:8px;border-radius:8px;margin:8px 0}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}.card{background:#08315a;padding:8px;border-radius:10px;text-align:center}.card b{display:block;font-size:1.5rem}.group{background:#08315a;border-radius:12px;padding:10px;margin-top:10px}.buttons{display:flex;gap:6px;flex-wrap:wrap}.buttons button,.action{padding:10px 12px;border:2px solid #315b84;border-radius:10px;background:#123b61;color:#fff;font-weight:800;cursor:pointer}.buttons button.on{background:#0875c9}.action{width:100%;margin-top:8px;border:0;padding:14px}.start{background:#27ae60}.reset{background:#526d88}.danger{background:#8e3b3b}.practice{display:flex;gap:8px}.status{margin-top:10px;padding:10px;border-radius:10px;background:#173957}.status.ok{background:#17633a}.status.warn{background:#8b6914}.detail{max-height:150px;overflow:auto;font-size:.85rem}.hidden{display:none}table{width:100%;border-collapse:collapse;font-size:1.15rem}th,td{padding:9px;text-align:left}tbody tr:nth-child(odd){background:#0e2947}.score{text-align:right}.top1{background:#f1c40f!important;color:#123}.top2{background:#bdc3c7!important;color:#123}.top3{background:#cd7f32!important;color:#123}.awards{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}.award{padding:12px;border-radius:12px;background:#143858}.uniqueResult{margin-top:14px;padding:14px;background:#143858;border-radius:12px}.dist{display:flex;flex-wrap:wrap;gap:6px}.chip{padding:6px 9px;border-radius:8px;background:#244e70}.chip.unique{background:#1f7a48}.toast{position:fixed;right:18px;bottom:18px;background:#c0392b;padding:12px;border-radius:10px;display:none}
</style></head><body><div class="wrap"><aside class="side"><h1>⚡ バトル操作盤</h1><div id="qr" class="qr">QR生成中…</div><div id="url" class="url"></div>
<div class="stats"><div class="card"><b id="joined">0</b>参加</div><div class="card"><b id="standby">0</b>スタンバイ</div><div class="card"><b id="answered">0</b>記録・回答済み</div><div class="card"><b id="connected">0</b>接続中</div><div class="card"><b id="missing">0</b>未スタンバイ</div><div class="card"><b id="round">0</b>ラウンド</div></div>
<div id="readyStatus" class="status">状態確認中</div><div id="detail" class="detail"></div>
<div class="group"><div>ゲーム</div><div class="buttons"><button id="reflex" class="on">反射神経</button><button id="tap">連打</button><button id="unique">最大ユニーク</button></div><div id="durations" class="buttons hidden" style="margin-top:8px"><button data-d="5">5秒</button><button data-d="7" class="on">7秒</button><button data-d="10">10秒</button></div></div>
<div class="group"><div>モード</div><div class="practice"><button id="official" class="on">本番</button><button id="practice">練習</button></div></div>
<button id="start" class="action start">反射神経を開始</button><div id="uniqueActions" class="hidden"><button id="uOpen" class="action start">回答受付開始</button><button id="uClose" class="action reset">回答締切</button><button id="uReveal" class="action">結果発表</button></div><button id="reset" class="action reset">記録をリセット</button><button id="resetAll" class="action danger">全リセット</button></aside>
<main class="main"><h2 id="title">🏆 反射神経ランキング</h2><table><thead><tr><th>順位</th><th>なまえ</th><th class="score">スコア</th><th class="score">回数</th></tr></thead><tbody id="body"><tr><td colspan="4">記録なし</td></tr></tbody></table><div class="awards"><div class="award"><b>🎁 ブービー賞</b><div id="booby">該当なし</div></div><div class="award"><b>🫣 ブービーメーカー</b><div id="maker">該当なし</div></div></div><div id="uniqueResult" class="uniqueResult hidden"></div></main></div><div id="toast" class="toast"></div>
<script>
'use strict';
const $=id=>document.getElementById(id);let mode='reflex',duration=7,practice=false,es=null;
function toast(m){$('toast').textContent=m;$('toast').style.display='block';setTimeout(()=>$('toast').style.display='none',4000)}
async function post(url,body){const r=await fetch(url,{method:'POST',headers:{'Content-Type':'application/json'},cache:'no-store',body:JSON.stringify(body||{})});const d=await r.json();if(!r.ok)throw new Error('HTTP '+r.status);return d}
function loadQr(){const join=location.origin+'/';$('url').textContent=join;const parts=['https:','','cdn.jsdelivr.net','npm','qrcode-generator@1.4.4','qrcode.js'];const s=document.createElement('script');s.src=parts.join('/');s.onload=()=>{try{const q=window.qrcode(0,'M');q.addData(join);q.make();$('qr').innerHTML=q.createImgTag(5,5)}catch{$('qr').textContent='QR生成失敗'}};s.onerror=()=>$('qr').textContent='QRライブラリ読込失敗';document.head.appendChild(s)}
function buttons(){['reflex','tap','unique'].forEach(x=>$(x).classList.toggle('on',mode===x));$('durations').classList.toggle('hidden',mode!=='tap');$('start').classList.toggle('hidden',mode==='unique');$('uniqueActions').classList.toggle('hidden',mode!=='unique');$('official').classList.toggle('on',!practice);$('practice').classList.toggle('on',practice);$('start').textContent=(mode==='tap'?`連打${duration}秒`:'反射神経')+'を開始'+(practice?'［練習］':'')}
async function select(){buttons();try{render(await post('/api/select-ranking',{mode,duration}))}catch{toast('ランキング切替失敗')}}
['reflex','tap','unique'].forEach(x=>$(x).onclick=()=>{mode=x;select()});document.querySelectorAll('[data-d]').forEach(b=>b.onclick=()=>{duration=Number(b.dataset.d);document.querySelectorAll('[data-d]').forEach(x=>x.classList.toggle('on',x===b));select()});$('official').onclick=()=>{practice=false;buttons()};$('practice').onclick=()=>{practice=true;buttons()};
function render(d){const s=d.stats||{};$('joined').textContent=s.joined||0;$('standby').textContent=s.standby||0;$('connected').textContent=s.connected||0;$('missing').textContent=s.notStandby||0;$('answered').textContent=s.mode==='unique'?(s.answered||0):(s.practice?s.roundCompleted||0:s.answered||0);$('round').textContent=s.round||0;$('readyStatus').textContent=s.joined>0&&s.standby===s.joined?'✓ 全員スタンバイ':`⚠ ${s.notStandby||0}人がスタンバイではありません`;$('readyStatus').className='status '+(s.joined>0&&s.standby===s.joined?'ok':'warn');$('detail').innerHTML=(s.detail||[]).map(x=>`${escapeHtml(x.name)}：${escapeHtml(x.state)}`).join('<br>');const unit=s.mode==='tap'?' 回':s.mode==='unique'?' 点':' ms';$('title').textContent=s.mode==='tap'?`🏆 連打${s.duration}秒ランキング`:s.mode==='unique'?'🏆 最大ユニークナンバー 累積ランキング':'🏆 反射神経ランキング';const board=d.board||[];$('body').innerHTML=board.length?board.map(r=>`<tr class="${r.rank===1?'top1':r.rank===2?'top2':r.rank===3?'top3':''}"><td>${r.rank<=3?['','🥇','🥈','🥉'][r.rank]:r.rank}</td><td>${escapeHtml(r.name)}</td><td class="score">${r.score}${unit}</td><td class="score">${r.tries||0}</td></tr>`).join(''):'<tr><td colspan="4">記録なし</td></tr>';$('booby').textContent=d.booby?.prize?.join('、')||'該当なし';$('maker').textContent=d.booby?.maker?.join('、')||'該当なし';showUnique(d.uniqueResult)}
function escapeHtml(v){return String(v||'').replace(/[<>&"]/g,c=>({'<':'&lt;','>':'&gt;','&':'&amp;','"':'&quot;'}[c]))}
function showUnique(r){$('uniqueResult').classList.toggle('hidden',!r);if(!r)return;const dist=(r.distribution||[]).map(x=>`<span class="chip ${x.unique?'unique':''}">${x.number}：${x.count}人</span>`).join('');$('uniqueResult').innerHTML=`<h3>最大ユニーク結果</h3><p>${r.winningNumber===null?'ユニーク数字なし':`勝利数字：${r.winningNumber}`}</p><p>勝者：${escapeHtml((r.winners||[]).join('、')||'なし')}</p><div class="dist">${dist}</div>${r.practice?'<p>練習：ポイント加算なし</p>':''}`}
$('start').onclick=async()=>{if($('start').disabled)return;$('start').disabled=true;try{await post('/api/start',{mode,duration,practice})}catch{toast('開始失敗')}finally{$('start').disabled=false}};$('uOpen').onclick=()=>post('/api/unique',{action:'open',practice}).catch(()=>toast('受付開始失敗'));$('uClose').onclick=()=>post('/api/unique',{action:'close'}).catch(()=>toast('締切失敗'));$('uReveal').onclick=()=>post('/api/unique',{action:'reveal'}).catch(()=>toast('結果発表失敗'));$('reset').onclick=async()=>{if(confirm('全ゲームの記録を削除しますか？'))await post('/api/reset',{})};$('resetAll').onclick=async()=>{if(confirm('参加者と全記録を削除しますか？'))await post('/api/reset-all',{})};
function connect(){es=new EventSource('/events/host');es.addEventListener('leaderboard',e=>render(JSON.parse(e.data)));es.addEventListener('session-reset',()=>{});es.onerror=()=>{}}
console.log('HOST SCRIPT STARTED');loadQr();buttons();connect();
</script></body></html>

<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>
  技能人財養成部 ハロウィンパーティー｜司会画面
</title>

<style>
* {
  box-sizing: border-box;
}

html,
body {
  width: 100%;
  height: 100%;
  margin: 0;
  overflow: hidden;

  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Hiragino Kaku Gothic ProN",
    "Noto Sans JP",
    sans-serif;

  background: #120b1e;
  color: #ffffff;
}

button {
  font: inherit;
}

.hidden {
  display: none !important;
}

/* 左操作盤と右ランキングを独立スクロール */

.wrap {
  display: grid;
  grid-template-columns:
    390px minmax(0, 1fr);

  width: 100%;
  height: 100vh;
  overflow: hidden;
}

.side {
  height: 100vh;
  padding: 10px 12px;

  overflow-x: hidden;
  overflow-y: auto;

  border-right:
    2px solid #f28a24;

  background:
    linear-gradient(
      180deg,
      #321747,
      #1b1029
    );

  scrollbar-color:
    #80599a #21132f;
}

.main {
  min-width: 0;
  height: 100vh;
  padding: 16px 20px;

  overflow-x: hidden;
  overflow-y: auto;

  background:
    radial-gradient(
      circle at 80% 0,
      #301840,
      #120b1e 55%
    );

  scrollbar-color:
    #80599a #21132f;
}

h1,
h2 {
  margin: 0.2em 0;
}

/* タイトル */

.departmentTitle {
  margin: 0;

  color: #ffffff;

  font-size: 1rem;
  font-weight: 900;
  line-height: 1.2;
  text-align: center;
}

.partyTitle {
  margin: 3px 0 8px;

  color: #ff9c2e;

  font-size: 1.28rem;
  font-weight: 950;
  line-height: 1.2;
  text-align: center;
  white-space: nowrap;
}

/* QRコード */

.qr {
  display: flex;
  align-items: center;
  justify-content: center;

  min-height: 218px;
  padding: 6px;

  border-radius: 14px;

  background: #ffffff;
  color: #12303f;
}

.qr img {
  width: 206px;
  height: 206px;

  image-rendering: pixelated;
}

/* 参加状況 */

.stats {
  display: grid;
  grid-template-columns:
    repeat(4, minmax(0, 1fr));

  gap: 5px;
  margin-top: 7px;
}

.card {
  padding: 6px 2px;

  border-radius: 8px;

  background: #42245a;

  font-size: 0.73rem;
  text-align: center;
}

.card b {
  display: block;

  color: #ffb257;

  font-size: 1.36rem;
  font-weight: 950;
  line-height: 1.05;
  font-variant-numeric:
    tabular-nums;
}

/* 状態表示 */

.status {
  margin-top: 7px;
  padding: 9px 10px;

  border-radius: 9px;

  background: #3c2550;

  font-size: 0.88rem;
  font-weight: 750;
  line-height: 1.4;
}

.status.ok {
  background: #17633a;
}

.status.warn {
  background: #8b6914;
}

.status.playing {
  background: #075b87;
}

.detail {
  margin-top: 4px;

  color: #ffd2d2;

  font-size: 0.78rem;
  line-height: 1.4;
}

/* 要確認一覧と登録削除ボタン */

.issueList {
  display: grid;
  gap: 5px;
}

.issueRow {
  display: grid;
  grid-template-columns:
    minmax(0, 1fr) auto;

  align-items: center;
  gap: 7px;

  padding: 6px 7px;

  border:
    1px solid #75495b;
  border-radius: 8px;

  background: #321b2d;
}

.issueText {
  min-width: 0;

  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;

  color: #ffd2d2;
}

.removePlayerButton {
  padding: 5px 9px;

  border:
    1px solid #ff9b9b;
  border-radius: 7px;

  background: #973b3b;
  color: #ffffff;

  font-size: 0.72rem;
  font-weight: 900;

  white-space: nowrap;
  cursor: pointer;
}

.removePlayerButton:hover {
  background: #bd4545;
}

.removePlayerButton:disabled {
  opacity: 0.5;
  cursor: default;
}

/* ゲーム・モード選択 */

.group {
  margin-top: 7px;
  padding: 8px;

  border-radius: 10px;

  background: #321c45;
}

.groupTitle {
  margin-bottom: 6px;

  color: #ffffff;

  font-size: 0.9rem;
  font-weight: 900;
}

.gameButtons,
.modeButtons {
  display: grid;
  gap: 5px;
}

.gameButtons {
  grid-template-columns:
    repeat(4, minmax(0, 1fr));
}

.modeButtons {
  grid-template-columns:
    repeat(2, minmax(0, 1fr));
}

.gameButtons button,
.modeButtons button {
  min-width: 0;
  padding: 10px 4px;

  border:
    2px solid #6e4d84;
  border-radius: 9px;

  background: #43235c;
  color: #ffffff;

  font-size: 0.88rem;
  font-weight: 900;

  cursor: pointer;
}

.gameButtons button:hover,
.modeButtons button:hover {
  border-color: #b891cf;
  background: #55306d;
}

.gameButtons button.on,
.modeButtons button.on {
  border-color: #ffb257;

  background: #ef7f1a;
  color: #ffffff;

  box-shadow:
    0 0 0 1px #ffb25755;
}

/* 操作ボタン */

.action {
  width: 100%;
  margin-top: 7px;
  padding: 12px 8px;

  border: 0;
  border-radius: 10px;

  color: #ffffff;

  font-size: 0.96rem;
  font-weight: 900;

  cursor: pointer;
}

.action:disabled {
  opacity: 0.45;
  cursor: default;
}

.start {
  background: #27ae60;
}

.orange {
  background: #d07816;
}

.purple {
  background: #843bad;
}

.reset {
  background: #526d88;
}

.danger {
  background: #9f3d3d;
}

.resetRow {
  display: grid;
  grid-template-columns:
    1fr 1fr;

  gap: 6px;
}

.resetRow .action {
  width: 100%;
  font-size: 0.82rem;
}

/* ランキング見出し */

.mainHeader {
  display: flex;
  align-items: center;
  flex-wrap: wrap;

  gap: 10px;

  min-height: 48px;
  margin-bottom: 7px;
}

.mainHeader h2 {
  margin: 0;

  color: #ffffff;

  font-size:
    clamp(
      1.55rem,
      2vw,
      2rem
    );

  line-height: 1.2;
}

/* テンポのラウンド選択 */

.tempoTopTabs {
  display: flex;
  align-items: center;
  flex-wrap: wrap;

  gap: 6px;
  margin-left: auto;
}

.tempoTopTabs button,
.historyTabs button {
  padding: 8px 12px;

  border:
    1px solid #8359a0;
  border-radius: 9px;

  background: #442558;
  color: #ffffff;

  font-size: 0.96rem;
  font-weight: 900;

  cursor: pointer;
}

.tempoTopTabs button.on,
.historyTabs button.on {
  border-color: #ffb257;
  background: #ef7f1a;
}

.tempoInfo {
  margin: 0 0 8px;
  padding: 9px 11px;

  border-radius: 9px;

  background: #402655;

  font-size: 1rem;
  line-height: 1.4;
}

/* ランキングページ */

.pager {
  display: flex;
  align-items: center;
  flex-wrap: wrap;

  gap: 6px;
  margin: 6px 0 9px;
}

.pager button {
  padding: 7px 11px;

  border:
    1px solid #80599a;
  border-radius: 8px;

  background: #442558;
  color: #ffffff;

  font-size: 0.95rem;
  font-weight: 800;

  cursor: pointer;
}

.pager button.on {
  border-color: #ffb257;
  background: #ef7f1a;
}

.pager span {
  margin-left: auto;

  color: #c7b8d2;

  font-size: 0.95rem;
}

/* 通常ランキング */

.board {
  display: grid;
  grid-template-columns:
    repeat(3, minmax(0, 1fr));

  gap: 8px;
}

.rank {
  display: grid;
  grid-template-columns:
    56px minmax(0, 1fr) auto auto;

  align-items: center;
  gap: 10px;

  min-height: 72px;
  padding: 10px 12px;

  border:
    1px solid #452b59;
  border-radius: 10px;

  background: #2a183b;
}

.rank:nth-child(even) {
  background: #321d45;
}

.rank b {
  font-size:
    clamp(
      1.55rem,
      2vw,
      1.9rem
    );

  font-weight: 950;
  text-align: center;
}

.rankName {
  min-width: 0;

  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;

  font-size:
    clamp(
      1.42rem,
      1.75vw,
      1.72rem
    );

  font-weight: 900;
}

.score {
  white-space: nowrap;

  color: #ffd08a;

  font-size:
    clamp(
      1.38rem,
      1.65vw,
      1.68rem
    );

  font-weight: 950;
  font-variant-numeric:
    tabular-nums;
}

.tries {
  white-space: nowrap;

  color: #c7b8d2;

  font-size:
    clamp(
      0.98rem,
      1.13vw,
      1.15rem

}

.top1 {
  border-color: #ffe86f;

  background:
    #f1c40f !important;

  color: #20142b;
}

.top2 {
  border-color: #e8ecef;

  background:
    #bdc3c7 !important;

  color: #20142b;
}

.top3 {
  border-color: #e6a66b;

  background:

  color: #20142b;
}

.top1 .score,
.top2 .score,

.top1 .tries,

}

.rankPlaceholder {
  min-height: 72px;

  visibility: hidden;
  pointer-events: none;
}

.panel,
.award {
  padding: 14px;

  border-radius: 12px;

  background: #2f1b41;
}

/* ブービー */

.awards {
  display: grid;
  grid-template-columns:
    1fr 1fr;

  gap: 10px;
  margin-top: 12px;
}

.award {
  font-size: 1.12rem;
  line-height: 1.5;
}

.award b {
  font-size: 1.22rem;
}

/* 最大ユニーク上位3名 */

.podium {
  display: grid;
  grid-template-columns:
    repeat(3, minmax(0, 1fr));

  gap: 12px;
  margin: 10px 0;
}

.podiumCard {

  padding: 18px;

  border:

  border-radius: 13px;

  background: #2f1b41;

  font-size: 1.4rem;
  font-weight: 900;
  line-height: 1.45;
  text-align: center;
}

.podiumCard.place1 {
  border-color: #ffe86f;
  background: #f1c40f;
  color: #20142b;
}

.podiumCard.place2 {
  border-color: #e8ecef;
  background: #bdc3c7;
  color: #20142b;
}

.podiumCard.place3 {
  border-color: #e6a66b;
  background: #cd7f32;
  color: #20142b;
}

.podiumPlace {
  font-size: 1.65rem;
  font-weight: 950;
}

.podiumName {
  margin-top: 7px;

  font-size: 1.55rem;
  font-weight: 950;
}

.podiumNumber {
  margin-top: 5px;

  font-size: 1.35rem;
  font-weight: 900;
}

/* 最大ユニーク履歴 */

.history {
  margin-top: 12px;
  padding: 14px;

  border:
    1px solid #744c90;
  border-radius: 12px;

  background: #21132f;
}

.history h2 {
  font-size: 1.45rem;
}

.historyTabs {
  display: flex;
  flex-wrap: wrap;

  gap: 6px;
  margin: 9px 0;
}

.historySummary {
  margin-bottom: 8px;
  padding: 11px;

  border-radius: 10px;

  background: #402655;

  font-size: 1.08rem;
  font-weight: 750;
  line-height: 1.5;
}

.legend {
  display: flex;
  flex-wrap: wrap;

  gap: 14px;
  margin: 8px 0;

  font-size: 0.95rem;
}

.legend i {
  display: inline-block;

  width: 13px;
  height: 13px;
  margin-right: 5px;

  border-radius: 2px;
}

.chartScroll {
  overflow-x: auto;
  padding-bottom: 8px;
}

.chart {
  display: flex;
  align-items: flex-end;

  gap: 4px;

  min-width: 1200px;
  height: 330px;

  padding:
    34px
    14px
    28px;

  border-left:
    1px solid #86699a;
  border-bottom:
    1px solid #86699a;

  background: #170d22;
}

.barColumn {
  position: relative;

  display: flex;
  align-items: flex-end;

  width: 9px;
  height: 100%;
}

.chartBar {
  position: relative;

  width: 100%;

  border-radius:
    3px 3px 0 0;

  background: #80549c;
}

.chartBar.unique {
  background: #2fbc72;
}

.chartBar.winner {
  background: #ffd447;

  box-shadow:
    0 0 12px #ffd447;
}

.barNumber {
  position: absolute;

  bottom: -21px;
  left: 50%;

  color: #d5c4df;

  font-size: 9px;

  transform:
    translateX(-50%);
}

.barCount {
  position: absolute;

  top: -20px;
  left: 50%;

  color: #ffffff;

  font-size: 10px;
  font-weight: 900;

  transform:
    translateX(-50%);
}

/* 画面幅対応 */

@media (max-width: 1250px) {
  .wrap {
    grid-template-columns:
      365px minmax(0, 1fr);
  }

  .rank {
    grid-template-columns:
      48px minmax(0, 1fr) auto;

    gap: 7px;
  }

  .tries {
    display: none;
  }
}

@media (max-width: 850px) {
  html,

    overflow: auto;
  }

  .wrap {
    display: block;
    height: auto;
    overflow: visible;
  }

  .side,
  .main {
    width: 100%;
    height: auto;
    overflow: visible;
  }

  .side {
    border-right: 0;

    border-bottom:
      2px solid #f28a24;
  }

  .board {
    grid-template-columns:
      1fr;
  }

  .rankPlaceholder {
    display: none;
  }

  .podium {
    grid-template-columns:
      1fr;
  }

  .mainHeader {
    display: block;
  }

  .tempoTopTabs {
    margin-top: 9px;
    margin-left: 0;
  }
}
</style>
</head>

<script>
'use strict';

const $ = id =>
  document.getElementById(id);

const PAGE_SIZE = 30;
const ROWS_PER_COLUMN = 10;
const TAP_DURATION = 5;

let mode = 'reflex';
let practice = false;
let currentData = {};
let page = 1;

let selectedUniqueHistoryId =
  null;

let selectedTempoView =
  'overall';

/* HTTP */

async function post(
  url,
  body = {}
) {
  const response =
    await fetch(
      url,
      {
        method: 'POST',

        headers: {
          'Content-Type':
            'application/json'
        },

        cache: 'no-store',

        body:
          JSON.stringify(body)
      }
    );

  let data = {};

  try {
    data =
      await response.json();
  } catch {
    data = {};
  }

  if (!response.ok) {
    const error =
      new Error(
        JSON.stringify(data)
      );

    error.status =
      response.status;

    throw error;
  }

  return data;
}

function escapeHtml(value) {
  return String(value || '')
    .replace(
      /[<>&"]/g,

      character => ({
        '<': '&lt;',
        '>': '&gt;',
        '&': '&amp;',
        '"': '&quot;'
      })[character]
    );
}

/* 切断参加者の登録削除 */

async function removeDisconnectedPlayer(
  playerId,
  playerName
) {
  const confirmed =
    confirm(
      '「' +
      playerName +
      '」の参加登録を削除しますか？\n\n' +
      'この操作を行うと、参加人数とランキング対象から削除されます。'
    );

  if (!confirmed) {
    return false;
  }

  try {
    await post(
      '/api/remove-player',
      {
        id: playerId
      }
    );

    return true;
  } catch (error) {
    if (
      error.status === 409
    ) {
      alert(
        'この参加者は現在接続中のため削除できません。'
      );
    } else if (
      error.status === 404
    ) {
      alert(
        'この参加登録はすでに削除されています。'
      );
    } else {
      alert(
        '参加登録を削除できませんでした。'
      );
    }

    return false;
  }
}

/* QRコード */

function createQrCode() {
  const joinUrl =
    location.origin + '/';

  const parts = [
    'https:',
    '',
    'cdn.jsdelivr.net',
    'npm',
    'qrcode-generator@1.4.4',
    'qrcode.js'
  ];

  const script =
    document.createElement(
      'script'
    );

  script.src =
    parts.join('/');

  script.onload =
    () => {
      try {
        const qr =
          window.qrcode(
            0,
            'M'
          );

        qr.addData(
          joinUrl
        );

        qr.make();

        $('qr').innerHTML =
          qr.createImgTag(
            6,
            5
          );
      } catch {
        $('qr').textContent =
          'QR生成失敗';
      }
    };

  script.onerror =
    () => {
      $('qr').textContent =
        'QR読込失敗';
    };

  document.head.appendChild(
    script
  );
}

/* ゲーム選択 */

function gameName(
  gameMode
) {
  if (
    gameMode === 'tap'
  ) {
    return '連打5秒';
  }

  if (
    gameMode === 'unique'
  ) {
    return '最大ユニーク';
  }

  if (
    gameMode === 'tempo'
  ) {
    return 'テンポゲーム';
  }

  return '反射神経';
}

function choose(nextMode) {
  mode = nextMode;
  page = 1;

  selectRanking();
}

async function selectRanking() {
  [
    'reflex',
    'tap',
    'unique',
    'tempo'
  ].forEach(
    gameMode => {
      $(gameMode)
        .classList.toggle(
          'on',
          gameMode === mode
        );
    }
  );

  $('modeGroup')
    .classList.remove(
      'hidden'
    );

  $('uniqueHistory')
    .classList.toggle(
      'hidden',
      mode !== 'unique'
    );

  $('tempoTopTabs')
    .classList.toggle(
      'hidden',
      mode !== 'tempo'
    );

  $('tempoInfo')
    .classList.toggle(
      'hidden',
      mode !== 'tempo'
    );

  try {
    currentData =
      await post(
        '/api/select-ranking',
        {
          mode,
          duration:
            TAP_DURATION
        }
      );

    render(
      currentData
    );
  } catch {
    alert(
      'ランキングを切り替えられませんでした'
    );
  }
}

[
  'reflex',
  'tap',
  'unique',
  'tempo'
].forEach(
  gameMode => {
    $(gameMode).onclick =
      () => {
        choose(
          gameMode
        );
      };
  }
);

$('official').onclick =
  () => {
    practice = false;
    updateButtons();
  };

$('practice').onclick =
  () => {
    practice = true;
    updateButtons();
  };

/* 操作ボタン */

function updateButtons() {
  const stats =
    currentData.stats ||
    {};

  $('official')
    .classList.toggle(
      'on',
      !practice
    );

  $('practice')
    .classList.toggle(
      'on',
      practice
    );

  const canForce =
    stats.active &&
    [
      'reflex',
      'tap',
      'tempo'
    ].includes(
      stats.activeMode
    );

  $('force')
    .classList.toggle(
      'hidden',
      !canForce
    );

  if (
    mode === 'unique'
  ) {
    const state =
      stats.uniqueStatus ||
      'idle';

    if (
      state === 'open'
    ) {
      $('mainAction')
        .textContent =
          '回答を締め切る';

      $('mainAction')
        .className =
          'action orange';
    } else if (
      state === 'closed'
    ) {
      $('mainAction')
        .textContent =
          '結果を発表する';

      $('mainAction')
        .className =
          'action purple';
    } else {
      $('mainAction')
        .textContent =
          '回答受付開始' +
          (
            practice
              ? '［練習］'
              : ''
          );

      $('mainAction')
        .className =
          'action start';
    }

    $('mainAction').disabled =
      false;

    return;
  }

  if (
    mode === 'tempo'
  ) {
    $('mainAction')
      .className =
        'action start';

    if (
      stats.activeMode ===
        'tempo' &&
      stats.active
    ) {
      $('mainAction')
        .textContent =
          (
            stats.roundCompleted ||
            0
          ) +
          '/' +
          (
            stats.joined ||
            0
          ) +
          '人完了';

      $('mainAction').disabled =
        true;

      return;
    }

    if (practice) {
      $('mainAction')
        .textContent =
          'テンポ開始［練習］';

      $('mainAction').disabled =
        false;

      return;
    }

    if (
      (
        stats.tempoNext ||
        0
      ) < 3
    ) {
      $('mainAction')
        .textContent =
          'テンポ 本番 第' +
          (
            (
              stats.tempoNext ||
              0
            ) + 1
          ) +
          'ラウンド開始';

      $('mainAction').disabled =
        false;

      return;
    }

    $('mainAction')
      .textContent =
        'テンポ本番完了';

    $('mainAction').disabled =
      true;

    return;
  }

  $('mainAction')
    .textContent =
      (
        mode === 'tap'
          ? '連打5秒'
          : '反射神経'
      ) +
      'を開始' +
      (
        practice
          ? '［練習］'
          : ''
      );

  $('mainAction')
    .className =
      'action start';

  $('mainAction').disabled =
    Boolean(
      stats.active
    );
}

$('mainAction').onclick =

    try {

        const action =

              ? 'reveal'
              : 'open';

        await post(
          '/api/unique',

        mode === 'tempo'

        await post(
          '/api/tempo/start',
          {
            practice,

            index:
              stats.tempoNext ||
              0
          }

      }

      await post(
        '/api/start',
        {
          mode,

          duration:
            TAP_DURATION,

          practice

      alert(
        '操作できませんでした'

    }

/* ホスト状態表示 */

function render(data) {
  currentData = data;

  const stats =
    data.stats ||
    {};

  $('joined').textContent =
    stats.joined || 0;

  $('standby').textContent =
    stats.standby || 0;

  $('answered').textContent =
    stats.roundCompleted || 0;

  const issues =
    (
      stats.detail ||
      []
    ).filter(
      entry =>
        [
          '切断・未確認',
          '画面非表示'
        ].includes(
          entry.state
        )
    );

  $('missing').textContent =
    issues.length;

  $('detail').innerHTML =
    issues.length
      ? `
        <div class="issueList">
          ${issues
            .map(
              entry => {
                const canRemove =
                  entry.state ===
                    '切断・未確認' &&
                  entry.id;

                return `
                  <div class="issueRow">

                    <span class="issueText">
                      ${escapeHtml(
                        entry.name
                      )}：
                      ${escapeHtml(
                        entry.state
                      )}
                    </span>

                    ${
                      canRemove
                        ? `
                          <button
                            type="button"
                            class="removePlayerButton"
                            data-remove-player="${escapeHtml(
                              entry.id
                            )}"
                            data-remove-name="${escapeHtml(
                              entry.name
                            )}"
                          >
                            登録削除
                          </button>
                        `
                        : ''
                    }

                  </div>
                `;
              }
            )
            .join('')}
        </div>
      `
      : '';

  document
    .querySelectorAll(
      '[data-remove-player]'
    )
    .forEach(
      button => {
        button.onclick =
          async () => {
            const playerId =
              button.dataset
                .removePlayer;

            const playerName =
              button.dataset
                .removeName ||
              '';

            button.disabled =
              true;

            button.textContent =
              '削除中…';

            const removed =
              await removeDisconnectedPlayer(
                playerId,
                playerName
              );

            if (!removed) {
              button.disabled =
                false;

              button.textContent =
                '登録削除';
            }
          };
      }
    );

  if (stats.active) {
    $('status').textContent =
      '▶ ' +
      gameName(
        stats.activeMode
      ) +
      '：進行中　完了 ' +
      (
        stats.roundCompleted ||
        0
      ) +
      '/' +
      (
        stats.joined ||
        0
      );

    $('status').className =
      'status playing';
  } else if (
    !issues.length
  ) {
    $('status').textContent =
      '✓ ゲーム開始可能';

    $('status').className =
      'status ok';
  } else {
    $('status').textContent =
      '⚠ ' +
      issues.length +
      '人を要確認';

    $('status').className =
      'status warn';
  }

  renderBoard(data);
  updateButtons();
}

/* ランキング共通 */

function formatRank(rank) {
  if (rank === 1) {
    return '🥇';
  }

  if (rank === 2) {
    return '🥈';
  }

  if (rank === 3) {
    return '🥉';
  }

  return rank;
}

function rankClass(rank) {
  if (rank === 1) {
    return 'top1';
  }

  if (rank === 2) {
    return 'top2';
  }

  if (rank === 3) {
    return 'top3';
  }

  return '';
}

function rankingCard(
  record,
  unit
) {
  return `
    <div
      class="rank ${rankClass(
        record.rank
      )}"
      title="${escapeHtml(
        record.name
      )}"
    >

      <b>
        ${formatRank(
          record.rank
        )}
      </b>

      <span class="rankName">
        ${escapeHtml(
          record.name
        )}
      </span>

      <span class="score">
        ${record.score}${unit}
      </span>

      <span class="tries">
        ${record.tries || 0}回
      </span>

    </div>
  `;
}

function reorderPageRecords(
  records
) {
  const ordered = [];

  for (
    let row = 0;
    row <
      ROWS_PER_COLUMN;
    row += 1
  ) {
    for (
      let column = 0;
      column < 3;
      column += 1
    ) {
      const index =
        row +
        column *
          ROWS_PER_COLUMN;

      ordered.push(
        records[index] ||
        null
      );
    }
  }

  return ordered;
}

function renderStandardBoard(
  board,
  unit
) {
  const pageCount =
    Math.max(
      1,
      Math.ceil(
        board.length /
        PAGE_SIZE
      )
    );

  page =
    Math.max(
      1,
      Math.min(
        page,
        pageCount
      )
    );

  const start =
    (
      page - 1
    ) *
    PAGE_SIZE;

  const end =
    Math.min(
      start +
      PAGE_SIZE,

      board.length
    );

  const records =
    reorderPageRecords(
      board.slice(
        start,
        end
      )
    );

  if (
    pageCount > 1
  ) {
    $('pager').innerHTML =
      Array.from(
        {
          length:
            pageCount
        },

        (
          _,
          index
        ) => {
          const number =
            index + 1;

          return `
            <button
              type="button"
              class="${
                number === page
                  ? 'on'
                  : ''
              }"
              data-page="${number}"
            >
              ${number}
            </button>
          `;
        }
      ).join('') +
      `
        <span>
          ${start + 1}～${end}位 /
          ${board.length}人
        </span>
      `;

    document
      .querySelectorAll(
        '[data-page]'
      )
      .forEach(
        button => {
          button.onclick =
            () => {
              page =
                Number(
                  button.dataset
                    .page
                );

              renderBoard(
                currentData
              );
            };
        }
      );
  } else {
    $('pager').innerHTML =
      '';
  }

  $('board').innerHTML =
    board.length
      ? records
          .map(
            record =>
              record
                ? rankingCard(
                    record,
                    unit
                  )
                : `
                  <div
                    class="rankPlaceholder"
                  ></div>
                `
          )
          .join('')
      : `
        <div class="panel">
          記録なし
        </div>
      `;
}

/* 最大ユニーク */

function renderUniquePodium(
  history
) {
  const latest =
    currentData
      .uniqueResult ||
    history.at(-1);

  $('podium').innerHTML =
    [1, 2, 3]
      .map(
        place => {
          const entry =
            latest
              ?.podium
              ?.find(
                item =>
                  item.place ===
                  place
              );

          return `
            <div
              class="podiumCard place${place}"
            >

              <div class="podiumPlace">
                ${
                  [
                    '',
                    '🥇',
                    '🥈',
                    '🥉'
                  ][place]
                }
                ${place}位
              </div>

              <div class="podiumName">
                ${
                  entry
                    ? escapeHtml(
                        entry.name
                      )
                    : '該当なし'
                }
              </div>

              <div class="podiumNumber">
                ${
                  entry
                    ? '数字 ' +
                      entry.number
                    : ''
                }
              </div>

            </div>
          `;
        }
      )
      .join('');
}

function renderUniqueHistory(
  history
) {
  if (!history.length) {
    selectedUniqueHistoryId =
      null;

    $('uniqueHistoryTabs')
      .innerHTML = '';

    $('uniqueHistorySummary')
      .textContent =
        '本番結果はまだありません';

    $('uniqueChart')
      .innerHTML = '';

    return;
  }

  const selectedExists =
    selectedUniqueHistoryId &&
    history.some(
      entry =>
        entry.historyId ===
        selectedUniqueHistoryId
    );

  if (!selectedExists) {
    selectedUniqueHistoryId =
      history
        .at(-1)
        .historyId;
  }

  $('uniqueHistoryTabs')
    .innerHTML =
      history
        .map(
          entry => `
            <button
              type="button"
              class="${
                entry.historyId ===
                selectedUniqueHistoryId
                  ? 'on'
                  : ''
              }"
              data-unique-history="${
                entry.historyId
              }"
            >
              第${entry.roundNumber}ラウンド
            </button>
          `
        )
        .join('');

  document
    .querySelectorAll(
      '[data-unique-history]'
    )
    .forEach(
      button => {
        button.onclick =
          () => {
            selectedUniqueHistoryId =
              button.dataset
                .uniqueHistory;

            renderUniqueHistory(
              history
            );
          };
      }
    );

  const selected =
    history.find(
      entry =>
        entry.historyId ===
        selectedUniqueHistoryId
    );

  const podiumText =
    (
      selected.podium ||
      []
    )
      .map(
        entry =>
          entry.place +
          '位：' +
          escapeHtml(
            entry.name
          ) +
          '（' +
          entry.number +
          '）'
      )
      .join('　');

  $('uniqueHistorySummary')
    .innerHTML =
      `
        第${selected.roundNumber}ラウンド
        　回答 ${selected.answerCount}人
        　勝利数字 ${
          selected.winningNumber ??
          'なし'
        }
        <br>
        ${
          podiumText ||
          'ユニーク数字なし'
        }
      `;

  const distributionMap =
    new Map(
      (
        selected.distribution ||
        []
      ).map(
        entry => [
          entry.number,
          entry
        ]
      )
    );

  const maxCount =
    Math.max(
      1,

      ...(
        selected.distribution ||
        []
      ).map(
        entry =>
          entry.count
      )
    );

  $('uniqueChart').innerHTML =
    Array.from(
      {
        length: 100
      },

      (
        _,
        index
      ) => {
        const number =
          index + 1;

        const entry =
          distributionMap.get(
            number
          );

        const count =
          entry?.count || 0;

        const height =
          count
            ? Math.max(
                5,

                Math.round(
                  count /
                    maxCount *
                    255
                )
              )
            : 0;

        const barClass =
          entry?.winner
            ? 'winner'
            : entry?.unique
              ? 'unique'
              : '';

        return `
          <div class="barColumn">

            <div
              class="chartBar ${barClass}"
              style="height: ${height}px;"
            >
              ${
                count
                  ? `
                    <span class="barCount">
                      ${count}
                    </span>
                  `
                  : ''
              }
            </div>

            <span class="barNumber">
              ${number}
            </span>

          </div>
        `;
      }
    ).join('');
}

/* テンポランキング */

function renderTempoViews(
  history,
  overallBoard
) {
  const rounds =
    history
      .filter(Boolean)
      .map(
        entry => ({
          key:
            String(
              entry.index
            ),

          label:
            '第' +
            (
              entry.index +
              1
            ) +
            'ラウンド',

          tempoMs:
            entry.tempoMs,

          board:
            entry.board ||
            []
        })
      );

  const views = [
    ...rounds,

    {
      key: 'overall',
      label: '総合',
      tempoMs: null,

      board:
        overallBoard ||
        []
    }
  ];

  const exists =
    views.some(
      entry =>
        entry.key ===
        selectedTempoView
    );

  if (!exists) {
    selectedTempoView =
      rounds[0]?.key ||
      'overall';
  }

  $('tempoTopTabs')
    .innerHTML =
      views
        .map(
          entry => `
            <button
              type="button"
              class="${
                entry.key ===
                selectedTempoView
                  ? 'on'
                  : ''
              }"
              data-tempo-view="${entry.key}"
            >
              ${entry.label}
            </button>
          `
        )
        .join('');

  document
    .querySelectorAll(
      '[data-tempo-view]'
    )
    .forEach(
      button => {
        button.onclick =
          () => {
            selectedTempoView =
              button.dataset
                .tempoView;

            page = 1;

            renderTempoViews(
              history,
              overallBoard
            );
          };
      }
    );

  const selected =
    views.find(
      entry =>
        entry.key ===
        selectedTempoView
    ) ||
    views.at(-1);

  $('title').textContent =
    '🎵 テンポゲーム ' +
    selected.label +
    'ランキング';

  $('tempoInfo').textContent =
    selected.tempoMs
      ? selected.label +
        '　見本テンポ ' +
        (
          selected.tempoMs /
          1000
        ).toFixed(1) +
        '秒'
      : '本番3ラウンドすべての平均による総合ランキング';

  renderStandardBoard(
    selected.board,
    'ms'
  );
}

/* ランキング画面切替 */

function renderBoard(data) {
  const stats =
    data.stats ||
    {};

  const board =
    data.board ||
    [];

  const isUnique =
    stats.mode ===
    'unique';

  const isTempo =
    stats.mode ===
    'tempo';

  $('board')
    .classList.toggle(
      'hidden',
      isUnique
    );

  $('podium')
    .classList.toggle(
      'hidden',
      !isUnique
    );

  $('awards')
    .classList.toggle(
      'hidden',
      isUnique ||
      isTempo
    );

  $('uniqueHistory')
    .classList.toggle(
      'hidden',
      !isUnique
    );

  $('tempoTopTabs')
    .classList.toggle(
      'hidden',
      !isTempo
    );

  $('tempoInfo')
    .classList.toggle(
      'hidden',
      !isTempo
    );

  if (isUnique) {
    $('title').textContent =
      '🎃 最大ユニークナンバー 結果';

    $('pager').innerHTML =
      '';

    renderUniquePodium(
      data.uniqueHistory ||
      []
    );

    renderUniqueHistory(
      data.uniqueHistory ||
      []
    );

    return;
  }

  if (isTempo) {
    renderTempoViews(
      data.tempoHistory ||
      [],

      board
    );

    return;
  }

  $('tempoTopTabs')
    .innerHTML = '';

  $('title').textContent =
    stats.mode === 'tap'
      ? '🏆 連打5秒ランキング'
      : '🏆 反射神経ランキング';

  renderStandardBoard(
    board,

    stats.mode === 'tap'
      ? '回'
      : 'ms'
  );

  $('booby').textContent =
    data.booby?.prize
      ?.join('、') ||
    '該当なし';

  $('maker').textContent =
    data.booby?.maker
      ?.join('、') ||
    '該当なし';
}

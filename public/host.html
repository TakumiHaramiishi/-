<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">

  <meta
    name="viewport"
    content="width=device-width,initial-scale=1"
  >

  <title>
    技能人財養成部 ハロウィンパーティー｜司会画面
  </title>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      min-height: 100%;
      margin: 0;

      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Hiragino Kaku Gothic ProN",
        "Noto Sans JP",
        sans-serif;

      background: #120b1e;
      color: #ffffff;
    }

    button {
      font: inherit;
    }

    .hidden {
      display: none !important;
    }

    .wrap {
      display: grid;
      grid-template-columns:
        350px
        minmax(0, 1fr);

      min-height: 100vh;
    }

    .side {
      padding: 9px 11px;

      overflow-y: auto;

      border-right:
        2px solid #f28a24;

      background:
        linear-gradient(
          180deg,
          #321747,
          #1b1029
        );
    }

    .main {
      min-width: 0;
      padding: 14px 18px;

      overflow-y: auto;

      background:
        radial-gradient(
          circle at 80% 0,
          #301840,
          #120b1e 55%
        );
    }

    h1,
    h2 {
      margin: 0.2em 0;
    }

    .hostTitle {
      margin: 0 0 7px;

      color: #ff9c2e;

      font-size: 1.28rem;
      line-height: 1.2;
      text-align: center;
      white-space: nowrap;
    }

    .qr {
      display: flex;
      align-items: center;
      justify-content: center;

      min-height: 108px;
      padding: 4px;

      border-radius: 11px;

      background: #ffffff;
      color: #12303f;
    }

    .qr img {
      width: 102px;
      height: 102px;
    }

    .stats {
      display: grid;
      grid-template-columns:
        repeat(
          4,
          minmax(0, 1fr)
        );
      gap: 4px;

      margin-top: 6px;
    }

    .card {
      padding: 5px 2px;

      border-radius: 8px;

      background: #42245a;

      font-size: 0.7rem;
      text-align: center;
    }

    .card b {
      display: block;

      color: #ffb257;

      font-size: 1.22rem;
      line-height: 1.1;
      font-variant-numeric:
        tabular-nums;
    }

    .status {
      margin-top: 6px;
      padding: 8px 9px;

      border-radius: 9px;

      background: #3c2550;

      font-size: 0.86rem;
      line-height: 1.35;
    }

    .status.ok {
      background: #17633a;
    }

    .status.warn {
      background: #8b6914;
    }

    .status.playing {
      background: #075b87;
    }

    .detail {
      margin-top: 4px;

      color: #ffd2d2;

      font-size: 0.76rem;
      line-height: 1.4;
    }

    .group {
      margin-top: 6px;
      padding: 7px;

      border-radius: 10px;

      background: #321c45;
    }

    .groupTitle {
      margin-bottom: 5px;

      font-size: 0.82rem;
      font-weight: 800;
    }

    .buttons {
      display: flex;
      flex-wrap: wrap;
      gap: 4px;
    }

    .buttons button,
    .action {
      padding: 8px 8px;

      border:
        2px solid #6e4d84;
      border-radius: 9px;

      background: #43235c;
      color: #ffffff;

      font-size: 0.88rem;
      font-weight: 800;

      cursor: pointer;
    }

    .buttons button.on {
      border-color: #ffb257;

      background: #ef7f1a;
    }

    .gameButtons {
      display: grid;
      grid-template-columns:
        repeat(
          4,
          minmax(0, 1fr)
        );
      gap: 4px;
    }

    .gameButtons button {
      min-width: 0;
      padding: 8px 2px;

      font-size: 0.78rem;
      white-space: nowrap;
    }

    .durationButtons {
      display: grid;
      grid-template-columns:
        repeat(
          3,
          minmax(0, 1fr)
        );
      gap: 4px;

      margin-top: 5px;
    }

    .durationButtons button {
      min-width: 0;
      padding: 7px 2px;
    }

    .modeButtons {
      display: grid;
      grid-template-columns:
        1fr 1fr;
      gap: 4px;
    }

    .modeButtons button {
      min-width: 0;
    }

    .action {
      width: 100%;
      margin-top: 6px;
      padding: 10px 7px;

      border: 0;
    }

    .action:disabled {
      opacity: 0.45;
      cursor: default;
    }

    .start {
      background: #27ae60;
    }

    .orange {
      background: #d07816;
    }

    .purple {
      background: #843bad;
    }

    .reset {
      background: #526d88;
    }

    .danger {
      background: #8e3b3b;
    }

    .resetRow {
      display: grid;
      grid-template-columns:
        1fr 1fr;
      gap: 5px;
    }

    .resetRow .action {
      width: 100%;
      font-size: 0.8rem;
    }

    .pager {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 5px;

      margin: 7px 0;
    }

    .pager button {
      padding: 6px 9px;

      border:
        1px solid #80599a;
      border-radius: 8px;

      background: #442558;
      color: #ffffff;

      cursor: pointer;
    }

    .pager button.on {
      border-color: #ffb257;

      background: #ef7f1a;
    }

    .pager span {
      margin-left: auto;

      color: #c7b8d2;

      font-size: 0.82rem;
    }

    .board {
      display: grid;
      grid-template-columns:
        repeat(
          3,
          minmax(0, 1fr)
        );
      gap: 7px;
    }

    .rank {
      display: grid;
      grid-template-columns:
        46px
        minmax(0, 1fr)
        auto
        auto;
      align-items: center;
      gap: 8px;

      min-height: 56px;
      padding: 7px 9px;

      border-radius: 9px;

      background: #2a183b;
    }

    .rank:nth-child(even) {
      background: #321d45;
    }

    .rank b {
      font-size: 1.34rem;
      text-align: center;
    }

    .rankName {
      min-width: 0;

      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;

      font-size: 1.29rem;
      font-weight: 800;
    }

    .score {
      white-space: nowrap;

      color: #ffd08a;

      font-size: 1.23rem;
      font-weight: 900;
      font-variant-numeric:
        tabular-nums;
    }

    .tries {
      white-space: nowrap;

      color: #c7b8d2;

      font-size: 0.86rem;
    }

    .top1 {
      background: #f1c40f !important;
      color: #20142b;
    }

    .top2 {
      background: #bdc3c7 !important;
      color: #20142b;
    }

    .top3 {
      background: #cd7f32 !important;
      color: #20142b;
    }

    .top1 .score,
    .top2 .score,
    .top3 .score,
    .top1 .tries,
    .top2 .tries,
    .top3 .tries {
      color: #20142b;
    }

    .rankPlaceholder {
      min-height: 56px;

      visibility: hidden;

      pointer-events: none;
    }

    .panel,
    .award {
      padding: 11px;

      border-radius: 11px;

      background: #2f1b41;
    }

    .awards {
      display: grid;
      grid-template-columns:
        1fr 1fr;
      gap: 9px;

      margin-top: 11px;
    }

    .podium {
      display: grid;
      grid-template-columns:
        repeat(
          3,
          minmax(0, 1fr)
        );
      gap: 9px;

      margin: 10px 0;
    }

    .podium > div {
      padding: 13px;

      border-radius: 11px;

      background: #2f1b41;

      font-size: 1.15rem;
      font-weight: 900;
      text-align: center;
    }

    .history {
      margin-top: 10px;
      padding: 12px;

      border:
        1px solid #744c90;
      border-radius: 11px;

      background: #21132f;
    }

    .historyTabs {
      display: flex;
      flex-wrap: wrap;
      gap: 5px;

      margin: 8px 0;
    }

    .historyTabs button {
      padding: 7px 10px;

      border:
        1px solid #8359a0;
      border-radius: 8px;

      background: #442558;
      color: #ffffff;

      font-weight: 800;
      cursor: pointer;
    }

    .historyTabs button.on {
      border-color: #ffb257;

      background: #ef7f1a;
    }

    .historySummary {
      margin-bottom: 7px;
      padding: 9px;

      border-radius: 9px;

      background: #402655;

      line-height: 1.5;
    }

    .legend {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;

      margin: 7px 0;

      font-size: 0.8rem;
    }

    .legend i {
      display: inline-block;

      width: 12px;
      height: 12px;
      margin-right: 4px;

      border-radius: 2px;
    }

    .chartScroll {
      overflow-x: auto;
      padding-bottom: 8px;
    }

    .chart {
      display: flex;
      align-items: flex-end;
      gap: 3px;

      min-width: 1000px;
      height: 280px;
      padding:
        28px
        12px
        25px;

      border-left:
        1px solid #86699a;
      border-bottom:
        1px solid #86699a;

      background: #170d22;
    }

    .barColumn {
      position: relative;

      display: flex;
      align-items: flex-end;

      width: 8px;
      height: 100%;
    }

    .chartBar {
      position: relative;

      width: 100%;

      border-radius:
        3px 3px 0 0;

      background: #80549c;
    }

    .chartBar.unique {
      background: #2fbc72;
    }

    .chartBar.winner {
      background: #ffd447;

      box-shadow:
        0 0 10px #ffd447;
    }

    .barNumber {
      position: absolute;
      bottom: -19px;
      left: 50%;

      color: #bcaac8;

      font-size: 8px;

      transform:
        translateX(-50%);
    }

    .barCount {
      position: absolute;
      top: -17px;
      left: 50%;

      color: #ffffff;

      font-size: 8px;

      transform:
        translateX(-50%);
    }

    @media (
      max-width: 1050px
    ) {
      .wrap {
        grid-template-columns:
          330px
          minmax(0, 1fr);
      }

      .side {
        padding:
          8px 9px;
      }

      .hostTitle {
        font-size: 1.16rem;
      }
    }

    @media (
      max-width: 800px
    ) {
      .wrap {
        grid-template-columns:
          1fr;
      }

      .side {
        border-right: 0;
        border-bottom:
          2px solid #f28a24;
      }

      .board {
        grid-template-columns:
          1fr;
      }

      .rankPlaceholder {
        display: none;
      }

      .podium {
        grid-template-columns:
          1fr;
      }
    }
  </style>
</head>

<body>
  <div class="wrap">
    <aside class="side">
      <h1 class="hostTitle">
        🎃 ハロウィンパーティー 👻
      </h1>

      <div
        id="qr"
        class="qr"
      >
        QR生成中…
      </div>

      <div class="stats">
        <div class="card">
          <b id="joined">0</b>
          参加
        </div>

        <div class="card">
          <b id="standby">0</b>
          待機
        </div>

        <div class="card">
          <b id="answered">0</b>
          完了
        </div>

        <div class="card">
          <b id="missing">0</b>
          要確認
        </div>
      </div>

      <div
        id="status"
        class="status"
      >
        状態確認中
      </div>

      <div
        id="detail"
        class="detail"
      ></div>

      <div class="group">
        <div class="groupTitle">
          🎮 ゲーム選択
        </div>

        <div class="gameButtons">
          <button
            type="button"
            id="reflex"
            class="on"
          >
            反射
          </button>

          <button
            type="button"
            id="tap"
          >
            連打
          </button>

          <button
            type="button"
            id="unique"
          >
            ユニーク
          </button>

          <button
            type="button"
            id="tempo"
          >
            テンポ
          </button>
        </div>

        <div
          id="durations"
          class="durationButtons hidden"
        >
          <button
            type="button"
            data-duration="5"
          >
            5秒
          </button>

          <button
            type="button"
            data-duration="7"
            class="on"
          >
            7秒
          </button>

          <button
            type="button"
            data-duration="10"
          >
            10秒
          </button>
        </div>
      </div>

      <div
        id="modeGroup"
        class="group"
      >
        <div class="groupTitle">
          モード
        </div>

        <div class="modeButtons">
          <button
            type="button"
            id="official"
            class="on"
          >
            本番
          </button>

          <button
            type="button"
            id="practice"
          >
            練習
          </button>
        </div>
      </div>

      <button
        type="button"
        id="mainAction"
        class="action start"
      >
        反射神経を開始
      </button>

      <button
        type="button"
        id="force"
        class="action orange hidden"
      >
        未完了者ありで結果確定
      </button>

      <div class="resetRow">
        <button
          type="button"
          id="reset"
          class="action reset"
        >
          記録リセット
        </button>

        <button
          type="button"
          id="resetAll"
          class="action danger"
        >
          全リセット
        </button>
      </div>
    </aside>

    <main class="main">
      <h2 id="title">
        🏆 反射神経ランキング
      </h2>

      <div
        id="tempoInfo"
        class="status hidden"
      ></div>

      <div
        id="pager"
        class="pager"
      ></div>

      <div
        id="board"
        class="board"
      >
        <div class="panel">
          記録なし
        </div>
      </div>

      <div
        id="podium"
        class="podium hidden"
      ></div>

      <div
        id="awards"
        class="awards"
      >
        <div class="award">
          <b>
            🎁 ブービー賞
          </b>

          <div id="booby">
            該当なし
          </div>
        </div>

        <div class="award">
          <b>
            🫣 ブービーメーカー
          </b>

          <div id="maker">
            該当なし
          </div>
        </div>
      </div>

      <section
        id="uniqueHistory"
        class="history hidden"
      >
        <h2>
          🧠 最大ユニーク
          過去ラウンド分析
        </h2>

        <div
          id="uniqueHistoryTabs"
          class="historyTabs"
        ></div>

        <div
          id="uniqueHistorySummary"
          class="historySummary"
        >
          本番結果はまだありません
        </div>

        <div class="legend">
          <span>
            <i
              style="background: #80549c;"
            ></i>
            重複
          </span>

          <span>
            <i
              style="background: #2fbc72;"
            ></i>
            ユニーク
          </span>

          <span>
            <i
              style="background: #ffd447;"
            ></i>
            勝利数字
          </span>
        </div>

        <div class="chartScroll">
          <div
            id="uniqueChart"
            class="chart"
          ></div>
        </div>
      </section>

      <section
        id="tempoHistory"
        class="history hidden"
      >
        <h2>
          🎵 テンポゲーム
          ラウンド別ランキング
        </h2>

        <div
          id="tempoHistoryTabs"
          class="historyTabs"
        ></div>

        <div
          id="tempoHistorySummary"
          class="historySummary"
        >
          本番結果はまだありません
        </div>
      </section>
    </main>
  </div>

  <script>
    'use strict';

    const $ = id =>
      document.getElementById(id);

    const PAGE_SIZE = 30;
    const ROWS_PER_COLUMN = 10;

    let mode = 'reflex';
    let duration = 7;
    let practice = false;

    let currentData = {};
    let page = 1;

    let selectedUniqueHistoryId =
      null;

    let selectedTempoView =
      'overall';

    /* =====================================================
       HTTP
       ===================================================== */

    async function post(
      url,
      body = {}
    ) {
      const response =
        await fetch(
          url,
          {
            method: 'POST',

            headers: {
              'Content-Type':
                'application/json'
            },

            cache: 'no-store',

            body:
              JSON.stringify(body)
          }
        );

      let responseData = {};

      try {
        responseData =
          await response.json();
      } catch {
        responseData = {};
      }

      if (!response.ok) {
        const requestError =
          new Error(
            JSON.stringify(
              responseData
            )
          );

        requestError.status =
          response.status;

        throw requestError;
      }

      return responseData;
    }

    function escapeHtml(value) {
      return String(value || '')
        .replace(
          /[<>&"]/g,
          character => ({
            '<': '&lt;',
            '>': '&gt;',
            '&': '&amp;',
            '"': '&quot;'
          })[character]
        );
    }

    /* =====================================================
       QRコード
       ===================================================== */

    function createQrCode() {
      const joinUrl =
        location.origin + '/';

      const libraryParts = [
        'https:',
        '',
        'cdn.jsdelivr.net',
        'npm',
        'qrcode-generator@1.4.4',
        'qrcode.js'
      ];

      const script =
        document.createElement(
          'script'
        );

      script.src =
        libraryParts.join('/');

      script.onload = () => {
        try {
          const qr =
            window.qrcode(
              0,
              'M'
            );

          qr.addData(joinUrl);
          qr.make();

          $('qr').innerHTML =
            qr.createImgTag(
              4,
              4
            );
        } catch {
          $('qr').textContent =
            'QR生成失敗';
        }
      };

      script.onerror = () => {
        $('qr').textContent =
          'QR読込失敗';
      };

      document.head.appendChild(
        script
      );
    }

    /* =====================================================
       画面選択
       ===================================================== */

    function gameName(
      gameMode
    ) {
      if (gameMode === 'tap') {
        return (
          '連打' +
          duration +
          '秒'
        );
      }

      if (
        gameMode === 'unique'
      ) {
        return '最大ユニーク';
      }

      if (
        gameMode === 'tempo'
      ) {
        return 'テンポゲーム';
      }

      return '反射神経';
    }

    function choose(
      nextMode
    ) {
      mode = nextMode;
      page = 1;

      selectRanking();
    }

    async function selectRanking() {
      [
        'reflex',
        'tap',
        'unique',
        'tempo'
      ].forEach(gameMode => {
        $(gameMode)
          .classList.toggle(
            'on',
            gameMode === mode
          );
      });

      $('durations')
        .classList.toggle(
          'hidden',
          mode !== 'tap'
        );

      /*
       * テンポでも本番／練習を
       * 自由に選べます。
       */
      $('modeGroup')
        .classList.remove(
          'hidden'
        );

      $('uniqueHistory')
        .classList.toggle(
          'hidden',
          mode !== 'unique'
        );

      $('tempoHistory')
        .classList.toggle(
          'hidden',
          mode !== 'tempo'
        );

      try {
        currentData =
          await post(
            '/api/select-ranking',
            {
              mode,
              duration
            }
          );

        render(currentData);
      } catch {
        alert(
          'ランキングを切り替えられませんでした'
        );
      }
    }

    [
      'reflex',
      'tap',
      'unique',
      'tempo'
    ].forEach(gameMode => {
      $(gameMode).onclick =
        () => {
          choose(gameMode);
        };
    });

    document
      .querySelectorAll(
        '[data-duration]'
      )
      .forEach(button => {
        button.onclick = () => {
          duration =
            Number(
              button.dataset
                .duration
            );

          page = 1;

          document
            .querySelectorAll(
              '[data-duration]'
            )
            .forEach(
              durationButton => {
                durationButton
                  .classList.toggle(
                    'on',
                    durationButton ===
                      button
                  );
              }
            );

          selectRanking();
        };
      });

    $('official').onclick = () => {
      practice = false;
      updateButtons();
    };

    $('practice').onclick = () => {
      practice = true;
      updateButtons();
    };

    /* =====================================================
       操作ボタン
       ===================================================== */

    function updateButtons() {
      const stats =
        currentData.stats || {};

      $('official')
        .classList.toggle(
          'on',
          !practice
        );

      $('practice')
        .classList.toggle(
          'on',
          practice
        );

      const canForce =
        stats.active &&
        [
          'reflex',
          'tap',
          'tempo'
        ].includes(
          stats.activeMode
        );

      $('force')
        .classList.toggle(
          'hidden',
          !canForce
        );

      if (mode === 'unique') {
        const uniqueStatus =
          stats.uniqueStatus ||
          'idle';

        if (
          uniqueStatus ===
          'open'
        ) {
          $('mainAction')
            .textContent =
              '回答を締め切る';

          $('mainAction')
            .className =
              'action orange';
        } else if (
          uniqueStatus ===
          'closed'
        ) {
          $('mainAction')
            .textContent =
              '結果を発表する';

          $('mainAction')
            .className =
              'action purple';
        } else {
          $('mainAction')
            .textContent =
              '回答受付開始' +
              (
                practice
                  ? '［練習］'
                  : ''
              );

          $('mainAction')
            .className =
              'action start';
        }

        $('mainAction').disabled =
          false;

        return;
      }

      if (mode === 'tempo') {
        $('mainAction')
          .className =
            'action start';

        if (
          stats.activeMode ===
            'tempo' &&
          stats.active
        ) {
          $('mainAction')
            .textContent =
              (
                stats.roundCompleted ||
                0
              ) +
              '/' +
              (
                stats.joined ||
                0
              ) +
              '人完了';

          $('mainAction').disabled =
            true;

          return;
        }

        if (practice) {
          $('mainAction')
            .textContent =
              'テンポ開始［練習］';

          $('mainAction').disabled =
            false;

          return;
        }

        if (
          (
            stats.tempoNext ||
            0
          ) < 3
        ) {
          $('mainAction')
            .textContent =
              'テンポ 本番 第' +
              (
                (
                  stats.tempoNext ||
                  0
                ) + 1
              ) +
              'ラウンド開始';

          $('mainAction').disabled =
            false;

          return;
        }

        $('mainAction')
          .textContent =
            'テンポ本番完了';

        $('mainAction').disabled =
          true;

        return;
      }

      $('mainAction').textContent =
        (
          mode === 'tap'
            ? '連打' +
              duration +
              '秒'
            : '反射神経'
        ) +
        'を開始' +
        (
          practice
            ? '［練習］'
            : ''
        );

      $('mainAction').className =
        'action start';

      $('mainAction').disabled =
        Boolean(stats.active);
    }

    $('mainAction').onclick =
      async () => {
        const stats =
          currentData.stats || {};

        try {
          if (
            mode === 'unique'
          ) {
            const action =
              stats.uniqueStatus ===
                'open'
                ? 'close'
                : stats.uniqueStatus ===
                    'closed'
                  ? 'reveal'
                  : 'open';

            await post(
              '/api/unique',
              {
                action,
                practice
              }
            );

            return;
          }

          if (
            mode === 'tempo'
          ) {
            await post(
              '/api/tempo/start',
              {
                practice,

                index:
                  stats.tempoNext ||
                  0
              }
            );

            return;
          }

          await post(
            '/api/start',
            {
              mode,
              duration,
              practice
            }
          );
        } catch {
          alert(
            '操作できませんでした'
          );
        }
      };

    $('force').onclick =
      async () => {
        const confirmed =
          confirm(
            '未完了者がいても結果を確定しますか？'
          );

        if (!confirmed) {
          return;
        }

        try {
          await post(
            '/api/finish-active'
          );
        } catch {
          alert(
            '結果を確定できませんでした'
          );
        }
      };

    $('reset').onclick =
      async () => {
        const confirmed =
          confirm(
            '全ゲームの記録をリセットしますか？'
          );

        if (!confirmed) {
          return;
        }

        try {
          await post(
            '/api/reset'
          );
        } catch {
          alert(
            '記録をリセットできませんでした'
          );
        }
      };

    $('resetAll').onclick =
      async () => {
        const confirmed =
          confirm(
            '参加者を含めて全リセットしますか？'
          );

        if (!confirmed) {
          return;
        }

        try {
          await post(
            '/api/reset-all'
          );
        } catch {
          alert(
            '全リセットできませんでした'
          );
        }
      };

    /* =====================================================
       状態表示
       ===================================================== */

    function render(data) {
      currentData = data;

      const stats =
        data.stats || {};

      $('joined').textContent =
        stats.joined || 0;

      $('standby').textContent =
        stats.standby || 0;

      $('answered').textContent =
        stats.roundCompleted || 0;

      /*
       * answering / result / playingなどは
       * 要確認へ表示しません。
       */
      const issues =
        (
          stats.detail || []
        ).filter(entry =>
          [
            '切断・未確認',
            '画面非表示'
          ].includes(
            entry.state
          )
        );

      $('missing').textContent =
        issues.length;

      $('detail').innerHTML =
        issues
          .map(
            entry =>
              escapeHtml(
                entry.name
              ) +
              '：' +
              escapeHtml(
                entry.state
              )
          )
          .join('<br>');

      if (stats.active) {
        $('status').textContent =
          '▶ ' +
          gameName(
            stats.activeMode
          ) +
          '：進行中　完了 ' +
          (
            stats.roundCompleted ||
            0
          ) +
          '/' +
          (
            stats.joined ||
            0
          );

        $('status').className =
          'status playing';
      } else if (
        !issues.length
      ) {
        /*
         * 「直前の結果を確認」中も
         * player.htmlからstandbyとして通知されます。
         */
        $('status').textContent =
          '✓ ゲーム開始可能';

        $('status').className =
          'status ok';
      } else {
        $('status').textContent =
          '⚠ ' +
          issues.length +
          '人を要確認';

        $('status').className =
          'status warn';
      }

      $('tempoInfo')
        .classList.toggle(
          'hidden',
          stats.mode !==
            'tempo'
        );

      if (
        stats.mode === 'tempo'
      ) {
        $('tempoInfo').textContent =
          stats.tempoMs
            ? (
                '今回のテンポ：' +
                (
                  stats.tempoMs /
                  1000
                ).toFixed(1) +
                '秒'
              )
            : (
                '本番は速め・標準・遅めを1回ずつ抽選'
              );
      }

      renderBoard(data);
      updateButtons();
    }

    /* =====================================================
       ランキング共通
       ===================================================== */

    function formatRank(
      rankNumber
    ) {
      if (
        rankNumber === 1
      ) {
        return '🥇';
      }

      if (
        rankNumber === 2
      ) {
        return '🥈';
      }

      if (
        rankNumber === 3
      ) {
        return '🥉';
      }

      return rankNumber;
    }

    function rankClass(
      rankNumber
    ) {
      if (
        rankNumber === 1
      ) {
        return 'top1';
      }

      if (
        rankNumber === 2
      ) {
        return 'top2';
      }

      if (
        rankNumber === 3
      ) {
        return 'top3';
      }

      return '';
    }

    function rankingCard(
      record,
      unit
    ) {
      return `
        <div
          class="rank ${rankClass(
            record.rank
          )}"
          title="${escapeHtml(
            record.name
          )}"
        >
          <b>
            ${formatRank(
              record.rank
            )}
          </b>

          <span class="rankName">
            ${escapeHtml(
              record.name
            )}
          </span>

          <span class="score">
            ${record.score}${unit}
          </span>

          <span class="tries">
            ${record.tries || 0}回
          </span>
        </div>
      `;
    }

    function reorderPageRecords(
      records
    ) {
      const ordered = [];

      /*
       * 1、11、21
       * 2、12、22
       * の順に配置します。
       */
      for (
        let row = 0;
        row <
          ROWS_PER_COLUMN;
        row += 1
      ) {
        for (
          let column = 0;
          column < 3;
          column += 1
        ) {
          const index =
            row +
            column *
              ROWS_PER_COLUMN;

          ordered.push(
            records[index] ||
            null
          );
        }
      }

      return ordered;
    }

    function renderStandardBoard(
      board,
      unit
    ) {
      const pageCount =
        Math.max(
          1,
          Math.ceil(
            board.length /
            PAGE_SIZE
          )
        );

      page = Math.max(
        1,
        Math.min(
          page,
          pageCount
        )
      );

      const startIndex =
        (
          page - 1
        ) *
        PAGE_SIZE;

      const endIndex =
        Math.min(
          startIndex +
            PAGE_SIZE,
          board.length
        );

      const pageRecords =
        board.slice(
          startIndex,
          endIndex
        );

      const displayRecords =
        reorderPageRecords(
          pageRecords
        );

      if (
        pageCount > 1
      ) {
        $('pager').innerHTML =
          Array.from(
            {
              length:
                pageCount
            },
            (
              _,
              index
            ) => {
              const pageNumber =
                index + 1;

              return `
                <button
                  type="button"
                  class="${
                    pageNumber ===
                    page
                      ? 'on'
                      : ''
                  }"
                  data-page="${pageNumber}"
                >
                  ${pageNumber}
                </button>
              `;
            }
          ).join('') +
          `
            <span>
              ${
                startIndex + 1
              }～${endIndex}位 /
              ${board.length}人
            </span>
          `;

        document
          .querySelectorAll(
            '[data-page]'
          )
          .forEach(button => {
            button.onclick =
              () => {
                page =
                  Number(
                    button.dataset
                      .page
                  );

                renderBoard(
                  currentData
                );
              };
          });
      } else {
        $('pager').innerHTML =
          '';
      }

      if (!board.length) {
        $('board').innerHTML =
          `
            <div class="panel">
              記録なし
            </div>
          `;

        return;
      }

      /*
       * 空き枠にも透明セルを入れるため、
       * 最終ページの列順が崩れません。
       */
      $('board').innerHTML =
        displayRecords
          .map(record =>
            record
              ? rankingCard(
                  record,
                  unit
                )
              : `
                <div
                  class="rankPlaceholder"
                ></div>
              `
          )
          .join('');
    }

    /* =====================================================
       最大ユニーク
       ===================================================== */

    function renderUniquePodium(
      history
    ) {
      const latestResult =
        currentData
          .uniqueResult ||
        history.at(-1);

      $('podium').innerHTML =
        [1, 2, 3]
          .map(place => {
            const entry =
              latestResult
                ?.podium
                ?.find(
                  item =>
                    item.place ===
                    place
                );

            return `
              <div>
                ${
                  [
                    '',
                    '🥇',
                    '🥈',
                    '🥉'
                  ][place]
                }
                ${place}位
                <br>

                ${
                  entry
                    ? (
                        escapeHtml(
                          entry.name
                        ) +
                        '<br>' +
                        '数字 ' +
                        entry.number
                      )
                    : '該当なし'
                }
              </div>
            `;
          })
          .join('');
    }

    function renderUniqueHistory(
      history
    ) {
      if (!history.length) {
        selectedUniqueHistoryId =
          null;

        $('uniqueHistoryTabs')
          .innerHTML = '';

        $('uniqueHistorySummary')
          .textContent =
            '本番結果はまだありません';

        $('uniqueChart')
          .innerHTML = '';

        return;
      }

      const selectedExists =
        selectedUniqueHistoryId &&
        history.some(
          entry =>
            entry.historyId ===
            selectedUniqueHistoryId
        );

      if (!selectedExists) {
        selectedUniqueHistoryId =
          history
            .at(-1)
            .historyId;
      }

      $('uniqueHistoryTabs')
        .innerHTML =
          history
            .map(entry => `
              <button
                type="button"
                class="${
                  entry.historyId ===
                  selectedUniqueHistoryId
                    ? 'on'
                    : ''
                }"
                data-unique-history="${
                  entry.historyId
                }"
              >
                第${
                  entry.roundNumber
                }ラウンド
              </button>
            `)
            .join('');

      document
        .querySelectorAll(
          '[data-unique-history]'
        )
        .forEach(button => {
          button.onclick =
            () => {
              selectedUniqueHistoryId =
                button.dataset
                  .uniqueHistory;

              renderUniqueHistory(
                history
              );
            };
        });

      const selected =
        history.find(
          entry =>
            entry.historyId ===
            selectedUniqueHistoryId
        );

      const podiumText =
        (
          selected.podium ||
          []
        )
          .map(
            entry =>
              entry.place +
              '位：' +
              escapeHtml(
                entry.name
              ) +
              '（' +
              entry.number +
              '）'
          )
          .join('　');

      $('uniqueHistorySummary')
        .innerHTML =
          `
            第${
              selected.roundNumber
            }ラウンド
            　回答 ${
              selected.answerCount
            }人
            　勝利数字 ${
              selected.winningNumber ??
              'なし'
            }
            <br>
            ${
              podiumText ||
              'ユニーク数字なし'
            }
          `;

      const distributionMap =
        new Map(
          (
            selected.distribution ||
            []
          ).map(entry => [
            entry.number,
            entry
          ])
        );

      const maxCount =
        Math.max(
          1,
          ...(
            selected.distribution ||
            []
          ).map(
            entry =>
              entry.count
          )
        );

      $('uniqueChart').innerHTML =
        Array.from(
          {
            length: 100
          },
          (
            _,
            index
          ) => {
            const number =
              index + 1;

            const entry =
              distributionMap.get(
                number
              );

            const count =
              entry?.count || 0;

            const height =
              count
                ? Math.max(
                    5,
                    Math.round(
                      count /
                      maxCount *
                      218
                    )
                  )
                : 0;

            const barClass =
              entry?.winner
                ? 'winner'
                : entry?.unique
                  ? 'unique'
                  : '';

            return `
              <div class="barColumn">
                <div
                  class="chartBar ${barClass}"
                  style="height: ${height}px;"
                >
                  ${
                    count
                      ? `
                        <span
                          class="barCount"
                        >
                          ${count}
                        </span>
                      `
                      : ''
                  }
                </div>

                <span class="barNumber">
                  ${number}
                </span>
              </div>
            `;
          }
        ).join('');
    }

    /* =====================================================
       テンポ履歴
       ===================================================== */

    function renderTempoHistory(
      history,
      overallBoard
    ) {
      const availableRounds =
        history
          .filter(Boolean)
          .map(entry => ({
            key:
              String(
                entry.index
              ),

            label:
              '第' +
              (
                entry.index +
                1
              ) +
              'ラウンド',

            tempoMs:
              entry.tempoMs,

            board:
              entry.board ||
              []
          }));

      const views = [
        ...availableRounds,

        {
          key: 'overall',
          label: '総合',
          tempoMs: null,

          board:
            overallBoard ||
            []
        }
      ];

      const selectedExists =
        views.some(
          entry =>
            entry.key ===
            selectedTempoView
        );

      if (!selectedExists) {
        selectedTempoView =
          availableRounds[0]
            ?.key ||
          'overall';
      }

      $('tempoHistoryTabs')
        .innerHTML =
          views
            .map(entry => `
              <button
                type="button"
                class="${
                  entry.key ===
                  selectedTempoView
                    ? 'on'
                    : ''
                }"
                data-tempo-view="${
                  entry.key
                }"
              >
                ${entry.label}
              </button>
            `)
            .join('');

      document
        .querySelectorAll(
          '[data-tempo-view]'
        )
        .forEach(button => {
          button.onclick =
            () => {
              selectedTempoView =
                button.dataset
                  .tempoView;

              page = 1;

              renderTempoHistory(
                history,
                overallBoard
              );
            };
        });

      const selected =
        views.find(
          entry =>
            entry.key ===
            selectedTempoView
        ) ||
        views.at(-1);

      $('tempoHistorySummary')
        .textContent =
          selected.tempoMs
            ? (
                selected.label +
                '　見本テンポ ' +
                (
                  selected.tempoMs /
                  1000
                ).toFixed(1) +
                '秒'
              )
            : (
                '本番3ラウンドすべての平均による総合ランキング'
              );

      $('title').textContent =
        '🎵 テンポゲーム ' +
        selected.label +
        'ランキング';

      renderStandardBoard(
        selected.board,
        'ms'
      );
    }

    /* =====================================================
       ランキング画面切替
       ===================================================== */

    function renderBoard(data) {
      const stats =
        data.stats || {};

      const board =
        data.board || [];

      const isUnique =
        stats.mode ===
        'unique';

      const isTempo =
        stats.mode ===
        'tempo';

      $('board')
        .classList.toggle(
          'hidden',
          isUnique
        );

      $('podium')
        .classList.toggle(
          'hidden',
          !isUnique
        );

      $('awards')
        .classList.toggle(
          'hidden',
          isUnique ||
          isTempo
        );

      $('uniqueHistory')
        .classList.toggle(
          'hidden',
          !isUnique
        );

      $('tempoHistory')
        .classList.toggle(
          'hidden',
          !isTempo
        );

      if (isUnique) {
        $('title').textContent =
          '🎃 最大ユニークナンバー 結果';

        $('pager').innerHTML =
          '';

        renderUniquePodium(
          data.uniqueHistory ||
          []
        );

        renderUniqueHistory(
          data.uniqueHistory ||
          []
        );

        return;
      }

      if (isTempo) {
        renderTempoHistory(
          data.tempoHistory ||
          [],
          board
        );

        return;
      }

      const unit =
        stats.mode === 'tap'
          ? '回'
          : 'ms';

      if (
        stats.mode === 'tap'
      ) {
        $('title').textContent =
          '🏆 連打' +
          stats.duration +
          '秒ランキング';
      } else {
        $('title').textContent =
          '🏆 反射神経ランキング';
      }

      renderStandardBoard(
        board,
        unit
      );

      $('booby').textContent =
        data.booby?.prize
          ?.join('、') ||
        '該当なし';

      $('maker').textContent =
        data.booby?.maker
          ?.join('、') ||
        '該当なし';
    }

    /* =====================================================
       SSE
       ===================================================== */

    const eventSource =
      new EventSource(
        '/events/host'
      );

    eventSource.addEventListener(
      'leaderboard',
      event => {
        render(
          JSON.parse(
            event.data
          )
        );
      }
    );

    createQrCode();
    selectRanking();
  </script>
</body>

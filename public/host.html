<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<title>反射神経＆連打バトル｜ホスト画面</title>

<style>
  * {
    box-sizing: border-box;
  }

  html,
  body {
    margin: 0;
    width: 100%;
    height: 100%;

    font-family:
      -apple-system,
      BlinkMacSystemFont,
      "Hiragino Kaku Gothic ProN",
      "Noto Sans JP",
      sans-serif;

    background: #0b1f33;
    color: #ffffff;
  }

  body {
    overflow: hidden;
  }

  .wrap {
    display: grid;
    grid-template-columns: 390px 1fr;

    width: 100%;
    height: 100vh;
  }

  .side {
    display: flex;
    flex-direction: column;
    gap: 11px;

    padding: 18px;

    overflow-y: auto;

    background: #0e2947;
  }

  .main {
    display: flex;
    flex-direction: column;

    min-width: 0;

    padding: 24px 32px;

    overflow: hidden;
  }

  h1 {
    margin: 0;
    font-size: 1.5rem;
  }

  .qr {
    min-height: 190px;

    display: flex;
    align-items: center;
    justify-content: center;

    padding: 10px;

    border-radius: 16px;

    background: #ffffff;
    color: #0b1f33;

    text-align: center;
  }

  .qr img {
    display: block;

    width: 170px;
    height: 170px;

    margin: 0 auto;

    image-rendering: pixelated;
  }

  .url {
    padding: 8px 10px;

    border-radius: 10px;

    background: #08315a;

    font-size: 0.78rem;
    line-height: 1.4;
    word-break: break-all;
  }

  .stat {
    display: flex;
    gap: 8px;
  }

  .card {
    flex: 1;

    padding: 8px 10px;

    border-radius: 12px;

    background: #08315a;

    text-align: center;
  }

  .card b {
    display: block;

    font-size: 1.7rem;
    font-variant-numeric: tabular-nums;
  }

  .card span {
    color: #9db8d6;
    font-size: 0.75rem;
  }

  .modebox {
    padding: 10px 12px;

    border-radius: 12px;

    background: #08315a;
  }

  .label {
    margin-bottom: 6px;

    color: #9db8d6;

    font-size: 0.82rem;
  }

  .seg {
    display: flex;
    gap: 6px;
  }

  .seg button {
    flex: 1;

    padding: 9px 4px;

    border: 2px solid #2a4d70;
    border-radius: 10px;

    background: transparent;
    color: #cfe0f2;

    font-size: 0.95rem;
    font-weight: 700;

    cursor: pointer;

    transition:
      background-color 0.15s,
      border-color 0.15s,
      transform 0.05s;
  }

  .seg button:hover {
    border-color: #5c88b3;
  }

  .seg button:active {
    transform: scale(0.98);
  }

  .seg button.on {
    border-color: #0067c0;

    background: #0067c0;
    color: #ffffff;
  }

  .duration-area {
    display: none;
    margin-top: 10px;
  }

  .view-status {
    padding: 9px 11px;

    border: 1px solid #315b84;
    border-radius: 10px;

    background: #092b4b;
    color: #cfe0f2;

    font-size: 0.85rem;
    line-height: 1.5;
  }

  .view-status strong {
    color: #ffffff;
  }

  button.action {
    padding: 14px;

    border: none;
    border-radius: 14px;

    font-size: 1.08rem;
    font-weight: 800;

    cursor: pointer;

    transition:
      opacity 0.15s,
      transform 0.05s;
  }

  button.action:active {
    transform: scale(0.98);
  }

  button.action:disabled {
    opacity: 0.55;
    cursor: default;
  }

  .start {
    background: #27ae60;
    color: #ffffff;
  }

  .reset {
    background: #43607f;
    color: #ffffff;

    font-size: 0.95rem;
  }

  .reset-all {
    background: #8e3b3b;
    color: #ffffff;

    font-size: 0.95rem;
  }

  .operation-note {
    color: #9db8d6;

    font-size: 0.78rem;
    line-height: 1.5;
  }

  .main-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;

    margin-bottom: 10px;
  }

  .main-header h2 {
    margin: 0;
    font-size: 1.4rem;
  }

  .round-state {
    padding: 7px 11px;

    border-radius: 999px;

    background: #173957;
    color: #bcd2e7;

    font-size: 0.82rem;
    white-space: nowrap;
  }

  .table-wrap {
    flex: 1;

    min-height: 0;

    overflow: auto;

    border-radius: 12px;
  }

  table {
    width: 100%;

    border-collapse: collapse;

    font-size: 1.35rem;
  }

  thead {
    position: sticky;
    z-index: 5;
    top: 0;

    background: #0b1f33;
  }

  th,
  td {
    padding: 10px 12px;

    text-align: left;
  }

  th {
    color: #b7cce1;
    font-size: 0.93rem;
  }

  tbody tr:nth-child(odd) {
    background: #0e2947;
  }

  tbody tr:nth-child(even) {
    background: #102f50;
  }

  .rank {
    width: 80px;
    font-weight: 800;
  }

  .score {
    text-align: right;

    font-variant-numeric: tabular-nums;
    font-weight: 700;
  }

  .tries {
    width: 100px;

    text-align: right;

    font-variant-numeric: tabular-nums;
  }

  .top1 td {
    background: #f1c40f !important;
    color: #0b1f33;

    font-size: 1.5rem;
  }

  .top2 td {
    background: #bdc3c7 !important;
    color: #0b1f33;
  }

  .top3 td {
    background: #cd7f32 !important;
    color: #0b1f33;
  }

  .empty {
    padding: 36px 20px;

    color: #9db8d6;

    text-align: center;
  }

  .toast {
    position: fixed;
    z-index: 100;

    right: 20px;
    bottom: 20px;

    display: none;

    max-width: 420px;

    padding: 12px 16px;

    border-radius: 10px;

    background: #c0392b;
    color: #ffffff;

    font-size: 0.9rem;
    line-height: 1.5;

    box-shadow: 0 8px 24px rgba(0, 0, 0, 0.3);
  }

  @media (max-width: 900px) {
    .wrap {
      grid-template-columns: 340px 1fr;
    }

    .side {
      padding: 14px;
    }

    .main {
      padding: 18px;
    }

    .qr {
      min-height: 165px;
    }

    .qr img {
      width: 145px;
      height: 145px;
    }

    table {
      font-size: 1.1rem;
    }
  }
</style>
</head>

<body>

<div class="wrap">

  <aside class="side">

    <h1>⚡ バトル操作盤</h1>

    <div
      class="qr"
      id="qr"
    >
      QRコード生成中…
    </div>

    <div
      class="url"
      id="url"
    ></div>

    <div class="stat">

      <div class="card">
        <b id="joined">0</b>
        <span>参加人数</span>
      </div>

      <div class="card">
        <b id="answered">0</b>
        <span>記録済み</span>
      </div>

      <div class="card">
        <b id="roundNumber">0</b>
        <span>ラウンド</span>
      </div>

    </div>

    <div class="modebox">

      <div class="label">
        表示・実行するゲームを選択
      </div>

      <div class="seg">

        <button
          type="button"
          id="modeReflex"
          class="on"
        >
          ⚡ 反射神経
        </button>

        <button
          type="button"
          id="modeTap"
        >
          👆 連打
        </button>

      </div>

      <div
        class="duration-area"
        id="durationArea"
      >

        <div class="label">
          連打時間を選択
        </div>

        <div class="seg">

          <button
            type="button"
            id="duration5"
          >
            5秒
          </button>

          <button
            type="button"
            id="duration7"
            class="on"
          >
            7秒
          </button>

          <button
            type="button"
            id="duration10"
          >
            10秒
          </button>

        </div>

      </div>

    </div>

    <div class="view-status">
      表示中：
      <strong id="currentView">
        反射神経ランキング
      </strong>
    </div>

    <button
      type="button"
      class="action start"
      id="startButton"
    >
      ▶ 反射神経を開始
    </button>

    <button
      type="button"
      class="action reset"
      id="resetButton"
    >
      記録をリセット
    </button>

    <button
      type="button"
      class="action reset-all"
      id="resetAllButton"
    >
      全リセット
    </button>

    <div class="operation-note">
      ゲームまたは秒数を選択すると、過去ランキングだけが切り替わります。
      <br>
      ゲームは「開始」ボタンを押した時点で直ちに始まります。
    </div>

  </aside>

  <main class="main">

    <div class="main-header">

      <h2 id="rankingTitle">
        🏆 反射神経ランキング
      </h2>

      <div
        class="round-state"
        id="roundState"
      >
        待機中
      </div>

    </div>

    <div class="table-wrap">

      <table>

        <thead>
          <tr>
            <th class="rank">
              順位
            </th>

            <th>
              なまえ
            </th>

            <th
              class="score"
              id="scoreHeader"
            >
              ベスト
            </th>

            <th class="tries">
              回数
            </th>
          </tr>
        </thead>

        <tbody id="rankingBody">

          <tr>
            <td
              colspan="4"
              class="empty"
            >
              まだ記録がありません
            </td>
          </tr>

        </tbody>

      </table>

    </div>

  </main>

</div>

<div
  class="toast"
  id="toast"
></div>

<!-- QRコード生成ライブラリ -->
<script
  src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.js"
  onerror="window.qrLibraryFailed = true;"
></script>

<!-- ホスト画面本体 -->
<script>
'use strict';

// ============================================================
// 要素
// ============================================================

const joinedElement =
  document.getElementById('joined');

const answeredElement =
  document.getElementById('answered');

const roundNumberElement =
  document.getElementById('roundNumber');

const currentViewElement =
  document.getElementById('currentView');

const rankingTitleElement =
  document.getElementById('rankingTitle');

const scoreHeaderElement =
  document.getElementById('scoreHeader');

const rankingBodyElement =
  document.getElementById('rankingBody');

const roundStateElement =
  document.getElementById('roundState');

const modeReflexButton =
  document.getElementById('modeReflex');

const modeTapButton =
  document.getElementById('modeTap');

const durationArea =
  document.getElementById('durationArea');

const duration5Button =
  document.getElementById('duration5');

const duration7Button =
  document.getElementById('duration7');

const duration10Button =
  document.getElementById('duration10');

const startButton =
  document.getElementById('startButton');

const resetButton =
  document.getElementById('resetButton');

const resetAllButton =
  document.getElementById('resetAllButton');

const toastElement =
  document.getElementById('toast');

const qrArea =
  document.getElementById('qr');

const urlArea =
  document.getElementById('url');

// ============================================================
// 選択状態
// ============================================================

let selectedMode = 'reflex';
let selectedDuration = 7;

let latestBoard = [];

let latestStats = {
  joined: 0,
  answered: 0,
  round: 0,
  active: false,
  mode: 'reflex',
  duration: 7
};

let eventSource = null;
let toastTimer = null;

// ============================================================
// 共通
// ============================================================

function escapeHtml(value) {
  return String(value || '').replace(
    /[<>&"]/g,
    function (character) {
      return {
        '<': '&lt;',
        '>': '&gt;',
        '&': '&amp;',
        '"': '&quot;'
      }[character];
    }
  );
}

function showToast(message) {
  toastElement.textContent = message;
  toastElement.style.display = 'block';

  if (toastTimer) {
    clearTimeout(toastTimer);
  }

  toastTimer = window.setTimeout(
    function () {
      toastElement.style.display = 'none';
    },
    5000
  );
}

async function postJson(
  url,
  body
) {
  const response = await fetch(
    url,
    {
      method: 'POST',

      headers: {
        'Content-Type':
          'application/json'
      },

      cache: 'no-store',

      body: JSON.stringify(
        body || {}
      )
    }
  );

  let result = {};

  try {
    result = await response.json();
  } catch (error) {
    result = {};
  }

  if (!response.ok) {
    throw new Error(
      'HTTP ' +
      response.status
    );
  }

  return result;
}

// ============================================================
// QRコード生成
// ============================================================

const joinUrl =
  window.location.origin + '/';

urlArea.textContent =
  joinUrl;

function showQrError(message) {
  qrArea.innerHTML =
    '<div style="' +
      'color:#0b1f33;' +
      'padding:16px;' +
      'line-height:1.6;' +
    '">' +
      escapeHtml(message) +
      '<br>' +
      '<span style="font-size:0.8rem">' +
        '下のURLをスマホで開いてください' +
      '</span>' +
    '</div>';
}

function drawQrCode() {
  if (
    window.qrLibraryFailed ||
    typeof window.qrcode !== 'function'
  ) {
    showQrError(
      'QRコード生成ライブラリを読み込めませんでした'
    );

    return false;
  }

  try {
    const qr =
      window.qrcode(
        0,
        'M'
      );

    qr.addData(joinUrl);
    qr.make();

    qrArea.innerHTML =
      qr.createImgTag(
        5,
        6
      );

    const qrImage =
      qrArea.querySelector('img');

    if (!qrImage) {
      throw new Error(
        'QRコード画像を生成できませんでした'
      );
    }

    qrImage.style.display =
      'block';

    qrImage.style.width =
      '170px';

    qrImage.style.height =
      '170px';

    qrImage.style.margin =
      '0 auto';

    qrImage.alt =
      '参加者用QRコード';

    qrImage.draggable =
      false;

    return true;
  } catch (error) {
    console.error(
      'QRコード生成失敗',
      error
    );

    showQrError(
      'QRコードを生成できませんでした'
    );

    return false;
  }
}

function initializeQrCode() {
  let attempts = 0;

  const timer =
    window.setInterval(
      function () {
        attempts += 1;

        const success =
          drawQrCode();

        if (
          success ||
          attempts >= 10
        ) {
          clearInterval(timer);
        }
      },
      300
    );
}

// ============================================================
// 選択ボタン表示
// ============================================================

function updateSelectionButtons() {
  modeReflexButton.classList.toggle(
    'on',
    selectedMode === 'reflex'
  );

  modeTapButton.classList.toggle(
    'on',
    selectedMode === 'tap'
  );

  durationArea.style.display =
    selectedMode === 'tap'
      ? 'block'
      : 'none';

  duration5Button.classList.toggle(
    'on',
    selectedDuration === 5
  );

  duration7Button.classList.toggle(
    'on',
    selectedDuration === 7
  );

  duration10Button.classList.toggle(
    'on',
    selectedDuration === 10
  );

  if (selectedMode === 'tap') {
    currentViewElement.textContent =
      '連打' +
      selectedDuration +
      '秒ランキング';

    startButton.textContent =
      '▶ 連打' +
      selectedDuration +
      '秒を開始';
  } else {
    currentViewElement.textContent =
      '反射神経ランキング';

    startButton.textContent =
      '▶ 反射神経を開始';
  }
}

// ===========================

<style>
  * {

    color: #ffffff;

  button.action {

  button.action:active {

  .start {

  .table-wrap {
    flex: 1;

    border-radius: 12px;

  table {
    width: 100%;

  thead {

  th,

    color: #b7cce1;

  }

  tbody tr:nth-child(odd) {
    background: #0e2947;

  tbody tr:nth-child(even) {

  }

  .rank {
    width: 80px;

    font-weight: 800;
  }

  .score {
    text-align: right;

    font-variant-numeric: tabular-nums;
    font-weight: 700;
  }

  .tries {
    width: 100px;

    font-variant-numeric: tabular-nums;
  }

  .top1 td {
    background: #f1c40f !important;

    font-size: 1.5rem;
  }

  .top2 td {

  .top3 td {

  .empty {

  @media (max-width: 900px) {

    }

    .qr img {

    }

<script>
'use strict';

// ============================================================
// 要素
// ============================================================

const joinedElement =
  document.getElementById('joined');

const answeredElement =
  document.getElementById('answered');

const roundNumberElement =
  document.getElementById('roundNumber');

const currentViewElement =
  document.getElementById('currentView');

const rankingTitleElement =
  document.getElementById('rankingTitle');

const scoreHeaderElement =
  document.getElementById('scoreHeader');

const rankingBodyElement =
  document.getElementById('rankingBody');

const roundStateElement =
  document.getElementById('roundState');

const modeReflexButton =
  document.getElementById('modeReflex');

const modeTapButton =
  document.getElementById('modeTap');

const durationArea =
  document.getElementById('durationArea');

const duration5Button =
  document.getElementById('duration5');

const duration7Button =
  document.getElementById('duration7');

const duration10Button =
  document.getElementById('duration10');

const startButton =
  document.getElementById('startButton');

const resetButton =
  document.getElementById('resetButton');

const resetAllButton =
  document.getElementById('resetAllButton');

const toastElement =
  document.getElementById('toast');

// ============================================================
// ホスト側の選択状態
// ============================================================

let selectedMode = 'reflex';
let selectedDuration = 7;

let latestBoard = [];
let latestStats = {
  joined: 0,
  answered: 0,
  round: 0,
  active: false,
  mode: 'reflex',
  duration: 7
};

let eventSource = null;
let toastTimer = null;

// ============================================================
// 共通
// ============================================================

function escapeHtml(value) {
  return String(value || '').replace(
    /[<>&"]/g,
    function (character) {
      return {
        '<': '&lt;',
        '>': '&gt;',
        '&': '&amp;',
        '"': '&quot;'
      }[character];
    }
  );
}

function showToast(message) {
  toastElement.textContent = message;
  toastElement.style.display = 'block';

  if (toastTimer) {
    clearTimeout(toastTimer);
  }

  toastTimer = window.setTimeout(
    function () {
      toastElement.style.display = 'none';
    },
    5000
  );
}

async function postJson(
  url,
  body
) {
  const response = await fetch(
    url,
    {
      method: 'POST',

      headers: {
        'Content-Type':
          'application/json'
      },

      cache: 'no-store',

      body: JSON.stringify(
        body || {}
      )
    }
  );

  let result = {};

  try {
    result = await response.json();
  } catch (error) {
    result = {};
  }

  if (!response.ok) {
    throw new Error(
      'HTTP ' +
      response.status
    );
  }

  return result;
}

// ============================================================
// QRコード
// ============================================================

const joinUrl =
  window.location.origin + '/';

document.getElementById('url')
  .textContent = joinUrl;

function drawQrCode() {
  const qrArea =
    document.getElementById('qr');

  try {
    const qr =
      qrcode(0, 'M');

    qr.addData(joinUrl);
    qr.make();

    qrArea.innerHTML =
      qr.createImgTag(5, 6);

    const qrImage =
      qrArea.querySelector('img');

    if (qrImage) {
      qrImage.style.width =
        '170px';

      qrImage.style.height =
        '170px';
    }
  } catch (error) {
    qrArea.innerHTML =
      '<div style="color:#0b1f33;padding:16px">' +
        '下のURLをスマホで開いてください' +
      '</div>';
  }
}

if (window.qrLibraryFailed) {
  document.getElementById('qr')
    .innerHTML =
      '<div style="color:#0b1f33;padding:16px">' +
        '下のURLをスマホで開いてください' +
      '</div>';
} else {
  window.setTimeout(
    drawQrCode,
    200
  );
}

// ============================================================
// ボタン表示
// ============================================================

function updateSelectionButtons() {
  modeReflexButton.classList.toggle(
    'on',
    selectedMode === 'reflex'
  );

  modeTapButton.classList.toggle(
    'on',
    selectedMode === 'tap'
  );

  durationArea.style.display =
    selectedMode === 'tap'
      ? 'block'
      : 'none';

  duration5Button.classList.toggle(
    'on',
    selectedDuration === 5
  );

  duration7Button.classList.toggle(
    'on',
    selectedDuration === 7
  );

  duration10Button.classList.toggle(
    'on',
    selectedDuration === 10
  );

  if (selectedMode === 'tap') {
    currentViewElement.textContent =
      '連打' +
      selectedDuration +
      '秒ランキング';

    startButton.textContent =
      '▶ 連打' +
      selectedDuration +
      '秒を開始';
  } else {
    currentViewElement.textContent =
      '反射神経ランキング';

    startButton.textContent =
      '▶ 反射神経を開始';
  }
}

// ============================================================
// ランキング切り替え
//
// select-rankingはランキング表示だけを変更します。
// ラウンド開始や参加者への通知は行いません。
// ============================================================

async function selectRanking(
  mode,
  duration
) {
  startButton.disabled = true;

  try {
    const result = await postJson(
      '/api/select-ranking',
      {
        mode,
        duration
      }
    );

    if (
      result &&
      result.stats &&
      result.board
    ) {
      renderRanking(
        result.board,
        result.stats
      );
    }
  } catch (error) {
    showToast(
      'ランキングの切り替えに失敗しました。server.jsの更新状況を確認してください。'
    );
  } finally {
    startButton.disabled = false;
  }
}

// ============================================================
// モード選択
// ============================================================

modeReflexButton.addEventListener(
  'click',
  async function () {
    selectedMode = 'reflex';

    updateSelectionButtons();

    await selectRanking(
      selectedMode,
      selectedDuration
    );
  }
);

modeTapButton.addEventListener(
  'click',
  async function () {
    selectedMode = 'tap';

    updateSelectionButtons();

    await selectRanking(
      selectedMode,
      selectedDuration
    );
  }
);

// ============================================================
// 秒数選択
// ============================================================

async function selectDuration(
  duration
) {
  selectedDuration = duration;
  selectedMode = 'tap';

  updateSelectionButtons();

  await selectRanking(
    selectedMode,
    selectedDuration
  );
}

duration5Button.addEventListener(
  'click',
  function () {
    selectDuration(5);
  }
);

duration7Button.addEventListener(
  'click',
  function () {
    selectDuration(7);
  }
);

duration10Button.addEventListener(
  'click',
  function () {
    selectDuration(10);
  }
);

// ============================================================
// ランキング描画
// ============================================================

function getMedalOrRank(rank) {
  if (rank === 1) {
    return '🥇';
  }

  if (rank === 2) {
    return '🥈';
  }

  if (rank === 3) {
    return '🥉';
  }

  return String(rank);
}

function getTopClass(rank) {
  if (rank === 1) {
    return 'top1';
  }

  if (rank === 2) {
    return 'top2';
  }

  if (rank === 3) {
    return 'top3';
  }

  return '';
}

function renderRanking(
  board,
  stats
) {
  latestBoard =
    Array.isArray(board)
      ? board
      : [];

  latestStats =
    stats || latestStats;

  joinedElement.textContent =
    Number(latestStats.joined || 0);

  answeredElement.textContent =
    Number(latestStats.answered || 0);

  roundNumberElement.textContent =
    Number(latestStats.round || 0);

  const viewMode =
    latestStats.mode === 'tap'
      ? 'tap'
      : 'reflex';

  const viewDuration =
    [5, 7, 10].includes(
      Number(latestStats.duration)
    )
      ? Number(latestStats.duration)
      : 7;

  if (viewMode === 'tap') {
    rankingTitleElement.textContent =
      '🏆 連打' +
      viewDuration +
      '秒ランキング';

    scoreHeaderElement.textContent =
      'タップ数';

    currentViewElement.textContent =
      '連打' +
      viewDuration +
      '秒ランキング';
  } else {
    rankingTitleElement.textContent =
      '🏆 反射神経ランキング';

    scoreHeaderElement.textContent =
      'ベスト';

    currentViewElement.textContent =
      '反射神経ランキング';
  }

  if (latestStats.active) {
    roundStateElement.textContent =
      'ラウンド' +
      Number(latestStats.round || 0) +
      ' 実行済み';
  } else {
    roundStateElement.textContent =
      '待機中';
  }

  if (!latestBoard.length) {
    rankingBodyElement.innerHTML =
      '<tr>' +
        '<td colspan="4" class="empty">' +
          'この条件では、まだ記録がありません' +
        '</td>' +
      '</tr>';

    return;
  }

  const scoreUnit =
    viewMode === 'tap'
      ? ' 回'
      : ' ms';

  rankingBodyElement.innerHTML =
    latestBoard
      .slice(0, 100)
      .map(
        function (record) {
          const rank =
            Number(record.rank);

          const rowClass =
            getTopClass(rank);

          return (
            '<tr class="' +
              rowClass +
            '">' +

              '<td class="rank">' +
                getMedalOrRank(rank) +
              '</td>' +

              '<td>' +
                escapeHtml(record.name) +
              '</td>' +

              '<td class="score">' +
                Number(record.score) +
                scoreUnit +
              '</td>' +

              '<td class="tries">' +
                Number(record.tries || 0) +
              '</td>' +

            '</tr>'
          );
        }
      )
      .join('');
}

// ============================================================
// ホスト用SSE
// ============================================================

function connectHostEvents() {
  if (eventSource) {
    try {
      eventSource.close();
    } catch (error) {
      // 切断エラーは無視
    }
  }

  eventSource =
    new EventSource(
      '/events/host'
    );

  eventSource.addEventListener(
    'leaderboard',
    function (event) {
      try {
        const data =
          JSON.parse(event.data);

        renderRanking(
          data.board,
          data.stats
        );
      } catch (error) {
        showToast(
          'ランキング情報の読み取りに失敗しました。'
        );
      }
    }
  );

  eventSource.addEventListener(
    'round-start',
    function (event) {
      try {
        const data =
          JSON.parse(event.data);

        if (data.mode === 'tap') {
          roundStateElement.textContent =
            '連打' +
            Number(data.duration || 7) +
            '秒 進行中';
        } else {
          roundStateElement.textContent =
            '反射神経 進行中';
        }
      } catch (error) {
        roundStateElement.textContent =
          'ゲーム進行中';
      }
    }
  );

  eventSource.addEventListener(
    'session-reset',
    function () {
      latestBoard = [];

      latestStats = {
        joined: 0,
        answered: 0,
        round: 0,
        active: false,
        mode: selectedMode,
        duration: selectedDuration
      };

      renderRanking(
        latestBoard,
        latestStats
      );

      roundStateElement.textContent =
        '全リセット完了';
    }
  );

  eventSource.onerror =
    function () {
      roundStateElement.textContent =
        '再接続中…';
    };
}

// ============================================================
// ゲーム開始
//
// 確認ポップアップは表示せず、
// 開始ボタンを押した時点でゲームを開始する。
// ============================================================

startButton.addEventListener(
  'click',
  async function () {
    // 連続クリックによる二重開始を防止
    if (startButton.disabled) {
      return;
    }

    startButton.disabled = true;

    const originalText =
      startButton.textContent;

    startButton.textContent =
      '開始処理中…';

    try {
      await postJson(
        '/api/start',
        {
          mode: selectedMode,
          duration: selectedDuration
        }
      );
    } catch (error) {
      showToast(
        'ゲームの開始に失敗しました。'
      );
    } finally {
      startButton.disabled = false;
      startButton.textContent =
        originalText;
    }
  }
);

      window.confirm(
        'すべてのゲーム記録を削除します。\n' +
        '参加者情報は残るため、同じメンバーで続けられます。\n\n' +
        'よろしいですか？'
      );

    if (!confirmed) {
      return;
    }

    resetButton.disabled = true;

    try {
      await postJson(
        '/api/reset',
        {}
      );

      roundStateElement.textContent =
        '記録リセット完了';
    } catch (error) {
      showToast(
        '記録のリセットに失敗しました。'
      );
    } finally {
      resetButton.disabled = false;
    }
  }
);

// ============================================================
// 全リセット
// ============================================================

resetAllButton.addEventListener(
  'click',
  async function () {
    const confirmed =
      window.confirm(
        '参加者とすべての記録を削除します。\n' +
        '参加中のスマホは名前入力画面へ戻ります。\n\n' +
        'よろしいですか？'
      );

    if (!confirmed) {
      return;
    }

    resetAllButton.disabled = true;

    try {
      await postJson(
        '/api/reset-all',
        {}
      );

      roundStateElement.textContent =
        '全リセット完了';
    } catch (error) {
      showToast(
        '全リセットに失敗しました。'
      );
    } finally {
      resetAllButton.disabled = false;
    }
  }
);

// ============================================================
// 初期化
// ============================================================

updateSelectionButtons();
connectHostEvents();
</script>

</body>
</html>

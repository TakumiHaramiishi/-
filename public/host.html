<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>技能人財養成部 ハロウィンパーティー｜ゲーム司会席</title><style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;font-family:-apple-system,"Noto Sans JP",sans-serif;background:#120b1e;color:#fff}button{font:inherit}.wrap{display:grid;grid-template-columns:420px 1fr;min-height:100vh}.side{padding:16px;overflow-y:auto;border-right:2px solid #f28a24;background:linear-gradient(#321747,#1b1029)}.main{padding:22px;overflow-y:auto;background:radial-gradient(circle at 80% 0,#301840,#120b1e 55%)}h1,h2{margin:.2em 0}.event{color:#ff9c2e;font-weight:900}.qr{display:flex;align-items:center;justify-content:center;min-height:145px;padding:8px;border-radius:14px;background:#fff;color:#12303f}.qr img{width:135px;height:135px}.url{margin:7px 0;padding:7px;border-radius:8px;background:#42245a;font-size:.75rem;word-break:break-all}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}.card{padding:7px;border-radius:10px;background:#42245a;text-align:center}.card b{display:block;color:#ffb257;font-size:1.4rem}.group{margin-top:10px;padding:10px;border-radius:12px;background:#321c45}.buttons{display:flex;flex-wrap:wrap;gap:6px}.buttons button,.action{padding:10px 12px;border:2px solid #6e4d84;border-radius:10px;background:#43235c;color:#fff;font-weight:800;cursor:pointer}.buttons button.on{border-color:#ffb257;background:#ef7f1a}.action{width:100%;margin-top:8px;padding:14px;border:0}.start{background:#27ae60}.orange{background:#d07816}.purple{background:#843bad}.reset{background:#526d88}.danger{background:#8e3b3b}.action:disabled{opacity:.45}.status{margin-top:10px;padding:11px;border-radius:10px;background:#3c2550;line-height:1.45}.status.ok{background:#17633a}.status.warn{background:#8b6914}.status.playing{background:#075b87}.detail{font-size:.82rem;line-height:1.5}.hidden{display:none!important}.pager{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}.pager button{padding:7px 10px;border:1px solid #80599a;border-radius:8px;background:#442558;color:#fff}.board{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:7px}.rank{display:grid;grid-template-columns:46px 1fr auto auto;gap:8px;align-items:center;min-height:54px;padding:8px;border-radius:9px;background:#2a183b}.rank:nth-child(even){background:#321d45}.rank b{font-size:1.25rem}.score{color:#ffd08a;font-size:1.2rem;font-weight:900}.top1{background:#f1c40f!important;color:#20142b}.top2{background:#bdc3c7!important;color:#20142b}.top3{background:#cd7f32!important;color:#20142b}.top1 .score,.top2 .score,.top3 .score{color:#20142b}.awards{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}.award,.panel{padding:12px;border-radius:12px;background:#2f1b41}.podium{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:12px 0}.podium>div{padding:14px;border-radius:12px;background:#2f1b41;font-size:1.2rem;font-weight:900}.history{margin-top:15px;padding:14px;border:1px solid #744c90;border-radius:12px;background:#21132f}.small{color:#c7b8d2;font-size:.82rem}@media(max-width:950px){.wrap{grid-template-columns:350px 1fr}.board{grid-template-columns:1fr}}
</style></head><body><div class="wrap"><aside class="side"><div class="event">🎃 技能人財養成部</div><h1>ハロウィンパーティー<br>ゲーム司会席 👻</h1><div id="qr" class="qr">QR生成中…</div><div id="url" class="url"></div><div class="stats"><div class="card"><b id="joined">0</b>参加</div><div class="card"><b id="standby">0</b>待機</div><div class="card"><b id="answered">0</b>完了</div><div class="card"><b id="connected">0</b>接続</div><div class="card"><b id="missing">0</b>要確認</div><div class="card"><b id="round">0</b>ラウンド</div></div><div id="status" class="status">状態確認中</div><div id="detail" class="detail"></div><div class="group"><div>🎮 ゲームを選択</div><div class="buttons"><button id="reflex" class="on">反射神経</button><button id="tap">連打</button><button id="unique">最大ユニーク</button><button id="tempo">テンポ</button></div><div id="durations" class="buttons hidden" style="margin-top:8px"><button data-d="5">5秒</button><button data-d="7" class="on">7秒</button><button data-d="10">10秒</button></div></div><div id="modeGroup" class="group"><div>モード</div><div class="buttons"><button id="official" class="on">本番</button><button id="practice">練習</button></div></div><button id="mainAction" class="action start">反射神経を開始</button><button id="force" class="action orange hidden">未完了者ありで結果確定</button><button id="reset" class="action reset">記録をリセット</button><button id="resetAll" class="action danger">全リセット</button></aside><main class="main"><h2 id="title">🏆 反射神経ランキング</h2><div id="tempoInfo" class="status hidden"></div><div id="pager" class="pager"></div><div id="board" class="board"><div class="panel">記録なし</div></div><div id="podium" class="podium hidden"></div><div id="awards" class="awards"><div class="award"><b>🎁 ブービー賞</b><div id="booby">該当なし</div></div><div class="award"><b>🫣 ブービーメーカー</b><div id="maker">該当なし</div></div></div><section id="history" class="history hidden"><h2>🧠 最大ユニーク 過去ラウンド</h2><div id="historyBody">本番結果はまだありません</div></section></main></div><script>
'use strict';const $=id=>document.getElementById(id);let mode='reflex',duration=7,practice=false,data={},page=1;const PAGE=30;async function post(url,b={}){const r=await fetch(url,{method:'POST',headers:{'Content-Type':'application/json'},cache:'no-store',body:JSON.stringify(b)}),j=await r.json();if(!r.ok)throw Error(JSON.stringify(j));return j}function esc(s){return String(s||'').replace(/[<>&"]/g,c=>({'<':'&lt;','>':'&gt;','&':'&amp;','"':'&quot;'}[c]))}function qr(){const url=location.origin+'/';$('url').textContent=url;const sc=document.createElement('script');sc.src='https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.js';sc.onload=()=>{const q=window.qrcode(0,'M');q.addData(url);q.make();$('qr').innerHTML=q.createImgTag(5,5)};sc.onerror=()=>$('qr').textContent='QR読込失敗';document.head.appendChild(sc)}
function choose(m){mode=m;page=1;select()}async function select(){['reflex','tap','unique','tempo'].forEach(x=>$(x).classList.toggle('on',x===mode));$('durations').classList.toggle('hidden',mode!=='tap');$('modeGroup').classList.toggle('hidden',mode==='tempo');$('history').classList.toggle('hidden',mode!=='unique');data=await post('/api/select-ranking',{mode,duration});render(data);buttons()}
['reflex','tap','unique','tempo'].forEach(x=>$(x).onclick=()=>choose(x));document.querySelectorAll('[data-d]').forEach(b=>b.onclick=()=>{duration=Number(b.dataset.d);document.querySelectorAll('[data-d]').forEach(x=>x.classList.toggle('on',x===b));select()});$('official').onclick=()=>{practice=false;buttons()};$('practice').onclick=()=>{practice=true;buttons()};
function buttons(){const s=data.stats||{};$('official').classList.toggle('on',!practice);$('practice').classList.toggle('on',practice);$('force').classList.toggle('hidden',!s.active||!['reflex','tap','tempo'].includes(s.activeMode));if(mode==='unique'){const u=s.uniqueStatus||'idle';$('mainAction').textContent=u==='open'?'回答を締め切る':u==='closed'?'結果を発表する':'回答受付開始'+(practice?'［練習］':'');$('mainAction').className='action '+(u==='open'?'orange':u==='closed'?'purple':'start')}else if(mode==='tempo'){if(s.activeMode==='tempo'&&s.active){$('mainAction').textContent=`${s.roundCompleted||0}/${s.joined||0}人完了`; $('mainAction').disabled=true}else if(!s.tempoPracticeDone){$('mainAction').textContent='テンポゲーム 練習を開始';$('mainAction').disabled=false}else if((s.tempoNext||0)<3){$('mainAction').textContent=`テンポゲーム 本番 第${(s.tempoNext||0)+1}ラウンドを開始`;$('mainAction').disabled=false}else{$('mainAction').textContent='テンポゲーム完了';$('mainAction').disabled=true}}else{$('mainAction').textContent=(mode==='tap'?`連打${duration}秒`:'反射神経')+'を開始'+(practice?'［練習］':'');$('mainAction').className='action start';$('mainAction').disabled=!!s.active}}
$('mainAction').onclick=async()=>{const s=data.stats||{};try{if(mode==='unique'){const action=s.uniqueStatus==='open'?'close':s.uniqueStatus==='closed'?'reveal':'open';await post('/api/unique',{action,practice})}else if(mode==='tempo'){await post('/api/tempo/start',{practice:!s.tempoPracticeDone,index:s.tempoNext||0})}else await post('/api/start',{mode,duration,practice})}catch(e){alert('操作できませんでした')} };$('force').onclick=()=>confirm('未完了者がいても結果を確定しますか？')&&post('/api/finish-active');$('reset').onclick=()=>confirm('全ゲームの記録をリセットしますか？')&&post('/api/reset');$('resetAll').onclick=()=>confirm('参加者を含めて全リセットしますか？')&&post('/api/reset-all');
function render(d){data=d;const s=d.stats||{};$('joined').textContent=s.joined||0;$('standby').textContent=s.standby||0;$('answered').textContent=s.roundCompleted||0;$('connected').textContent=s.connected||0;$('missing').textContent=s.notStandby||0;$('round').textContent=s.round||0;const all=(s.joined>0&&s.standby===s.joined);$('status').textContent=s.active?`▶ ${nameOf(s.activeMode)}：進行中　完了 ${s.roundCompleted||0}/${s.joined||0}`:all?'✓ 全員ゲームスタンバイ中':`⚠ ${s.notStandby||0}人が待機画面ではありません`;$('status').className='status '+(s.active?'playing':all?'ok':'warn');$('detail').innerHTML=(s.detail||[]).map(x=>`${esc(x.name)}：${esc(x.state)}`).join('<br>');$('tempoInfo').classList.toggle('hidden',s.mode!=='tempo');$('tempoInfo').textContent=s.tempoMs?`今回のテンポ（運営のみ）：${(s.tempoMs/1000).toFixed(1)}秒`:'本番は速め・標準・遅めを1回ずつ抽選';renderBoard(d);buttons()}
function nameOf(m){return m==='tap'?`連打${duration}秒`:m==='unique'?'最大ユニーク':m==='tempo'?'テンポゲーム':'反射神経'}function renderBoard(d){const s=d.stats||{},board=d.board||[],unit=s.mode==='tap'?'回':s.mode==='unique'?'点':'ms';$('title').textContent=s.mode==='tap'?`🏆 連打${s.duration}秒ランキング`:s.mode==='unique'?'🎃 最大ユニークナンバー 結果':s.mode==='tempo'?'🎵 テンポゲーム 総合ランキング':'🏆 反射神経ランキング';const isU=s.mode==='unique';$('board').classList.toggle('hidden',isU);$('podium').classList.toggle('hidden',!isU);$('awards').classList.toggle('hidden',isU||s.mode==='tempo');if(isU){const r=d.uniqueResult||d.uniqueHistory?.at(-1);$('podium').innerHTML=[1,2,3].map(i=>{const x=r?.podium?.find(y=>y.place===i);return `<div>${['','🥇','🥈','🥉'][i]} ${i}位<br>${x?esc(x.name)+'<br>数字 '+x.number:'該当なし'}</div>`}).join('');$('historyBody').innerHTML=(d.uniqueHistory||[]).map(x=>`第${x.roundNumber}ラウンド：勝利数字 ${x.winningNumber??'なし'}　${esc(x.winners?.join('、')||'勝者なし')}`).join('<br>')||'本番結果はまだありません';return}const pages=Math.max(1,Math.ceil(board.length/PAGE));page=Math.min(page,pages);const part=board.slice((page-1)*PAGE,page*PAGE);$('pager').innerHTML=pages>1?Array.from({length:pages},(_,i)=>`<button data-p="${i+1}">${i+1}</button>`).join(''):'';document.querySelectorAll('[data-p]').forEach(b=>b.onclick=()=>{page=Number(b.dataset.p);renderBoard(data)});$('board').innerHTML=part.length?part.map(x=>`<div class="rank ${x.rank===1?'top1':x.rank===2?'top2':x.rank===3?'top3':''}"><b>${x.rank<=3?['','🥇','🥈','🥉'][x.rank]:x.rank}</b><span>${esc(x.name)}</span><span class="score">${x.score} ${unit}</span><small>${x.tries||0}回</small></div>`).join(''):'<div class="panel">記録なし</div>';$('booby').textContent=d.booby?.prize?.join('、')||'該当なし';$('maker').textContent=d.booby?.maker?.join('、')||'該当なし'}
const es=new EventSource('/events/host');es.addEventListener('leaderboard',e=>render(JSON.parse(e.data)));qr();select();
</script></body></html>

<!DOCTYPE html>

<title>反射神経＆連打バトル</title>

<style>
  * {
    box-sizing: border-box;

    -webkit-user-select: none;
    user-select: none;

    -webkit-touch-callout: none;
    -webkit-user-drag: none;
    -webkit-tap-highlight-color: transparent;

  html,
  body {
    margin: 0;
    width: 100%;

  #app {
    width: 100%;

  }

  .screen {
    flex: 1;

    align-items: center;
    justify-content: center;

    width: 100%;
    min-height: 0;

      max(24px, env(safe-area-inset-bottom))

    margin-top: 16px;

  .tag {

    left: max(10px, env(safe-area-inset-left));

    text-align: center;

  .err {

      max(10px, env(safe-area-inset-bottom))

  .timebar {
    width: 80%;

  .timebar > div {

</style>
</head>

<body
  ondragstart="return false"
  oncontextmenu="return false"
>

<div id="app">
  <div class="tag" id="tag"></div>

  <div
    class="screen s-wait"
    id="screen"
  ></div>
</div>

<div
  class="err"
  id="err"
></div>

<script>
'use strict';

// ============================================================
// 基本状態
// ============================================================

const STORAGE_KEY = 'reflexBattle.session.v2';

const screen = document.getElementById('screen');
const tag = document.getElementById('tag');
const errorBox = document.getElementById('err');

let me = null;

let roundId = 0;
let phase = 'idle';

let greenAt = 0;

let reflexTimer = null;
let tapEndTimer = null;
let tapTickTimer = null;
let countdownTimer = null;

let eventSource = null;

let tapCount = 0;

// ============================================================
// 画面表示
// ============================================================

function setScreen(className, html) {
  unbindTap();

  screen.className = 'screen ' + className;
  screen.innerHTML = html;
}

function showError(message) {
  errorBox.textContent = message;
  errorBox.style.display = 'block';

  window.setTimeout(function () {
    errorBox.style.display = 'none';
  }, 5000);
}

function nowMs() {
  if (
    window.performance &&
    typeof window.performance.now === 'function'
  ) {
    return window.performance.now();
  }

  return Date.now();
}

function escapeHtml(value) {
  return String(value || '').replace(
    /[<>&"]/g,
    function (character) {
      return {
        '<': '&lt;',
        '>': '&gt;',
        '&': '&amp;',
        '"': '&quot;'
      }[character];
    }
  );
}

// ============================================================
// CookieとlocalStorage
// ============================================================

function setCookie(name, value, days) {
  try {
    const expiry = new Date();

    expiry.setTime(
      expiry.getTime() +
      days * 24 * 60 * 60 * 1000
    );

    document.cookie =
      name +
      '=' +
      encodeURIComponent(value) +
      ';expires=' +
      expiry.toUTCString() +
      ';path=/' +
      ';SameSite=Lax';
  } catch (error) {
    // Cookieが使えない場合はlocalStorageを使用
  }
}

function getCookie(name) {
  try {
    const pattern =
      '(^|;)\\s*' +
      name +
      '\\s*=\\s*([^;]+)';

    const match =
      document.cookie.match(pattern);

    return match
      ? decodeURIComponent(match.pop())
      : '';
  } catch (error) {
    return '';
  }
}

function saveSession(session) {
  me = session;

  const serialized =
    JSON.stringify(session);

  try {
    localStorage.setItem(
      STORAGE_KEY,
      serialized
    );
  } catch (error) {
    // localStorageが使えない場合はCookieのみ
  }

  setCookie(
    STORAGE_KEY,
    serialized,
    1
  );
}

function loadSession() {
  try {
    const localValue =
      localStorage.getItem(STORAGE_KEY);

    if (localValue) {
      return JSON.parse(localValue);
    }
  } catch (error) {
    // Cookieを試す
  }

  try {
    const cookieValue =
      getCookie(STORAGE_KEY);

    if (cookieValue) {
      return JSON.parse(cookieValue);
    }
  } catch (error) {
    // 保存情報なし
  }

  return null;
}

function clearSession() {
  me = null;

  try {
    localStorage.removeItem(STORAGE_KEY);
  } catch (error) {
    // localStorage削除に失敗してもCookieを削除
  }

  setCookie(
    STORAGE_KEY,
    '',
    -1
  );
}

// ============================================================
// API通信
// ============================================================

async function apiPost(
  url,
  body,
  retries
) {
  const retryCount =
    typeof retries === 'number'
      ? retries
      : 2;

  let lastError = null;

  for (
    let attempt = 0;
    attempt <= retryCount;
    attempt += 1
  ) {
    try {
      const response = await fetch(
        url,
        {
          method: 'POST',

          headers: {
            'Content-Type':
              'application/json'
          },

          cache: 'no-store',

          body: JSON.stringify(
            body || {}
          )
        }
      );

      let result = {};

      try {
        result = await response.json();
      } catch (parseError) {
        result = {};
      }

      if (!response.ok) {
        const apiError =
          new Error(
            'HTTP ' + response.status
          );

        apiError.status =
          response.status;

        apiError.data =
          result;

        throw apiError;
      }

      return result;
    } catch (error) {
      lastError = error;

      // 409または404は通信障害ではないため再試行しない
      if (
        error.status === 409 ||
        error.status === 404
      ) {
        throw error;
      }

      if (attempt >= retryCount) {
        throw error;
      }

      await new Promise(
        function (resolve) {
          window.setTimeout(
            resolve,
            700
          );
        }
      );
    }
  }

  throw lastError;
}

function isInvalidSessionError(error) {
  if (!error) {
    return false;
  }

  if (
    error.status === 409 &&
    error.data &&
    error.data.staleSession
  ) {
    return true;
  }

  if (
    error.status === 404 &&
    error.data &&
    error.data.playerMissing
  ) {
    return true;
  }

  return false;
}

function handleInvalidSession(message) {
  closeEventSource();
  clearAllTimers();
  clearSession();

  roundId = 0;
  phase = 'idle';

  tag.textContent = '';

  showJoinScreen(
    message ||
    '参加情報がリセットされました。もう一度名前を入力してください。'
  );
}

// ============================================================
// 起動と再入場
// ============================================================

async function boot() {
  const saved = loadSession();

  if (
    saved &&
    saved.id &&
    saved.name &&
    saved.sessionGeneration
  ) {
    setScreen(
      's-wait',
      '<h1>復帰中…</h1>' +
      '<p class="muted">' +
      escapeHtml(saved.name) +
      ' として戻っています…</p>'
    );

    try {
      const result = await apiPost(
        '/api/rejoin',
        {
          id: saved.id,
          name: saved.name,

          sessionGeneration:
            saved.sessionGeneration
        },
        2
      );

      saveSession({
        id: result.id,
        name: result.name,

        sessionGeneration:
          result.sessionGeneration
      });

      roundId =
        result.round &&
        typeof result.round.id === 'number'
          ? result.round.id
          : 0;

      tag.textContent =
        result.name +
        ' として参加中';

      connectEventSource();
      showWaitingScreen();

      return;
    } catch (error) {
      if (
        isInvalidSessionError(error)
      ) {
        handleInvalidSession(
          '全リセットまたはサーバー再起動が行われました。もう一度名前を入力してください。'
        );

        return;
      }

      // 通信エラーの場合も、開始しないスタンバイ状態にはせず
      // 名前入力画面へ戻す
      clearSession();

      showJoinScreen(
        '接続を確認できませんでした。名前を入力して参加し直してください。'
      );

      return;
    }
  }

  // 旧バージョンで保存したIDにはsessionGenerationがないため破棄
  if (saved) {
    clearSession();
  }

  showJoinScreen();
}

// ============================================================
// 名前入力・参加
// ============================================================

function showJoinScreen(noticeMessage) {
  closeEventSource();
  clearAllTimers();

  phase = 'idle';
  roundId = 0;

  let noticeHtml = '';

  if (noticeMessage) {
    noticeHtml =
      '<div class="notice">' +
      escapeHtml(noticeMessage) +
      '</div>';
  }

  setScreen(
    's-wait',

    '<h1>⚡ 反射神経＆連打バトル</h1>' +

    '<p>ニックネームを入力してください</p>' +

    '<input ' +
      'id="name" ' +
      'maxlength="20" ' +
      'placeholder="なまえ" ' +
      'autocomplete="off" ' +
      'autocapitalize="off" ' +
      'spellcheck="false"' +
    '>' +

    '<button id="joinBtn">' +
      '参加する' +
    '</button>' +

    noticeHtml +

    '<p class="muted">' +
      '画面を閉じても、同じ端末とブラウザなら再入場できます' +
    '</p>'
  );

  const nameInput =
    document.getElementById('name');

  const joinButton =
    document.getElementById('joinBtn');

  joinButton.addEventListener(
    'click',
    joinGame
  );

  nameInput.addEventListener(
    'keydown',
    function (event) {
      if (event.key === 'Enter') {
        joinGame();
      }
    }
  );
}

async function joinGame() {
  const nameInput =
    document.getElementById('name');

  const joinButton =
    document.getElementById('joinBtn');

  if (!nameInput || !joinButton) {
    return;
  }

  const name =
    nameInput.value.trim();

  if (!name) {
    showError(
      'ニックネームを入力してください。'
    );

    nameInput.focus();
    return;
  }

  joinButton.disabled = true;
  joinButton.textContent =
    '接続中…';

  try {
    // 新しい参加として登録する。
    // 同名の既存参加者が現在のサーバーにいれば、
    // server.js側で既存ユーザーへ合流する。
    const result = await apiPost(
      '/api/join',
      {
        name
      },
      3
    );

    saveSession({
      id: result.id,
      name: result.name,

      sessionGeneration:
        result.sessionGeneration
    });

    roundId =
      result.round &&
      typeof result.round.id === 'number'
        ? result.round.id
        : 0;

    tag.textContent =
      result.name +
      ' として参加中';

    connectEventSource();
    showWaitingScreen();
  } catch (error) {
    joinButton.disabled = false;
    joinButton.textContent =
      '参加する';

    showError(
      '接続に失敗しました。もう一度「参加する」を押してください。'
    );
  }
}

// ============================================================
// SSE接続
// ============================================================

function closeEventSource() {
  if (eventSource) {
    try {
      eventSource.close();
    } catch (error) {
      // 切断失敗は無視
    }

    eventSource = null;
  }
}

function connectEventSource() {
  closeEventSource();

  if (
    !me ||
    !me.id ||
    !me.sessionGeneration
  ) {
    handleInvalidSession();
    return;
  }

  const eventUrl =
    '/events/player' +
    '?id=' +
    encodeURIComponent(me.id) +
    '&generation=' +
    encodeURIComponent(
      me.sessionGeneration
    );

  eventSource =
    new EventSource(eventUrl);

  eventSource.addEventListener(
    'hello',
    function (event) {
      try {
        const data =
          JSON.parse(event.data);

        if (
          data.sessionGeneration &&
          data.sessionGeneration !==
            me.sessionGeneration
        ) {
          handleInvalidSession();
        }
      } catch (error) {
        // hello解析失敗は無視
      }
    }
  );

  eventSource.addEventListener(
    'round-start',
    function (event) {
      try {
        const data =
          JSON.parse(event.data);

        if (
          data.sessionGeneration &&
          data.sessionGeneration !==
            me.sessionGeneration
        ) {
          handleInvalidSession();
          return;
        }

        startReflexGame(
          data.roundId
        );
      } catch (error) {
        showError(
          'ゲーム開始情報を読み取れませんでした。'
        );
      }
    }
  );

  eventSource.addEventListener(
    'tap-start',
    function (event) {
      try {
        const data =
          JSON.parse(event.data);

        if (
          data.sessionGeneration &&
          data.sessionGeneration !==
            me.sessionGeneration
        ) {
          handleInvalidSession();
          return;
        }

        startTapCountdown(
          data.roundId,
          data.duration
        );
      } catch (error) {
        showError(
          'ゲーム開始情報を読み取れませんでした。'
        );
      }
    }
  );

  eventSource.addEventListener(
    'reset',
    function (event) {
      try {
        const data =
          JSON.parse(event.data);

        if (
          data.sessionGeneration &&
          data.sessionGeneration !==
            me.sessionGeneration
        ) {
          handleInvalidSession();
          return;
        }
      } catch (error) {
        // データが空の場合も記録リセットとして扱う
      }

      showWaitingScreen();
    }
  );

  eventSource.addEventListener(
    'kick',
    function () {
      handleInvalidSession(
        '全リセットが実行されました。次のゲームへ参加する場合は、もう一度名前を入力してください。'
      );
    }
  );

  eventSource.onerror =
    function () {
      // EventSourceは通常、自動で再接続します。
      // ただし、全リセット後に切断されたIDのまま無限再接続すると
      // スタンバイ画面で固まるため、サーバー状態を確認します。
      verifySessionAfterDisconnect();
    };
}

let sessionCheckInProgress = false;

async function verifySessionAfterDisconnect() {
  if (
    sessionCheckInProgress ||
    !me ||
    !me.id
  ) {
    return;
  }

  sessionCheckInProgress = true;

  try {
    const result = await apiPost(
      '/api/rejoin',
      {
        id: me.id,
        name: me.name,

        sessionGeneration:
          me.sessionGeneration
      },
      0
    );

    // 有効なセッションなら保存情報を更新
    saveSession({
      id: result.id,
      name: result.name,

      sessionGeneration:
        result.sessionGeneration
    });
  } catch (error) {
    if (
      isInvalidSessionError(error)
    ) {
      handleInvalidSession(
        '参加情報がリセットされました。もう一度名前を入力してください。'
      );
    }

    // 単なる一時的な通信切断ならEventSourceの自動再接続に任せる
  } finally {
    sessionCheckInProgress = false;
  }
}

// ============================================================
// 待機画面
// ============================================================

function showWaitingScreen() {
  clearAllTimers();

  phase = 'idle';

  setScreen(
    's-wait',

    '<h1>スタンバイ中…</h1>' +

    '<p>' +
      '司会の合図でスタートします。' +
      '<br>' +
      '画面を見て待っていてください' +
    '</p>' +

    '<p class="muted">' +
      'ゲームの種類と秒数は司会が選択します' +
    '</p>'
  );
}

// ============================================================
// タイマー管理
// ============================================================

function clearAllTimers() {
  if (reflexTimer) {
    clearTimeout(reflexTimer);
    reflexTimer = null;
  }

  if (tapEndTimer) {
    clearTimeout(tapEndTimer);
    tapEndTimer = null;
  }

  if (tapTickTimer) {
    clearInterval(tapTickTimer);
    tapTickTimer = null;
  }

  if (countdownTimer) {
    clearInterval(countdownTimer);
    countdownTimer = null;
  }

  unbindTap();
}

// ============================================================
// 反射神経ゲーム
// ============================================================

function startReflexGame(newRoundId) {
  clearAllTimers();

  roundId = newRoundId;
  phase = 'ready';

  setScreen(
    's-ready',

    '<h1>まだ！</h1>' +
    '<p class="big">🔴</p>' +
    '<p>緑になるまで待ってください</p>'
  );

  bindTap(handleReflexTap);

  const randomDelay =
    1500 +
    Math.random() * 3000;

  reflexTimer =
    window.setTimeout(
      showGreenScreen,
      randomDelay
    );
}

function showGreenScreen() {
  if (phase !== 'ready') {
    return;
  }

  phase = 'go';
  greenAt = nowMs();

  setScreen(
    's-go',

    '<h1>今だ！！</h1>' +
    '<p class="big">🟢</p>' +
    '<p>タップ！</p>'
  );

  bindTap(handleReflexTap);
}

function handleReflexTap() {
  if (phase === 'ready') {
    if (reflexTimer) {
      clearTimeout(reflexTimer);
      reflexTimer = null;
    }

    phase = 'done';
    unbindTap();

    setScreen(
      's-foul',

      '<h1>フライング！</h1>' +
      '<p>緑になる前に押しました</p>' +
      '<p>今回は無効です</p>'
    );

    apiPost(
      '/api/result',
      {
        id: me.id,
        roundId,
        foul: true,

        sessionGeneration:
          me.sessionGeneration
      },
      2
    ).catch(function (error) {
      if (
        isInvalidSessionError(error)
      ) {
        handleInvalidSession();
      }
    });

    window.setTimeout(
      showWaitingScreen,
      2500
    );

    return;
  }

  if (phase === 'go') {
    const reactionTime =
      nowMs() - greenAt;

    phase = 'done';
    unbindTap();

    setScreen(
      's-result',

      '<h1>' +
        reflexMessage(reactionTime) +
      '</h1>' +

      '<p class="big">' +
        Math.round(reactionTime) +
        ' ' +
        '<span style="font-size:1.2rem">' +
          'ms' +
        '</span>' +
      '</p>' +

      '<p>次の合図までお待ちください</p>'
    );

    apiPost(
      '/api/result',
      {
        id: me.id,
        roundId,
        timeMs: reactionTime,

        sessionGeneration:
          me.sessionGeneration
      },
      3
    ).catch(function (error) {
      if (
        isInvalidSessionError(error)
      ) {
        handleInvalidSession();
        return;
      }

      showError(
        '記録の送信に失敗しました。'
      );
    });

    window.setTimeout(
      showWaitingScreen,
      3000
    );
  }
}

function reflexMessage(milliseconds) {
  if (milliseconds < 200) {
    return '🏆 神反応！';
  }

  if (milliseconds < 250) {
    return '⚡ 素晴らしい！';
  }

  if (milliseconds < 300) {
    return '👍 いい感じ';
  }

  if (milliseconds < 400) {
    return '🙂 ナイス';
  }

  return '🐢 もう一回！';
}

// ============================================================
// 連打ゲーム
// ============================================================

function startTapCountdown(
  newRoundId,
  duration
) {
  clearAllTimers();

  roundId = newRoundId;
  phase = 'counting';

  const safeDuration =
    [5, 7, 10].includes(
      Number(duration)
    )
      ? Number(duration)
      : 7;

  let count = 3;

  setScreen(
    's-count',

    '<h1>連打バトル！</h1>' +

    '<p>' +
      safeDuration +
      '秒間、一本指で連打してください' +
    '</p>' +

    '<p class="huge" id="countdown">' +
      count +
    '</p>'
  );

  countdownTimer =
    window.setInterval(
      function () {
        count -= 1;

        if (count > 0) {
          const countdownElement =
            document.getElementById(
              'countdown'
            );

          if (countdownElement) {
            countdownElement.textContent =
              count;
          }

          return;
        }

        clearInterval(
          countdownTimer
        );

        countdownTimer = null;

        beginTapping(
          safeDuration
        );
      },
      1000
    );
}

function beginTapping(duration) {
  phase = 'tapping';
  tapCount = 0;

  setScreen(
    's-tap',

    '<h1>連打！！</h1>' +

    '<p class="huge" id="tapCount">' +
      '0' +
    '</p>' +

    '<p id="remainingTime">' +
      '残り ' +
      duration.toFixed(1) +
      ' 秒' +
    '</p>' +

    '<div class="timebar">' +
      '<div id="timeBar"></div>' +
    '</div>' +

    '<p class="muted">' +
      '一本指で、画面のどこでもタップ！' +
    '</p>'
  );

  bindTap(handleTapHit);

  const startTime = nowMs();
  const totalMilliseconds =
    duration * 1000;

  tapTickTimer =
    window.setInterval(
      function () {
        const elapsed =
          nowMs() - startTime;

        const remaining =
          Math.max(
            0,
            totalMilliseconds -
            elapsed
          );

        const remainingElement =
          document.getElementById(
            'remainingTime'
          );

        const timeBar =
          document.getElementById(
            'timeBar'
          );

        if (remainingElement) {
          remainingElement.textContent =
            '残り ' +
            (
              remaining /
              1000
            ).toFixed(1) +
            ' 秒';
        }

        if (timeBar) {
          timeBar.style.width =
            (
              remaining /
              totalMilliseconds *
              100
            ) +
            '%';
        }
      },
      100
    );

  tapEndTimer =
    window.setTimeout(
      finishTapping,
      totalMilliseconds
    );
}

function handleTapHit() {
  if (phase !== 'tapping') {
    return;
  }

  tapCount += 1;

  const countElement =
    document.getElementById(
      'tapCount'
    );

  if (countElement) {
    countElement.textContent =
      tapCount;
  }
}

function finishTapping() {
  if (phase !== 'tapping') {
    return;
  }

  phase = 'done';

  unbindTap();

  if (tapTickTimer) {
    clearInterval(tapTickTimer);
    tapTickTimer = null;
  }

  if (tapEndTimer) {
    clearTimeout(tapEndTimer);
    tapEndTimer = null;
  }

  const finalCount =
    tapCount;

  setScreen(
    's-result',

    '<h1>' +
      tapMessage(finalCount) +
    '</h1>' +

    '<p class="big">' +
      finalCount +
      ' ' +
      '<span style="font-size:1.2rem">' +
        '回' +
      '</span>' +
    '</p>' +

    '<p>' +
      'おつかれさまでした！' +
      '<br>' +
      '次の合図までお待ちください' +
    '</p>'
  );

  apiPost(
    '/api/result',
    {
      id: me.id,
      roundId,
      taps: finalCount,

      sessionGeneration:
        me.sessionGeneration
    },
    3
  ).catch(function (error) {
    if (
      isInvalidSessionError(error)
    ) {
      handleInvalidSession();
      return;
    }

    showError(
      '記録の送信に失敗しました。'
    );
  });

  window.setTimeout(
    showWaitingScreen,
    3500
  );
}

function tapMessage(count) {
  if (count >= 90) {
    return '🏆 神連打！';
  }

  if (count >= 70) {
    return '🔥 すごい！';
  }

  if (count >= 50) {
    return '💪 いい調子';
  }

  if (count >= 30) {
    return '🙂 ナイス';
  }

  return '👍 おつかれさま';
}

// ============================================================
// タップ入力
//
// ・pointerdownのみで1タップ1回
// ・同時に触れている2本目以降は数えない
// ・タップ位置は画面内なら自由
// ============================================================

const SUPPORTS_POINTER =
  'PointerEvent' in window;

const HAS_TOUCH =
  'ontouchstart' in window ||
  navigator.maxTouchPoints > 0;

const activePointers =
  new Set();

let lastInputAt = 0;

let pointerDownHandler = null;
let pointerUpHandler = null;
let touchStartHandler = null;
let clickHandler = null;

function createPointerDownHandler(
  callback
) {
  return function (event) {
    if (
      event &&
      event.cancelable
    ) {
      event.preventDefault();
    }

    const pointerId =
      event &&
      event.pointerId !== undefined
        ? event.pointerId
        : 0;

    // 既に別の指が触れている場合は、
    // 追加された指を記録するだけでカウントしない
    if (activePointers.size > 0) {
      activePointers.add(pointerId);
      return;
    }

    activePointers.add(pointerId);

    const currentTime = nowMs();

    // 極端に短い重複入力だけ除外
    if (
      currentTime -
      lastInputAt <
      25
    ) {
      return;
    }

    lastInputAt = currentTime;
    callback();
  };
}

function cleanPointer(event) {
  const pointerId =
    event &&
    event.pointerId !== undefined
      ? event.pointerId
      : 0;

  activePointers.delete(pointerId);
}

function createTouchStartHandler(
  callback
) {
  return function (event) {
    if (
      event &&
      event.cancelable
    ) {
      event.preventDefault();
    }

    // PointerEvent非対応端末の場合は
    // touchesが1本のときだけ数える
    if (
      event.touches &&
      event.touches.length > 1
    ) {
      return;
    }

    const currentTime = nowMs();

    if (
      currentTime -
      lastInputAt <
      25
    ) {
      return;
    }

    lastInputAt = currentTime;
    callback();
  };
}

function bindTap(callback) {
  unbindTap();

  activePointers.clear();
  lastInputAt = 0;

  if (SUPPORTS_POINTER) {
    pointerDownHandler =
      createPointerDownHandler(
        callback
      );

    pointerUpHandler =
      cleanPointer;

    screen.addEventListener(
      'pointerdown',
      pointerDownHandler,
      {
        passive: false
      }
    );

    screen.addEventListener(
      'pointerup',
      pointerUpHandler
    );

    screen.addEventListener(
      'pointercancel',
      pointerUpHandler
    );

    screen.addEventListener(
      'lostpointercapture',
      pointerUpHandler
    );

    return;
  }

  if (HAS_TOUCH) {
    touchStartHandler =
      createTouchStartHandler(
        callback
      );

    screen.addEventListener(
      'touchstart',
      touchStartHandler,
      {
        passive: false
      }
    );

    return;
  }

  clickHandler =
    function (event) {
      if (
        event &&
        event.cancelable
      ) {
        event.preventDefault();
      }

      const currentTime =
        nowMs();

      if (
        currentTime -
        lastInputAt <
        25
      ) {
        return;
      }

      lastInputAt =
        currentTime;

      callback();
    };

  screen.addEventListener(
    'click',
    clickHandler
  );
}

function unbindTap() {
  if (pointerDownHandler) {
    screen.removeEventListener(
      'pointerdown',
      pointerDownHandler
    );

    pointerDownHandler = null;
  }

  if (pointerUpHandler) {
    screen.removeEventListener(
      'pointerup',
      pointerUpHandler
    );

    screen.removeEventListener(
      'pointercancel',
      pointerUpHandler
    );

    screen.removeEventListener(
      'lostpointercapture',
      pointerUpHandler
    );

    pointerUpHandler = null;
  }

  if (touchStartHandler) {
    screen.removeEventListener(
      'touchstart',
      touchStartHandler
    );

    touchStartHandler = null;
  }

  if (clickHandler) {
    screen.removeEventListener(
      'click',
      clickHandler
    );

    clickHandler = null;
  }

  activePointers.clear();
}

// ============================================================
// iPhone / Androidのズーム・選択対策
// ============================================================

let lastTouchEnd = 0;

document.addEventListener(
  'touchend',
  function (event) {
    const currentTime =
      nowMs();

    if (
      currentTime -
      lastTouchEnd <
      350
    ) {
      if (event.cancelable) {
        event.preventDefault();
      }
    }

    lastTouchEnd =
      currentTime;
  },
  {
    passive: false
  }
);

document.addEventListener(
  'gesturestart',
  function (event) {
    event.preventDefault();
  }
);

document.addEventListener(
  'gesturechange',
  function (event) {
    event.preventDefault();
  }
);

document.addEventListener(
  'gestureend',
  function (event) {
    event.preventDefault();
  }
);

document.addEventListener(
  'dblclick',
  function (event) {
    event.preventDefault();
  }
);

// ============================================================
// 開始
// ============================================================

boot();
</script>

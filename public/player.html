<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><title>バトルゲーム</title><style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}html,body{margin:0;width:100%;height:100%;overflow:hidden;font-family:-apple-system,"Noto Sans JP",sans-serif;touch-action:manipulation}#screen{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:32px;background:#fff;color:#17212b}#screen.wait{background:#fff}#screen.count{background:#24364b;color:#fff}#screen.red{background:#c62828;color:#fff}#screen.green{background:#159447;color:#fff}#screen.tap{background:#6f2da8;color:#fff}#screen.result{background:#eaf3ff}#screen.unique{background:#163b61;color:#fff}#screen.closed{background:#37474f;color:#fff}h1{font-size:clamp(1.8rem,7vw,3rem);margin:.2em}p{font-size:clamp(1rem,4vw,1.3rem);line-height:1.6}.countNumber{font-size:clamp(8rem,42vw,16rem);font-weight:950;line-height:.95;text-shadow:0 5px 18px #0007}.record{font-size:clamp(4rem,20vw,8rem);font-weight:900}.practice{background:#f39c12;color:#fff;padding:7px 14px;border-radius:999px;margin-bottom:12px;font-weight:800}.waitingDots{display:flex;gap:14px;margin:24px}.waitingDots i{width:18px;height:18px;border-radius:50%;background:#0875c9;animation:bounce 1.2s infinite}.waitingDots i:nth-child(2){animation-delay:.18s}.waitingDots i:nth-child(3){animation-delay:.36s}@keyframes bounce{0%,60%,100%{transform:translateY(0);opacity:.35}30%{transform:translateY(-16px);opacity:1}}.live{display:flex;align-items:center;gap:8px;color:#137a43;font-weight:800}.live i{width:11px;height:11px;background:#1db954;border-radius:50%;box-shadow:0 0 0 0 #1db95488;animation:ring 1.5s infinite}@keyframes ring{70%{box-shadow:0 0 0 12px #1db95400}}input{font-size:2rem;width:min(210px,75vw);text-align:center;padding:12px;border:3px solid #bdd1e3;border-radius:14px;-webkit-user-select:text;user-select:text}button{font-size:1.15rem;font-weight:800;padding:14px 22px;margin:8px;border:0;border-radius:13px;background:#0875c9;color:#fff;box-shadow:0 4px 11px #0004}button:disabled{opacity:.55}.adjust{display:grid;grid-template-columns:repeat(4,1fr);width:min(390px,96vw);gap:6px}.adjust button{margin:0;padding:12px 4px}.answerButton{width:min(360px,90vw);background:#21a366}.answerButton.saved{background:#156b40}.answerPanel{display:none;width:min(390px,92vw);margin-top:14px;padding:15px;border:2px solid #ffffffaa;border-radius:16px;background:#ffffff2d}.answerPanel.show{display:block}.answerCheck{font-size:3rem}.answerNumber{font-size:2.5rem;font-weight:900}.bar{width:min(420px,85vw);height:18px;background:#ffffff55;border-radius:10px;overflow:hidden}.bar div{height:100%;background:#fff}.badge{position:fixed;z-index:10;top:10px;left:10px;right:10px;text-align:center;color:#667;font-size:.85rem}.error{position:fixed;z-index:20;bottom:0;left:0;right:0;background:#c0392b;color:#fff;padding:12px;display:none}
</style></head><body><div id="screen" class="wait"></div><div id="badge" class="badge"></div><div id="error" class="error"></div><script>
'use strict';const KEY='battle.session.v3',screen=document.getElementById('screen'),badge=document.getElementById('badge'),err=document.getElementById('error');let me=null,es=null,state='standby',roundId=0,phase='idle',timer=null,tick=null,count=0,lastInput=0,down=null;const now=()=>performance?.now?performance.now():Date.now();
const esc=s=>String(s||'').replace(/[<>&"]/g,c=>({'<':'&lt;','>':'&gt;','&':'&amp;','"':'&quot;'}[c]));function save(){localStorage.setItem(KEY,JSON.stringify(me))}function load(){try{return JSON.parse(localStorage.getItem(KEY)||'null')}catch{return null}}function clearSaved(){localStorage.removeItem(KEY);me=null}async function post(url,body){const r=await fetch(url,{method:'POST',headers:{'Content-Type':'application/json'},cache:'no-store',body:JSON.stringify(body||{})});let d={};try{d=await r.json()}catch{}if(!r.ok){const e=new Error('HTTP '+r.status);e.status=r.status;throw e}return d}function error(m){err.textContent=m;err.style.display='block';setTimeout(()=>err.style.display='none',4000)}function setView(cls,html,s){unbind();screen.className=cls;screen.innerHTML=html;state=s||state;sendState()}async function sendState(){if(!me)return;try{await post('/api/state',{id:me.id,sessionGeneration:me.sessionGeneration,state,visible:!document.hidden})}catch(e){if(e.status===409)invalid()}}function invalid(){close();clearSaved();badge.textContent='';joinView('参加情報がリセットされました')}
function joinView(note=''){setView('wait',`<h1>⚡ バトルゲーム</h1><p>ニックネームを入力</p><input id="name" maxlength="20"><button id="join">参加する</button><p>${esc(note)}</p>`,'join');document.getElementById('join').onclick=join}async function join(){const name=document.getElementById('name').value.trim();if(!name)return error('名前を入力してください');try{const d=await post('/api/join',{name});me={id:d.id,name:d.name,sessionGeneration:d.sessionGeneration};save();badge.textContent=d.name+' として参加中';connect();standby()}catch{error('参加できませんでした')}}async function boot(){const s=load();if(!s)return joinView();try{const d=await post('/api/rejoin',s);me={id:d.id,name:d.name,sessionGeneration:d.sessionGeneration};save();badge.textContent=d.name+' として参加中';connect();standby()}catch{invalid()}}function close(){if(es)es.close();es=null}function connect(){close();es=new EventSource(`/events/player?id=${encodeURIComponent(me.id)}&generation=${encodeURIComponent(me.sessionGeneration)}`);es.addEventListener('reflex-start',e=>startReflex(JSON.parse(e.data)));es.addEventListener('tap-start',e=>startTap(JSON.parse(e.data)));es.addEventListener('unique-open',e=>openUnique(JSON.parse(e.data)));es.addEventListener('unique-closed',()=>setView('closed','<h1>回答締切</h1><p>結果発表をお待ちください</p>','closed'));es.addEventListener('unique-result',e=>uniqueResult(JSON.parse(e.data)));es.addEventListener('reset',standby);es.addEventListener('kick',invalid)}
function standby(){clearTimers();phase='idle';setView('wait','<div class="live"><i></i>サーバー接続中</div><h1>スタンバイ中</h1><div class="waitingDots"><i></i><i></i><i></i></div><p>司会の合図を待ってください</p>','standby')}function clearTimers(){clearTimeout(timer);clearInterval(tick)}const tag=p=>p?'<div class="practice">練習モード</div>':'';function countdown(p,done,label){let n=3;setView('count',`${tag(p)}<h1>${label}</h1><div id="cd" class="countNumber">3</div>`,'countdown');tick=setInterval(()=>{n--;if(n>0)document.getElementById('cd').textContent=n;else{clearInterval(tick);done()}},1000)}
function startReflex(d){roundId=d.roundId;countdown(d.practice,()=>{phase='ready';setView('red',`${tag(d.practice)}<h1>まだ！</h1><div class="record">●</div><p>緑になるまで待つ</p>`,'ready');bind(reflexHit);timer=setTimeout(()=>{phase='go';window.greenAt=now();setView('green',`${tag(d.practice)}<h1>今だ！</h1><div class="record">●</div><p>タップ！</p>`,'playing');bind(reflexHit)},1500+Math.random()*3000)},'反射神経ゲーム開始まで')}function reflexHit(){if(phase==='ready'){clearTimeout(timer);phase='done';setView('result','<h1>フライング</h1>','result');post('/api/result',{id:me.id,sessionGeneration:me.sessionGeneration,roundId,foul:true});setTimeout(standby,2500)}else if(phase==='go'){const ms=Math.round(now()-window.greenAt);phase='done';setView('result',`<h1>記録</h1><div class="record">${ms} ms</div>`,'result');post('/api/result',{id:me.id,sessionGeneration:me.sessionGeneration,roundId,timeMs:ms});setTimeout(standby,3000)}}
function startTap(d){roundId=d.roundId;countdown(d.practice,()=>beginTap(d),'連打ゲーム開始まで')}function beginTap(d){count=0;const total=d.duration*1000,start=now();setView('tap',`${tag(d.practice)}<h1>連打！</h1><div id="cnt" class="countNumber">0</div><p id="rem">残り ${d.duration}.0 秒</p><div class="bar"><div id="bar"></div></div>`,'playing');bind(()=>document.getElementById('cnt').textContent=++count);tick=setInterval(()=>{const left=Math.max(0,total-(now()-start));document.getElementById('rem').textContent='残り '+(left/1000).toFixed(1)+' 秒';document.getElementById('bar').style.width=(left/total*100)+'%'},100);timer=setTimeout(()=>{clearInterval(tick);setView('result',`<h1>記録</h1><div class="record">${count} 回</div>`,'result');post('/api/result',{id:me.id,sessionGeneration:me.sessionGeneration,roundId,taps:count});setTimeout(standby,3000)},total)}
function openUnique(d){roundId=d.roundId;setView('unique',`${tag(d.practice)}<h1>最大ユニークナンバー</h1><p>1～100から選択</p><input id="num" type="number" inputmode="numeric" min="1" max="100" value="50"><div class="adjust"><button data-v="-10">-10</button><button data-v="-1">-1</button><button data-v="1">+1</button><button data-v="10">+10</button></div><button id="answer" class="answerButton">この数字で決定</button><div id="panel" class="answerPanel"><div class="answerCheck">✓</div><div>回答を受け付けました</div><div id="saved" class="answerNumber"></div><p>締切までは変更できます</p></div>`,'answering');document.querySelectorAll('[data-v]').forEach(b=>b.onclick=()=>{const e=document.getElementById('num');e.value=Math.max(1,Math.min(100,Number(e.value)+Number(b.dataset.v)))});document.getElementById('answer').onclick=submitUnique}async function submitUnique(){const e=document.getElementById('num'),b=document.getElementById('answer'),n=parseInt(e.value,10);if(!(n>=1&&n<=100))return error('1～100を入力');b.disabled=true;b.textContent='送信中…';try{await post('/api/unique-answer',{id:me.id,sessionGeneration:me.sessionGeneration,number:n});document.getElementById('saved').textContent=n;document.getElementById('panel').classList.add('show');b.textContent='✓ 決定済み（変更可）';b.classList.add('saved');navigator.vibrate?.(80)}catch{error('回答できませんでした');b.textContent='この数字で決定'}finally{b.disabled=false}}function uniqueResult(r){const win=r.winningNumber===null?'ユニーク数字なし':`勝利数字 ${r.winningNumber}`;setView('result',`<h1>結果</h1><div class="record">${win}</div><p>${esc((r.winners||[]).join('、')||'勝者なし')}</p>`,'result');setTimeout(standby,6000)}function bind(fn){unbind();down=e=>{e.preventDefault();const t=now();if(t-lastInput<25)return;lastInput=t;fn()};screen.addEventListener('pointerdown',down,{passive:false})}function unbind(){if(down)screen.removeEventListener('pointerdown',down);down=null}document.addEventListener('visibilitychange',sendState);setInterval(sendState,10000);document.addEventListener('dblclick',e=>e.preventDefault());boot();
</script></body></html>

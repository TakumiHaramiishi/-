<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,minimum-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>バトルゲーム</title>
<style>
:root{color-scheme:light}*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}html,body{margin:0;width:100%;height:100%;overflow:hidden;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN","Noto Sans JP",sans-serif;touch-action:manipulation;background:#fff}body{position:fixed;inset:0}#screen{position:fixed;inset:0;width:100%;height:100%;min-height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:max(34px,env(safe-area-inset-top)) max(24px,env(safe-area-inset-right)) max(34px,env(safe-area-inset-bottom)) max(24px,env(safe-area-inset-left));overflow:hidden;background:#fff;color:#17212b;transition:background-color .12s ease,color .12s ease}#screen.wait{background:#fff;color:#17212b}#screen.count{background:#24364b;color:#fff}#screen.red{background:#c62828;color:#fff}#screen.green{background:#159447;color:#fff}#screen.tap{background:#6f2da8;color:#fff}#screen.result{background:#eaf3ff;color:#17212b}#screen.unique{background:#163b61;color:#fff}#screen.closed{background:#37474f;color:#fff}h1{margin:.18em 0;font-size:clamp(1.8rem,7vw,3rem);line-height:1.25}p{margin:.45em 0;line-height:1.55;font-size:clamp(1rem,4.2vw,1.3rem)}.big{display:block;font-size:clamp(5rem,24vw,10rem);font-weight:900;line-height:1;margin:.12em 0;font-variant-numeric:tabular-nums}.countNumber{font-size:clamp(8rem,42vw,16rem);font-weight:950;line-height:.95;text-shadow:0 5px 18px rgba(0,0,0,.35);font-variant-numeric:tabular-nums}.recordNumber{font-size:clamp(4rem,20vw,8rem);font-weight:900;line-height:1;font-variant-numeric:tabular-nums}.sub{color:#66717c}.white,#screen.count p,#screen.red p,#screen.green p,#screen.tap p,#screen.unique p,#screen.closed p{color:#fff}.hint{margin-top:14px;padding:10px 14px;border-radius:12px;background:rgba(255,255,255,.15);font-size:.95rem}.practice{display:inline-block;background:#f39c12;color:#fff;padding:7px 14px;border-radius:999px;margin-bottom:14px;font-weight:800;box-shadow:0 3px 10px rgba(0,0,0,.2)}input{font-size:2rem;width:min(210px,75vw);text-align:center;padding:13px;border:3px solid #bdd1e3;border-radius:14px;background:#fff;color:#17212b;-webkit-user-select:text;user-select:text}button{font-size:1.15rem;font-weight:800;padding:14px 22px;margin:8px;border:0;border-radius:13px;background:#0875c9;color:#fff;box-shadow:0 4px 11px rgba(0,0,0,.22);touch-action:manipulation}button:active{transform:scale(.97)}button:disabled{opacity:.55;transform:none}.adjust{display:grid;grid-template-columns:repeat(4,1fr);width:min(390px,96vw);gap:6px;margin-top:8px}.adjust button{min-width:0;margin:0;padding:12px 4px}.answerButton{width:min(360px,90vw);background:#21a366;font-size:1.3rem}.answerButton.saved{background:#156b40}.answerPanel{display:none;width:min(390px,92vw);margin-top:14px;padding:16px;border:2px solid rgba(255,255,255,.7);border-radius:16px;background:rgba(255,255,255,.18);box-shadow:0 6px 18px rgba(0,0,0,.25)}.answerPanel.show{display:block}.answerCheck{font-size:3.2rem;line-height:1}.answerNumber{font-size:2.4rem;font-weight:900}.bar{width:min(420px,85vw);height:18px;background:rgba(255,255,255,.3);border-radius:10px;overflow:hidden;margin-top:15px}.bar div{height:100%;width:100%;background:#fff;transition:width .08s linear}.badge{position:fixed;z-index:20;top:max(10px,env(safe-area-inset-top));left:10px;right:10px;text-align:center;color:#68737e;font-size:.84rem;pointer-events:none}.error{position:fixed;z-index:30;bottom:0;left:0;right:0;background:#c0392b;color:#fff;padding:12px max(12px,env(safe-area-inset-right)) max(12px,env(safe-area-inset-bottom)) max(12px,env(safe-area-inset-left));display:none;text-align:center}.pulse{animation:pulse .7s ease-in-out infinite alternate}@keyframes pulse{from{transform:scale(.96)}to{transform:scale(1.04)}}
</style>
</head>
<body ondragstart="return false" oncontextmenu="return false">
<div id="screen" class="wait"></div>
<div id="badge" class="badge"></div>
<div id="error" class="error"></div>
<script>
'use strict';
const KEY='battle.session.v3';
const screen=document.getElementById('screen');
const badge=document.getElementById('badge');
const err=document.getElementById('error');
let me=null,es=null,state='standby',roundId=0,phase='idle';
let timer=null,tick=null,count=0,lastInput=0,down=null;
const now=()=>window.performance&&performance.now?performance.now():Date.now();
function esc(s){return String(s||'').replace(/[<>&"]/g,c=>({'<':'&lt;','>':'&gt;','&':'&amp;','"':'&quot;'}[c]));}
function save(){try{localStorage.setItem(KEY,JSON.stringify(me))}catch{}}
function load(){try{return JSON.parse(localStorage.getItem(KEY)||'null')}catch{return null}}
function clearSaved(){try{localStorage.removeItem(KEY)}catch{}me=null}
async function post(url,body){const r=await fetch(url,{method:'POST',headers:{'Content-Type':'application/json'},cache:'no-store',body:JSON.stringify(body||{})});let d={};try{d=await r.json()}catch{}if(!r.ok){const e=new Error('HTTP '+r.status);e.status=r.status;e.data=d;throw e}return d}
function showError(m){err.textContent=m;err.style.display='block';setTimeout(()=>err.style.display='none',4200)}
function setView(cls,html,newState){unbind();screen.className=cls;screen.innerHTML=html;state=newState||state;sendState()}
async function sendState(){if(!me)return;try{await post('/api/state',{id:me.id,sessionGeneration:me.sessionGeneration,state,visible:!document.hidden})}catch(e){if(e.status===409)invalid()}}
function invalid(){close();clearSaved();badge.textContent='';showJoin('参加情報がリセットされました。もう一度名前を入力してください。')}
function showJoin(note=''){setView('wait',`<h1>⚡ バトルゲーム</h1><p>ニックネームを入力</p><input id="name" maxlength="20" autocomplete="off"><button id="join">参加する</button>${note?`<p class="sub">${esc(note)}</p>`:''}`,'join');document.getElementById('join').onclick=join;document.getElementById('name').addEventListener('keydown',e=>{if(e.key==='Enter')join()})}
async function join(){const n=document.getElementById('name').value.trim();if(!n)return showError('名前を入力してください');try{const d=await post('/api/join',{name:n});me={id:d.id,name:d.name,sessionGeneration:d.sessionGeneration};save();badge.textContent=d.name+' として参加中';connect();standby()}catch{showError('参加できませんでした')}}
async function boot(){const s=load();if(!s)return showJoin();setView('wait','<h1>復帰中…</h1>','standby');try{const d=await post('/api/rejoin',s);me={id:d.id,name:d.name,sessionGeneration:d.sessionGeneration};save();badge.textContent=d.name+' として参加中';connect();standby()}catch{invalid()}}
function close(){if(es){es.close();es=null}}
function connect(){close();es=new EventSource(`/events/player?id=${encodeURIComponent(me.id)}&generation=${encodeURIComponent(me.sessionGeneration)}`);es.addEventListener('reflex-start',e=>startReflex(JSON.parse(e.data)));es.addEventListener('tap-start',e=>startTap(JSON.parse(e.data)));es.addEventListener('unique-open',e=>openUnique(JSON.parse(e.data)));es.addEventListener('unique-closed',()=>setView('closed','<h1>回答締切</h1><p>結果発表をお待ちください</p>','result'));es.addEventListener('unique-result',e=>showUniqueResult(JSON.parse(e.data)));es.addEventListener('reset',standby);es.addEventListener('kick',invalid)}
function standby(){clearTimers();phase='idle';setView('wait','<h1>スタンバイ中…</h1><p>司会の合図を待ってください</p>','standby')}
function clearTimers(){clearTimeout(timer);clearInterval(tick);timer=null;tick=null}
function practiceTag(v){return v?'<div class="practice">練習モード：ランキングには反映されません</div>':''}
function countdown(seconds,practice,done,label='開始まで'){clearTimers();let n=seconds;setView('count',`${practiceTag(practice)}<h1>${label}</h1><div id="cd" class="countNumber pulse">${n}</div><p>画面を見てお待ちください</p>`,'countdown');tick=setInterval(()=>{n--;const el=document.getElementById('cd');if(n>0){if(el)el.textContent=n}else{clearInterval(tick);tick=null;done()}},1000)}
function startReflex(d){roundId=d.roundId;countdown(3,d.practice,()=>{phase='ready';setView('red',`${practiceTag(d.practice)}<h1>まだ！</h1><div class="big">●</div><p>緑になるまで待ってください</p>`,'ready');bind(reflexHit);timer=setTimeout(()=>{phase='go';window.greenAt=now();setView('green',`${practiceTag(d.practice)}<h1>今だ！</h1><div class="big">●</div><p>画面をタップ！</p>`,'playing');bind(reflexHit)},1500+Math.random()*3000)},'反射神経ゲーム開始まで')}
function reflexHit(){if(phase==='ready'){clearTimeout(timer);phase='done';setView('result','<h1>フライング</h1><p>今回は無効です</p>','result');post('/api/result',{id:me.id,sessionGeneration:me.sessionGeneration,roundId,foul:true}).catch(()=>{});setTimeout(standby,2500)}else if(phase==='go'){const ms=Math.round(now()-window.greenAt);phase='done';setView('result',`<h1>記録</h1><div class="recordNumber">${ms}<small> ms</small></div>`,'result');post('/api/result',{id:me.id,sessionGeneration:me.sessionGeneration,roundId,timeMs:ms}).catch(()=>showError('記録の送信に失敗しました'));setTimeout(standby,3200)}}
function startTap(d){roundId=d.roundId;countdown(3,d.practice,()=>beginTap(d),'連打ゲーム開始まで')}
function beginTap(d){count=0;const total=d.duration*1000,start=now();setView('tap',`${practiceTag(d.practice)}<h1>連打！</h1><div id="cnt" class="countNumber">0</div><p id="remain">残り ${d.duration}.0 秒</p><div class="bar"><div id="bar"></div></div><div class="hint">一本指で画面のどこでもタップ</div>`,'playing');bind(()=>{count++;const el=document.getElementById('cnt');if(el)el.textContent=count});tick=setInterval(()=>{const left=Math.max(0,total-(now()-start));const rem=document.getElementById('remain'),bar=document.getElementById('bar');if(rem)rem.textContent='残り '+(left/1000).toFixed(1)+' 秒';if(bar)bar.style.width=(left/total*100)+'%'},100);timer=setTimeout(()=>{clearInterval(tick);tick=null;setView('result',`<h1>記録</h1><div class="recordNumber">${count}<small> 回</small></div>`,'result');post('/api/result',{id:me.id,sessionGeneration:me.sessionGeneration,roundId,taps:count}).catch(()=>showError('記録の送信に失敗しました'));setTimeout(standby,3200)},total)}
function openUnique(d){roundId=d.roundId;setView('unique',`${practiceTag(d.practice)}<h1>最大ユニークナンバー</h1><p>1～100から、誰とも被らず一番大きい数字を狙おう</p><input id="num" type="number" inputmode="numeric" min="1" max="100" value="50"><div class="adjust"><button data-v="-10">-10</button><button data-v="-1">-1</button><button data-v="1">+1</button><button data-v="10">+10</button></div><button id="answer" class="answerButton">この数字で決定</button><div id="answerPanel" class="answerPanel"><div class="answerCheck">✓</div><div>回答を受け付けました</div><div id="savedNumber" class="answerNumber"></div><p>締切までは数字を変更できます</p></div>`,'answering');document.querySelectorAll('[data-v]').forEach(b=>b.onclick=()=>{const el=document.getElementById('num');el.value=Math.max(1,Math.min(100,Number(el.value||50)+Number(b.dataset.v)))});document.getElementById('answer').onclick=submitUnique}
async function submitUnique(){const input=document.getElementById('num'),button=document.getElementById('answer');const number=Number.parseInt(input.value,10);if(!(number>=1&&number<=100))return showError('1～100を入力してください');button.disabled=true;button.textContent='送信中…';try{await post('/api/unique-answer',{id:me.id,sessionGeneration:me.sessionGeneration,number});document.getElementById('savedNumber').textContent=number;document.getElementById('answerPanel').classList.add('show');button.textContent='✓ 決定済み（変更する場合は再決定）';button.classList.add('saved');if(navigator.vibrate)navigator.vibrate(80)}catch{button.textContent='この数字で決定';showError('回答できませんでした')}finally{button.disabled=false}}
function showUniqueResult(r){const win=r.winningNumber===null?'ユニーク数字なし':`勝利数字 ${r.winningNumber}`;const names=r.winners&&r.winners.length?r.winners.join('、'):'勝者なし';setView('result',`<h1>最大ユニークナンバー 結果</h1><div class="recordNumber">${win}</div><p>${esc(names)}</p>${r.practice?'<p>練習のためポイント加算なし</p>':''}`,'result');setTimeout(standby,6000)}
function bind(fn){unbind();down=e=>{if(e.cancelable)e.preventDefault();const t=now();if(t-lastInput<25)return;lastInput=t;fn()};screen.addEventListener('pointerdown',down,{passive:false})}
function unbind(){if(down)screen.removeEventListener('pointerdown',down);down=null}
document.addEventListener('visibilitychange',sendState);window.addEventListener('pageshow',sendState);window.addEventListener('pagehide',()=>{state='hidden';sendState()});setInterval(sendState,10000);document.addEventListener('dblclick',e=>e.preventDefault());document.addEventListener('gesturestart',e=>e.preventDefault());boot();
</script>
</body>
</html>

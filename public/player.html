<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">

  <meta
    name="viewport"
    content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"
  >

  <title>技能人財養成部 ハロウィンパーティー</title>

  <style>
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
      -webkit-user-select: none;
      user-select: none;
      -webkit-touch-callout: none;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      overscroll-behavior: none;

      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Hiragino Kaku Gothic ProN",
        "Noto Sans JP",
        sans-serif;

      background: #140d21;
    }

    #screen {
      position: fixed;
      inset: 0;

      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;

      padding:
        max(28px, env(safe-area-inset-top))
        max(24px, env(safe-area-inset-right))
        max(28px, env(safe-area-inset-bottom))
        max(24px, env(safe-area-inset-left));

      overflow: hidden;

      background: #ffffff;
      color: #17212b;

      text-align: center;
    }

    #screen.wait {
      background:
        radial-gradient(
          circle at 50% 20%,
          #43265c,
          #1a1028 65%,
          #0d0715
        );

      color: #ffffff;
    }

    #screen.count {
      background: #27203c;
      color: #ffffff;
    }

    #screen.red {
      background: #c62828;
      color: #ffffff;
    }

    #screen.green {
      background: #159447;
      color: #ffffff;
    }

    #screen.tap {
      background: #6f2da8;
      color: #ffffff;

      touch-action: none;
      overscroll-behavior: none;
    }

    #screen.result {
      background: #fff0df;
      color: #261431;
    }

    #screen.unique {
      background:
        linear-gradient(
          145deg,
          #44205e,
          #20102e
        );

      color: #ffffff;
    }

    #screen.closed {
      background: #37474f;
      color: #ffffff;
    }

    #screen.tempo {
      background: #160b20;
      color: #ffffff;

      touch-action: none;
      overscroll-behavior: none;
    }

    #screen.flash {
      background: #884514;
    }

    h1 {
      margin: 0.2em;

      font-size:
        clamp(
          1.7rem,
          7vw,
          2.8rem
        );

      line-height: 1.25;
    }

    p {
      font-size:
        clamp(
          1rem,
          4vw,
          1.25rem
        );

      line-height: 1.55;
    }

    small {
      font-size: 0.82rem;
      line-height: 1.5;
    }

    .event {
      color: #ff9f2f;
      font-weight: 900;
    }

    .pumpkins {
      font-size: 2.5rem;
    }

    .countNumber {
      font-size:
        clamp(
          8rem,
          42vw,
          16rem
        );

      font-weight: 950;
      line-height: 0.95;
      font-variant-numeric: tabular-nums;
    }

    .record {
      font-size:
        clamp(
          3.6rem,
          18vw,
          7rem
        );

      font-weight: 900;
      font-variant-numeric: tabular-nums;
    }

    .practice {
      margin-bottom: 12px;
      padding: 7px 14px;

      border-radius: 999px;

      background: #f39c12;
      color: #ffffff;

      font-weight: 800;
    }

    .waitingDots {
      display: flex;
      gap: 14px;

      margin: 22px;
    }

    .waitingDots i {
      width: 18px;
      height: 18px;

      border-radius: 50%;

      background: #ff8c26;

      animation:
        bounce 1.2s infinite;
    }

    .waitingDots i:nth-child(2) {
      animation-delay: 0.18s;
    }

    .waitingDots i:nth-child(3) {
      animation-delay: 0.36s;
    }

    @keyframes bounce {
      0%,
      60%,
      100% {
        transform: translateY(0);
        opacity: 0.35;
      }

      30% {
        transform: translateY(-16px);
        opacity: 1;
      }
    }

    .live {
      display: flex;
      align-items: center;
      gap: 8px;

      color: #8ff0b4;

      font-weight: 800;
    }

    .live i {
      width: 11px;
      height: 11px;

      border-radius: 50%;

      background: #36d477;

      box-shadow:
        0 0 12px #36d477;
    }

    input {
      width:
        min(
          230px,
          78vw
        );

      padding: 12px;

      border:
        3px solid #ffb158;
      border-radius: 14px;

      font-size: 2rem;
      text-align: center;

      -webkit-user-select: text;
      user-select: text;
    }

    button {
      margin: 8px;
      padding: 14px 22px;

      border: 0;
      border-radius: 13px;

      background: #ef7f1a;
      color: #ffffff;

      font-size: 1.15rem;
      font-weight: 800;

      cursor: pointer;

      touch-action: manipulation;
    }

    button:active {
      transform: scale(0.97);
    }

    button:disabled {
      opacity: 0.55;
      transform: none;
    }

    .adjust {
      display: grid;
      grid-template-columns:
        repeat(4, 1fr);
      gap: 6px;

      width:
        min(
          390px,
          96vw
        );
    }

    .adjust button {
      min-width: 0;
      margin: 0;
      padding: 12px 4px;
    }

    .answerButton {
      width:
        min(
          360px,
          90vw
        );

      background: #21a366;
    }

    .answerButton.saved {
      background: #156b40;
    }

    .answerPanel {
      display: none;

      width:
        min(
          390px,
          92vw
        );

      margin-top: 14px;
      padding: 15px;

      border:
        2px solid #ffffffaa;
      border-radius: 16px;

      background: #ffffff2d;
    }

    .answerPanel.show {
      display: block;
    }

    .bar {
      width:
        min(
          420px,
          85vw
        );

      height: 18px;

      overflow: hidden;

      border-radius: 10px;

      background: #ffffff55;
    }

    .bar div {
      height: 100%;

      background: #ffffff;
    }

    .badge {
      position: fixed;
      z-index: 12;

      top:
        max(
          10px,
          env(safe-area-inset-top)
        );

      right: 10px;
      left: 10px;

      color: #d7c4e8;

      font-size: 0.85rem;
      text-align: center;

      pointer-events: none;
    }

    .error {
      position: fixed;
      z-index: 20;

      right: 0;
      bottom: 0;
      left: 0;

      display: none;

      padding:
        12px
        max(
          12px,
          env(safe-area-inset-right)
        )
        max(
          12px,
          env(safe-area-inset-bottom)
        )
        max(
          12px,
          env(safe-area-inset-left)
        );

      background: #c0392b;
      color: #ffffff;

      text-align: center;
    }

    .ranking {
      width:
        min(
          94vw,
          540px
        );

      max-height: 90vh;
      padding: 20px;

      overflow-y: auto;

      border:
        2px solid #f28a24;
      border-radius: 18px;

      background: #2b1838;
      color: #ffffff;
    }

    .rankingList {
      display: grid;
      gap: 7px;

      margin: 12px 0;
    }

    .rankingList div {
      padding: 10px;

      border-radius: 10px;

      background: #43255a;

      font-weight: 800;
    }

    .myRank {
      padding: 14px;

      border:
        2px solid #f28a24;
      border-radius: 12px;

      background: #21132f;

      font-size: 1.3rem;
      font-weight: 900;
    }

    .resultBar {
      width: 100%;
      height: 8px;

      margin-top: 14px;

      border-radius: 6px;

      background: #f28a24;

      animation:
        shrink 5s linear forwards;
    }

    @keyframes shrink {
      to {
        width: 0;
      }
    }

    .tempoTarget {
      position: relative;

      width: 230px;
      height: 230px;

      margin: 22px;
    }

    .tempoRing {
      position: absolute;
      inset: 0;

      border:
        7px solid #ffb35c;
      border-radius: 50%;

      box-shadow:
        0 0 22px #f28a2455;
    }

    .tempoDot {
      position: absolute;

      top: 50%;
      left: 50%;

      width: 24px;
      height: 24px;

      border-radius: 50%;

      background: #f28a24;

      box-shadow:
        0 0 25px #f28a24;

      transform:
        translate(-50%, -50%);
    }

    .tempoDot.grow {
      animation:
        grow var(--beat)
        linear forwards;
    }

    @keyframes grow {
      from {
        width: 24px;
        height: 24px;
      }

      to {
        width: 216px;
        height: 216px;
      }
    }

    .tempoCue {
      min-height: 2.5rem;

      font-size: 2rem;
      font-weight: 950;

      opacity: 0;
    }

    .tempoCue.show {
      animation:
        cue 0.42s ease-out;
    }

    @keyframes cue {
      0% {
        opacity: 0;
        transform: scale(0.7);
      }

      25% {
        opacity: 1;
        transform: scale(1.1);
      }

      100% {
        opacity: 0;
        transform: scale(1);
      }
    }

    .tempoFeedback {
      min-height: 2.3rem;
      margin-top: 6px;

      color: #ffcf8c;

      font-size: 1.7rem;
      font-weight: 950;
      font-variant-numeric:
        tabular-nums;
    }

    .tempoFeedback.good {
      color: #8ff0b4;
    }

    .tempoFeedback.fast {
      color: #73c8ff;
    }

    .tempoFeedback.slow {
      color: #ffcf8c;
    }

    .ripple {
      position: fixed;
      z-index: 5;

      width: 70px;
      height: 70px;

      border:
        4px solid #ffffff;
      border-radius: 50%;

      pointer-events: none;

      transform:
        translate(-50%, -50%);

      animation:
        rippleAnimation
        0.4s ease-out forwards;
    }

    @keyframes rippleAnimation {
      to {
        width: 180px;
        height: 180px;
        opacity: 0;
      }
    }
  </style>
</head>

<body>
  <div
    id="screen"
    class="wait"
  ></div>

  <div
    id="badge"
    class="badge"
  ></div>

  <div
    id="error"
    class="error"
  ></div>

  <script>
    'use strict';

    const SESSION_KEY =
      'battle.session.v5';

    const CLIENT_KEY =
      'battle.client.v2';

    const screen =
      document.getElementById(
        'screen'
      );

    const badge =
      document.getElementById(
        'badge'
      );

    const errorPanel =
      document.getElementById(
        'error'
      );

    let me = null;
    let eventSource = null;

    let state = 'standby';
    let roundId = 0;
    let phase = 'idle';

    let timer = null;
    let intervalTimer = null;

    let tapCount = 0;

    let lastInput = 0;
    let pointerHandler = null;

    let lastResult = null;

    let tempoData = null;
    let tempoTimes = [];
    let tempoHidden = false;
    let tempoStart = 0;
    let tempoAccept = 0;

    let previousTouchEnd = 0;

    const now = () =>
      performance?.now
        ? performance.now()
        : Date.now();

    const sleep = milliseconds =>
      new Promise(resolve =>
        setTimeout(
          resolve,
          milliseconds
        )
      );

    /* =====================================================
       端末識別キー
       ===================================================== */

    function getClientKey() {
      let clientKey =
        localStorage.getItem(
          CLIENT_KEY
        );

      if (!clientKey) {
        clientKey =
          crypto.randomUUID?.() ||
          (
            Date.now() +
            '-' +
            Math.random()
              .toString(16)
              .slice(2)
          );

        localStorage.setItem(
          CLIENT_KEY,
          clientKey
        );
      }

      return clientKey;
    }

    /* =====================================================
       共通処理
       ===================================================== */

    function escapeHtml(value) {
      return String(value || '')
        .replace(
          /[<>&"]/g,
          character => ({
            '<': '&lt;',
            '>': '&gt;',
            '&': '&amp;',
            '"': '&quot;'
          })[character]
        );
    }

    function saveSession() {
      if (!me) {
        return;
      }

      localStorage.setItem(
        SESSION_KEY,
        JSON.stringify(me)
      );
    }

    function loadSession() {
      try {
        return JSON.parse(
          localStorage.getItem(
            SESSION_KEY
          ) || 'null'
        );
      } catch {
        return null;
      }
    }

    function clearSession() {
      /*
       * 参加セッションだけを削除します。
       * 端末識別キーは残します。
       */
      localStorage.removeItem(
        SESSION_KEY
      );

      me = null;
    }

    async function post(
      url,
      body
    ) {
      const response =
        await fetch(
          url,
          {
            method: 'POST',

            headers: {
              'Content-Type':
                'application/json'
            },

            cache: 'no-store',

            body:
              JSON.stringify(
                body || {}
              )
          }
        );

      let responseData = {};

      try {
        responseData =
          await response.json();
      } catch {
        responseData = {};
      }

      if (!response.ok) {
        const requestError =
          new Error(
            'HTTP ' +
            response.status
          );

        requestError.status =
          response.status;

        requestError.data =
          responseData;

        throw requestError;
      }

      return responseData;
    }

    function showError(message) {
      errorPanel.textContent =
        message;

      errorPanel.style.display =
        'block';

      setTimeout(() => {
        errorPanel.style.display =
          'none';
      }, 4000);
    }

    function setView(
      className,
      html,
      nextState
    ) {
      unbind();

      screen.className =
        className;

      screen.innerHTML =
        html;

      state =
        nextState || state;

      sendState();
    }

    async function sendState() {
      if (!me) {
        return;
      }

      try {
        await post(
          '/api/state',
          {
            id: me.id,

            sessionGeneration:
              me.sessionGeneration,

            state,

            visible:
              !document.hidden
          }
        );
      } catch (requestError) {
        if (
          requestError.status === 409
        ) {
          /*
           * サーバー再起動直後などは、
           * 保存済みの名前と端末キーで再入場を試します。
           */
          await restoreSession();
        }
      }
    }

    /* =====================================================
       入場・再入場
       ===================================================== */

    function joinView(note = '') {
      setView(
        'wait',
        `
          <div class="pumpkins">
            🎃 👻 🎃
          </div>

          <div class="event">
            技能人財養成部
          </div>

          <h1>
            ハロウィンパーティー
          </h1>

          <p>
            ニックネームを入力
          </p>

          <input
            id="name"
            maxlength="20"
            autocomplete="off"
          >

          <button id="join">
            パーティーに参加
          </button>

          ${
            note
              ? `
                <p>
                  ${escapeHtml(note)}
                </p>
              `
              : ''
          }
        `,
        'join'
      );

      const joinButton =
        document.getElementById(
          'join'
        );

      const nameInput =
        document.getElementById(
          'name'
        );

      joinButton.onclick =
        join;

      nameInput.addEventListener(
        'keydown',
        event => {
          if (
            event.key === 'Enter'
          ) {
            join();
          }
        }
      );
    }

    async function join() {
      const nameInput =
        document.getElementById(
          'name'
        );

      const name =
        nameInput.value.trim();

      if (!name) {
        showError(
          '名前を入力してください'
        );

        return;
      }

      try {
        const responseData =
          await post(
            '/api/join',
            {
              name,

              clientKey:
                getClientKey()
            }
          );

        me = {
          id:
            responseData.id,

          name:
            responseData.name,

          sessionGeneration:
            responseData
              .sessionGeneration,

          clientKey:
            getClientKey()
        };

        saveSession();

        badge.textContent =
          me.name +
          ' として参加中';

        connect();
        standby();
      } catch {
        showError(
          '参加できませんでした'
        );
      }
    }

    async function restoreSession() {
      if (!me) {
        return false;
      }

      try {
        const responseData =
          await post(
            '/api/rejoin',
            {
              id:
                me.id,

              name:
                me.name,

              sessionGeneration:
                me.sessionGeneration,

              clientKey:
                me.clientKey ||
                getClientKey()
            }
          );

        me = {
          id:
            responseData.id,

          name:
            responseData.name,

          sessionGeneration:
            responseData
              .sessionGeneration,

          clientKey:
            getClientKey()
        };

        saveSession();

        badge.textContent =
          me.name +
          ' として参加中';

        connect();

        return true;
      } catch {
        return false;
      }
    }

    async function boot() {
      getClientKey();

      const savedSession =
        loadSession();

      if (!savedSession) {
        joinView();
        return;
      }

      me = {
        ...savedSession,

        clientKey:
          savedSession.clientKey ||
          getClientKey()
      };

      const restored =
        await restoreSession();

      if (restored) {
        standby();
        return;
      }

      clearSession();
      badge.textContent = '';

      joinView(
        '保存済みの参加情報を復元できませんでした。同じ名前を入力すると以前の参加者として再入場できます。'
      );
    }

    /* =====================================================
       SSE接続
       ===================================================== */

    function closeEventSource() {
      if (eventSource) {
        eventSource.close();
      }

      eventSource = null;
    }

    function connect() {
      closeEventSource();

      if (!me) {
        return;
      }

      eventSource =
        new EventSource(
          '/events/player' +
          '?id=' +
          encodeURIComponent(
            me.id
          ) +
          '&generation=' +
          encodeURIComponent(
            me.sessionGeneration
          )
        );

      eventSource.onopen = () => {
        sendState();
      };

      eventSource.onerror = () => {
        /*
         * EventSourceには自動再接続があります。
         * ページが表示中で接続が閉じている場合だけ、
         * セッション復元を試します。
         */
        if (
          !document.hidden &&
          eventSource &&
          eventSource.readyState ===
            EventSource.CLOSED
        ) {
          window.setTimeout(
            async () => {
              const restored =
                await restoreSession();

              if (
                restored &&
                state === 'standby'
              ) {
                standby();
              }
            },
            1000
          );
        }
      };

      eventSource.addEventListener(
        'reflex-start',
        event => {
          startReflex(
            JSON.parse(
              event.data
            )
          );
        }
      );

      eventSource.addEventListener(
        'tap-start',
        event => {
          startTap(
            JSON.parse(
              event.data
            )
          );
        }
      );

      eventSource.addEventListener(
        'unique-open',
        event => {
          openUnique(
            JSON.parse(
              event.data
            )
          );
        }
      );

      eventSource.addEventListener(
        'unique-closed',
        () => {
          setView(
            'closed',
            `
              <h1>
                回答締切
              </h1>

              <p>
                結果発表をお待ちください
              </p>
            `,
            'closed'
          );
        }
      );

      eventSource.addEventListener(
        'unique-result',
        event => {
          uniqueResult(
            JSON.parse(
              event.data
            )
          );
        }
      );

      eventSource.addEventListener(
        'tempo-start',
        event => {
          startTempo(
            JSON.parse(
              event.data
            )
          );
        }
      );

      eventSource.addEventListener(
        'ranking-show',
        event => {
          showRanking(
            JSON.parse(
              event.data
            ),
            true
          );
        }
      );

      eventSource.addEventListener(
        'standby',
        standby
      );

      eventSource.addEventListener(
        'reset',
        standby
      );

      eventSource.addEventListener(
        'kick',
        () => {
          closeEventSource();
          clearSession();

          badge.textContent = '';

          joinView(
            '参加者情報が全リセットされました。名前を入力して参加し直してください。'
          );
        }
      );
    }

    /* =====================================================
       スタンバイ画面
       ===================================================== */

    function standby() {
      clearTimeout(timer);
      clearInterval(
        intervalTimer
      );

      phase = 'idle';

      setView(
        'wait',
        `
          <div class="pumpkins">
            🎃 👻 🎃
          </div>

          <div class="event">
            技能人財養成部
            ハロウィンパーティー
          </div>

          <div class="live">
            <i></i>
            サーバー接続中
          </div>

          <h1>
            ゲームスタンバイ中
          </h1>

          <div class="waitingDots">
            <i></i>
            <i></i>
            <i></i>
          </div>

          <p>
            司会の合図をお待ちください
          </p>

          ${
            lastResult
              ? `
                <button id="lastResult">
                  直前の結果を確認
                </button>
              `
              : ''
          }
        `,
        'standby'
      );

      if (lastResult) {
        document
          .getElementById(
            'lastResult'
          )
          .onclick = () => {
            /*
             * 直前結果の再確認は、
             * ホスト側ではstandbyとして扱います。
             */
            showRanking(
              lastResult,
              false
            );
          };
      }
    }

    const practiceTag =
      practice =>
        practice
          ? `
            <div class="practice">
              練習モード
            </div>
          `
          : '';

    /* =====================================================
       カウントダウン
       ===================================================== */

    function countdown(
      practice,
      done,
      label
    ) {
      let count = 3;

      setView(
        'count',
        `
          ${practiceTag(
            practice
          )}

          <h1>
            ${escapeHtml(
              label
            )}
          </h1>

          <div
            id="countdown"
            class="countNumber"
          >
            3
          </div>
        `,
        'countdown'
      );

      intervalTimer =
        setInterval(() => {
          count -= 1;

          if (count > 0) {
            const countdownElement =
              document.getElementById(
                'countdown'
              );

            if (
              countdownElement
            ) {
              countdownElement
                .textContent =
                  count;
            }

            return;
          }

          clearInterval(
            intervalTimer
          );

          done();
        }, 1000);
    }

    function reflexHit() {
      if (
        phase === 'ready'
      ) {
        clearTimeout(timer);

        phase = 'done';

        setView(
          'result',
          `
            <h1>
              フライング
            </h1>

            <p>
              結果確定をお待ちください
            </p>
          `,
          'result'
        );

        post(
          '/api/result',
          {
            id: me.id,

            sessionGeneration:
              me.sessionGeneration,

            roundId,
            foul: true
          }
        ).catch(() => {
          showError(
            '結果を送信できませんでした'
          );
        });

        return;
      }

      if (
        phase === 'go'
      ) {
        const timeMs =
          Math.round(
            now() -

        setView(
          'result',
          `

              ${timeMs} ms

        );

          {
            id: me.id,

            sessionGeneration:
              me.sessionGeneration,

            roundId,
            timeMs
          }
        ).catch(() => {
          showError(
            '結果を送信できませんでした'
          );
        });
      }
    }

    function startTap(data) {
      roundId =
        data.roundId;

      countdown(
        data.practice,
        () => {
          tapCount = 0;

          const total =
            data.duration *
            1000;

          const startedAt =
            now();

          setView(
            'tap',
            `
              ${practiceTag(
                data.practice
              )}

              <h1>
                連打！
              </h1>

              <div
                id="tapCount"
                class="countNumber"
              >
                0
              </div>

              <p id="remaining">
                残り
                ${data.duration}.0 秒
              </p>

              <div class="bar">
                <div id="timeBar"></div>
              </div>
            `,
            'playing'
          );

          bind(() => {
            tapCount += 1;

            const countElement =
              document.getElementById(
                'tapCount'
              );

            if (
              countElement
            ) {
              countElement
                .textContent =
                  tapCount;
            }
          });

          intervalTimer =
            setInterval(() => {
              const elapsed =
                now() -
                startedAt;

              const remaining =
                Math.max(
                  0,
                  total - elapsed
                );

              const remainingElement =
                document.getElementById(
                  'remaining'
                );

              if (
                remainingElement
              ) {
                remainingElement
                  .textContent =
                    '残り ' +
                    (
                      remaining /
                      1000
                    ).toFixed(1) +
                    ' 秒';
              }

              const timeBar =
                document.getElementById(
                  'timeBar'
                );

              if (timeBar) {
                timeBar.style.width =
                  (
                    remaining /
                    total *
                    100
                  ) +
                  '%';
              }
            }, 100);

          timer =
            setTimeout(() => {
              clearInterval(
                intervalTimer
              );

              unbind();

              setView(
                'result',
                `
                  <h1>
                    記録
                  </h1>

                  <div class="record">
                    ${tapCount} 回
                  </div>

                  <p>
                    ランキング確定をお待ちください
                  </p>
                `,
                'result'
              );

              post(
                '/api/result',
                {
                  id: me.id,

                  sessionGeneration:
                    me.sessionGeneration,

                  roundId,
                  taps: tapCount
                }
              ).catch(() => {
                showError(
                  '結果を送信できませんでした'
                );

            }, total);
        },
        '連打ゲーム開始まで'
      );

    /* =====================================================
       テンポゲーム
       ===================================================== */

    async function startTempo(data) {
      roundId =
        data.roundId;

      tempoData = data;
      tempoTimes = [];
      tempoHidden = false;

      clearTimeout(timer);

      countdown(
        data.practice,
        async () => {
          phase = 'sample';

          setView(
            'tempo',
            `
              ${practiceTag(
                data.practice
              )}

              <h1 id="tempoCount">
                見本 1 / 5
              </h1>

              <div class="tempoTarget">
                <div class="tempoRing"></div>

                <div
                  id="tempoDot"
                  class="tempoDot"
                ></div>
              </div>

              <div
                id="tempoCue"
                class="tempoCue"
              >
                タップ！👆
              </div>

              <div
                id="tempoFeedback"
                class="tempoFeedback"
              ></div>

              <p id="tempoMessage">
                円が重なる瞬間にタップ
              </p>
            `,
            'sample'
          );

          const tempoDot =
            document.getElementById(
              'tempoDot'
            );

          tempoDot.style.setProperty(
            '--beat',
            data.tempoMs +
            'ms'
          );

          /*
           * 見本中のタップは採点しません。
           * 波紋だけ表示します。
           */
          bind(event => {
            createRipple(event);
          });

          for (
            let index = 1;
            index <= 5;
            index += 1
          ) {
            await tempoBeat(
              index,
              data.tempoMs
            );
          }

          /*
           * 見本5回終了後は、
           * 中央の●を消します。
           */
          const dot =
            document.getElementById(
              'tempoDot'
            );

          if (dot) {
            dot.classList.remove(
              'grow'
            );

            dot.style.display =
              'none';
          }

          phase = 'transition';

          const tempoCountElement =
            document.getElementById(
              'tempoCount'
            );

          const tempoMessageElement =
            document.getElementById(
              'tempoMessage'
            );

          if (
            tempoCountElement
          ) {
            tempoCountElement
              .textContent =
                'そのまま続けて！';
          }

          if (
            tempoMessageElement
          ) {
            tempoMessageElement
              .textContent =
                '同じテンポで10回タップ';
          }

          const feedback =
            document.getElementById(
              'tempoFeedback'
            );

          if (feedback) {
            feedback.textContent =
              data.practice
                ? 'タップごとの差を表示します'
                : '';
          }

          tempoStart = now();

          tempoAccept =
            tempoStart +
            data.tempoMs *
            0.45;

          bind(tempoTap);

          setTimeout(() => {
            if (
              phase ===
              'transition'
            ) {
              phase =
                'measure';
            }
          }, data.tempoMs * 0.45);

          timer =
            setTimeout(
              tempoTimeout,
              data.tempoMs * 15
            );
        },
        'テンポゲーム開始まで'
      );
    }

    async function tempoBeat(
      index,
      tempoMs
    ) {
      const countElement =
        document.getElementById(
          'tempoCount'
        );

      if (countElement) {
        countElement.textContent =
          '見本 ' +
          index +
          ' / 5';
      }

      const dot =
        document.getElementById(
          'tempoDot'
        );

      const cue =
        document.getElementById(
          'tempoCue'
        );

      if (
        !dot ||
        !cue
      ) {
        return;
      }

      dot.classList.remove(
        'grow'
      );

      void dot.offsetWidth;

      dot.classList.add(
        'grow'
      );

      await sleep(tempoMs);

      screen.classList.add(
        'flash'
      );

      cue.classList.remove(
        'show'
      );

      void cue.offsetWidth;

      cue.classList.add(
        'show'
      );

      setTimeout(() => {
        screen.classList.remove(
          'flash'
        );
      }, 120);
    }

    function createRipple(event) {
      if (!event) {
        return;
      }

      const ripple =
        document.createElement(
          'i'
        );

      ripple.className =
        'ripple';

      ripple.style.left =
        event.clientX + 'px';

      ripple.style.top =
        event.clientY + 'px';

      document.body.appendChild(
        ripple
      );

      setTimeout(() => {
        ripple.remove();
      }, 450);
    }

    function updateTempoFeedback(
      differenceMs
    ) {
      if (
        !tempoData?.practice
      ) {
        return;
      }

      const feedback =
        document.getElementById(
          'tempoFeedback'
        );

      if (!feedback) {
        return;
      }

      const differenceSeconds =
        differenceMs /
        1000;

      feedback.textContent =
        (
          differenceSeconds >= 0
            ? '+'
            : ''
        ) +
        differenceSeconds
          .toFixed(2) +
        '秒';

      feedback.classList.remove(
        'good',
        'fast',
        'slow'
      );

      if (
        Math.abs(
          differenceMs
        ) <= 50
      ) {
        feedback.classList.add(
          'good'
        );
      } else if (
        differenceMs < 0
      ) {
        feedback.classList.add(
          'fast'
        );
      } else {
        feedback.classList.add(
          'slow'
        );
      }
    }

    function tempoTap(event) {
      createRipple(event);

      const currentTime =
        now();

      if (
        ![
          'transition',
          'measure'
        ].includes(phase) ||
        currentTime <
          tempoAccept
      ) {
        return;
      }

      const previousTime =
        tempoTimes.at(-1);

      /*
       * 200ms未満の連続入力は、
       * 誤二重タップとして無視します。
       */
      if (
        previousTime &&
        currentTime -
          previousTime <
          200
      ) {
        return;
      }

      phase = 'measure';

      tempoTimes.push(
        currentTime
      );

      const countElement =
        document.getElementById(
          'tempoCount'
        );

      if (countElement) {
        countElement.textContent =
          tempoTimes.length +
          ' / 10';
      }

      /*
       * 練習中だけ、
       * 2回目以降のタップ誤差を表示します。
       */
      if (
        previousTime &&
        tempoData?.practice
      ) {
        const interval =
          currentTime -
          previousTime;

        const difference =
          interval -
          tempoData.tempoMs;

        updateTempoFeedback(
          difference
        );
      }

      if (
        tempoTimes.length ===
        10
      ) {
        finishTempo();
      }
    }

    async function finishTempo() {
      phase = 'done';

      clearTimeout(timer);
      unbind();

      const intervals =
        tempoTimes
          .slice(1)
          .map(
            (
              tapTime,
              index
            ) =>
              tapTime -
              tempoTimes[index]
          );

      try {
        await post(
          '/api/tempo/result',
          {
            id: me.id,

            sessionGeneration:
              me.sessionGeneration,

            roundId,
            intervals,

            transitionMs:
              tempoTimes[0] -
              tempoStart,

            elapsedMs:
              tempoTimes.at(-1) -
              tempoTimes[0],

            hidden:
              tempoHidden
          }
        );

        setView(
          'result',
          `
            <h1>
              完了！
            </h1>

            <p>
              ランキング確定をお待ちください
            </p>
          `,
          'result'
        );
      } catch {
        setView(
          'result',
          `
            <h1>
              送信できませんでした
            </h1>

            <p>
              司会へお知らせください
            </p>
          `,
          'result'
        );
      }
    }

    async function tempoTimeout() {
      if (
        ![
          'transition',
          'measure'
        ].includes(phase)
      ) {
        return;
      }

      phase = 'done';

      unbind();

      try {
        await post(
          '/api/tempo/result',
          {
            id: me.id,

            sessionGeneration:
              me.sessionGeneration,

            roundId,

            intervals: [],

            transitionMs:
              999999,

            elapsedMs:
              999999,

            hidden:
              tempoHidden
          }
        );
      } catch {
        // 結果締切済みの場合は表示のみ
      }

      setView(
        'result',
        `
          <h1>
            時間切れ
          </h1>

          <p>
            結果確定をお待ちください
          </p>
        `,
        'result'
      );
    }

    /* =====================================================
       順位表示
       ===================================================== */

    function resultTitleHtml(
      result
    ) {
      if (
        result.kind ===
          'tempo-round'
      ) {
        const matched =
          String(
            result.label || ''
          ).match(
            /第\s*(\d+)\s*ラウンド/
          );

        const roundNumber =
          matched
            ? matched[1]
            : '';

        return (
          'テンポゲーム' +
          '<br>' +
          (
            roundNumber
              ? '第' +
                roundNumber +
                'ラウンド'
              : 'ラウンド結果'
          )
        );
      }

      if (
        result.kind ===
          'tempo-overall'
      ) {
        return (
          'テンポゲーム' +
          '<br>' +
          '総合結果'
        );
      }

      return escapeHtml(
        result.label
      );
    }

    function showRanking(
      result,
      automatic
    ) {
      lastResult =
        result;

      const unit =
        result.unit || '';

      const topHtml =
        (
          result.top3 || []
        )
          .map(
            (
              entry,
              index
            ) => `
              <div>
                ${
                  [
                    '🥇',
                    '🥈',
                    '🥉'
                  ][index]
                }
                ${escapeHtml(
                  entry.name
                )}
                ${entry.score}${unit}
              </div>
            `
          )
          .join('') ||
        '<div>有効記録なし</div>';

      let personalHtml =
        '今回の記録なし';

      if (result.self) {
        personalHtml =
          'あなたの順位 ' +
          result.self.rank +
          '位' +
          '<br>' +
          result.self.score +
          unit;
      } else if (
        result.raw?.valid ===
        false
      ) {
        personalHtml =
          '無効記録' +
          '<br>' +
          escapeHtml(
            result.raw.reason
          );
      } else if (
        result.selfText
      ) {
        personalHtml =
          result.selfText;
      }

      if (
        result.kind ===
          'tempo-overall' &&
        result.self?.rounds
      ) {
        personalHtml +=
          '<br>' +
          '<small>' +
          '第1回 ' +
          result.self.rounds[0] +
          'ms / ' +
          '第2回 ' +
          result.self.rounds[1] +
          'ms / ' +
          '第3回 ' +
          result.self.rounds[2] +
          'ms' +
          '</small>';
      }

      /*
       * 自動表示中はresult、
       * 「直前の結果を確認」で開いた場合はstandbyです。
       */
      const resultState =
        automatic
          ? 'result'
          : 'standby';

      setView(
        'result',
        `
          <div class="ranking">
            <h1>
              ${resultTitleHtml(
                result
              )}
            </h1>

            <div class="rankingList">
              ${topHtml}
            </div>

            <div class="myRank">
              ${personalHtml}
            </div>

            ${
              automatic
                ? `
                  <div class="resultBar"></div>
                `
                : `
                  <button id="back">
                    待機画面へ戻る
                  </button>
                `
            }
          </div>
        `,
        resultState
      );

      if (automatic) {
        setTimeout(
          standby,
          result.durationMs ||
          5000
        );
      } else {
        document
          .getElementById(
            'back'
          )
          .onclick =
            standby;
      }
    }

    /* =====================================================
       タップ入力
       ===================================================== */

    function bind(handler) {
      unbind();

      pointerHandler =
        event => {
          event.preventDefault();

          const currentTime =
            now();

          if (
            currentTime -
              lastInput <
            25
          ) {
            return;
          }

          lastInput =
            currentTime;

          handler(event);
        };

      screen.addEventListener(
        'pointerdown',
        pointerHandler,
        {
          passive: false
        }
      );
    }

    function unbind() {
      if (pointerHandler) {
        screen.removeEventListener(
          'pointerdown',
          pointerHandler
        );
      }

      pointerHandler = null;
    }

    /* =====================================================
       連打時のズーム防止
       ===================================================== */

    document.addEventListener(
      'touchstart',
      event => {
        if (
          screen.classList.contains(
            'tap'
          ) &&
          event.touches.length > 1
        ) {
          event.preventDefault();
        }
      },
      {
        passive: false
      }
    );

    document.addEventListener(
      'touchmove',
      event => {
        if (
          screen.classList.contains(
            'tap'
          ) &&
          event.touches.length > 1
        ) {
          event.preventDefault();
        }
      },
      {
        passive: false
      }
    );

    document.addEventListener(
      'touchend',
      event => {
        const currentTime =
          Date.now();

        if (
          screen.classList.contains(
            'tap'
          ) &&
          currentTime -
            previousTouchEnd <
            350
        ) {
          event.preventDefault();
        }

        previousTouchEnd =
          currentTime;
      },
      {
        passive: false
      }
    );

    document.addEventListener(
      'gesturestart',
      event => {
        if (
          screen.classList.contains(
            'tap'
          )
        ) {
          event.preventDefault();
        }
      },
      {
        passive: false
      }
    );

    document.addEventListener(
      'gesturechange',
      event => {
        if (
          screen.classList.contains(
            'tap'
          )
        ) {
          event.preventDefault();
        }
      },
      {
        passive: false
      }
    );

    document.addEventListener(
      'dblclick',
      event => {
        if (
          screen.classList.contains(
            'tap'
          )
        ) {
          event.preventDefault();
        }
      },
      {
        passive: false
      }
    );

    /* =====================================================
       ブラウザー復帰・接続復旧
       ===================================================== */

    document.addEventListener(
      'visibilitychange',
      () => {
        if (
          document.hidden &&
          [
            'sample',
            'transition',
            'measure'
          ].includes(phase)
        ) {
          tempoHidden =
            true;
        }

        if (
          !document.hidden &&
          me
        ) {
          if (
            !eventSource ||
            eventSource.readyState ===
              EventSource.CLOSED
          ) {
            restoreSession()
              .then(restored => {
                if (restored) {
                  connect();
                }
              });
          }
        }

        sendState();
      }
    );

    window.addEventListener(
      'pageshow',
      async () => {
        if (!me) {
          return;
        }

        if (
          !eventSource ||
          eventSource.readyState ===
            EventSource.CLOSED
        ) {
          const restored =
            await restoreSession();

          if (restored) {
            connect();
          }
        }

        sendState();
      }
    );

    window.addEventListener(
      'online',
      async () => {
        if (!me) {
          return;
        }

        const restored =
          await restoreSession();

        if (restored) {
          connect();
          sendState();
        }
      }
    );

    document.addEventListener(
      'contextmenu',
      event => {
        if (
          screen.classList.contains(
            'tap'
          ) ||
          screen.classList.contains(
            'tempo'
          )
        ) {
          event.preventDefault();
        }
      }
    );

    setInterval(
      sendState,
      10000
    );

    boot();
  </script>
</body>
</html>

<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><title>バトルゲーム</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}html,body{margin:0;height:100%;font-family:-apple-system,"Noto Sans JP",sans-serif;overflow:hidden;touch-action:manipulation}#screen{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:28px;background:#fff}h1{margin:.2em;font-size:1.8rem}p{line-height:1.6}.big{font-size:4.8rem;font-weight:900;margin:.15em}.sub{color:#666}.white{color:#fff}.wait{background:#fff}.count{background:#24364b;color:#fff}.red{background:#c0392b;color:#fff}.green{background:#27ae60;color:#fff}.tap{background:#7d3c98;color:#fff}.result{background:#eaf3ff}.unique{background:#163b61;color:#fff}input{font-size:1.6rem;width:180px;text-align:center;padding:12px;border:2px solid #bbb;border-radius:12px;-webkit-user-select:text;user-select:text}button{font-size:1.15rem;font-weight:800;padding:14px 24px;margin:8px;border:0;border-radius:13px;background:#0875c9;color:#fff}.adjust button{min-width:65px}.bar{width:80%;height:14px;background:#ffffff55;border-radius:8px;overflow:hidden}.bar div{height:100%;background:#fff}.badge{position:fixed;top:10px;left:10px;right:10px;color:#777;font-size:.85rem}.practice{background:#f39c12;color:#fff;padding:6px 12px;border-radius:999px;margin-bottom:12px}.error{position:fixed;bottom:0;left:0;right:0;background:#c0392b;color:#fff;padding:10px;display:none}
</style></head><body><div id="screen"></div><div id="badge" class="badge"></div><div id="error" class="error"></div>
<script>
'use strict';
const KEY='battle.session.v3', screen=document.getElementById('screen'),badge=document.getElementById('badge'),err=document.getElementById('error');
let me=null,es=null,state='standby',roundId=0,phase='idle',timer=null,tick=null,count=0,lastInput=0,down=null,up=null;
const now=()=>performance?.now?performance.now():Date.now();
function esc(s){return String(s||'').replace(/[<>&"]/g,c=>({'<':'&lt;','>':'&gt;','&':'&amp;','"':'&quot;'}[c]));}
function save(){localStorage.setItem(KEY,JSON.stringify(me));} function load(){try{return JSON.parse(localStorage.getItem(KEY)||'null')}catch{return null}} function clearSaved(){localStorage.removeItem(KEY);me=null}
async function post(url,body){const r=await fetch(url,{method:'POST',headers:{'Content-Type':'application/json'},cache:'no-store',body:JSON.stringify(body||{})});let d={};try{d=await r.json()}catch{}if(!r.ok){const e=new Error('HTTP '+r.status);e.status=r.status;e.data=d;throw e}return d}
function showError(m){err.textContent=m;err.style.display='block';setTimeout(()=>err.style.display='none',4000)}
function setView(cls,html,newState){unbind();screen.className=cls;screen.innerHTML=html;state=newState||state;sendState();}
async function sendState(){if(!me)return;try{await post('/api/state',{id:me.id,sessionGeneration:me.sessionGeneration,state,visible:!document.hidden})}catch(e){if(e.status===409)invalid()}}
function invalid(){close();clearSaved();badge.textContent='';showJoin('参加情報がリセットされました。もう一度名前を入力してください。')}
function showJoin(note=''){setView('wait',`<h1>⚡ バトルゲーム</h1><p>ニックネームを入力</p><input id="name" maxlength="20"><button id="join">参加する</button>${note?`<p class="sub">${esc(note)}</p>`:''}`,'join');document.getElementById('join').onclick=join}
async function join(){const n=document.getElementById('name').value.trim();if(!n)return showError('名前を入力してください');try{const d=await post('/api/join',{name:n});me={id:d.id,name:d.name,sessionGeneration:d.sessionGeneration};save();badge.textContent=d.name+' として参加中';connect();standby()}catch{showError('参加できませんでした')}}
async function boot(){const s=load();if(!s)return showJoin();setView('wait','<h1>復帰中…</h1>','standby');try{const d=await post('/api/rejoin',s);me={id:d.id,name:d.name,sessionGeneration:d.sessionGeneration};save();badge.textContent=d.name+' として参加中';connect();standby()}catch{invalid()}}
function close(){if(es){es.close();es=null}}
function connect(){close();es=new EventSource(`/events/player?id=${encodeURIComponent(me.id)}&generation=${encodeURIComponent(me.sessionGeneration)}`);es.addEventListener('reflex-start',e=>{const d=JSON.parse(e.data);startReflex(d)});es.addEventListener('tap-start',e=>startTap(JSON.parse(e.data)));es.addEventListener('unique-open',e=>openUnique(JSON.parse(e.data)));es.addEventListener('unique-closed',()=>setView('wait','<h1>回答締切</h1><p>結果発表をお待ちください</p>','result'));es.addEventListener('unique-result',e=>showUniqueResult(JSON.parse(e.data)));es.addEventListener('reset',()=>standby());es.addEventListener('kick',()=>invalid())}
function standby(){clearTimers();setView('wait','<h1>スタンバイ中…</h1><p>司会の合図を待ってください</p>','standby')}
function clearTimers(){clearTimeout(timer);clearInterval(tick)}
function practiceTag(v){return v?'<div class="practice">練習モード：ランキングには反映されません</div>':''}
function countdown(seconds,practice,done){clearTimers();let n=seconds;setView('count',`${practiceTag(practice)}<h1 class="white">開始まで</h1><div id="cd" class="big">${n}</div>`,'countdown');tick=setInterval(()=>{n--;if(n>0)document.getElementById('cd').textContent=n;else{clearInterval(tick);done()}},1000)}
function startReflex(d){roundId=d.roundId;countdown(3,d.practice,()=>{phase='ready';setView('red',`${practiceTag(d.practice)}<h1 class="white">まだ！</h1><div class="big">🔴</div><p class="white">緑になるまで待ってください</p>`,'ready');bind(reflexHit);timer=setTimeout(()=>{phase='go';const t=now();window.greenAt=t;setView('green',`${practiceTag(d.practice)}<h1 class="white">今だ！</h1><div class="big">🟢</div>`,'playing');bind(reflexHit)},1500+Math.random()*3000)})}
function reflexHit(){if(phase==='ready'){clearTimeout(timer);phase='done';setView('result','<h1>フライング</h1><p>今回は無効です</p>','result');post('/api/result',{id:me.id,sessionGeneration:me.sessionGeneration,roundId,foul:true}).catch(()=>{});setTimeout(standby,2500)}else if(phase==='go'){const ms=Math.round(now()-window.greenAt);phase='done';setView('result',`<h1>記録</h1><div class="big">${ms}<small> ms</small></div>`,'result');post('/api/result',{id:me.id,sessionGeneration:me.sessionGeneration,roundId,timeMs:ms}).catch(()=>showError('送信失敗'));setTimeout(standby,3000)}}
function startTap(d){roundId=d.roundId;countdown(3,d.practice,()=>{count=0;const total=d.duration*1000,start=now();setView('tap',`${practiceTag(d.practice)}<h1 class="white">連打！</h1><div id="cnt" class="big">0</div><p id="remain" class="white">残り ${d.duration}.0 秒</p><div class="bar"><div id="bar"></div></div><p class="white">一本指でタップ</p>`,'playing');bind(()=>{count++;document.getElementById('cnt').textContent=count});tick=setInterval(()=>{const left=Math.max(0,total-(now()-start));document.getElementById('remain').textContent='残り '+(left/1000).toFixed(1)+' 秒';document.getElementById('bar').style.width=(left/total*100)+'%'},100);timer=setTimeout(()=>{clearInterval(tick);setView('result',`<h1>記録</h1><div class="big">${count}<small> 回</small></div>`,'result');post('/api/result',{id:me.id,sessionGeneration:me.sessionGeneration,roundId,taps:count}).catch(()=>showError('送信失敗'));setTimeout(standby,3000)},total)})}
function openUnique(d){roundId=d.roundId;let n=50;setView('unique',`${practiceTag(d.practice)}<h1 class="white">最大ユニークナンバー</h1><p class="white">1～100から、誰とも被らず一番大きい数字を狙おう</p><input id="num" type="number" min="1" max="100" value="50"><div class="adjust"><button data-v="-10">-10</button><button data-v="-1">-1</button><button data-v="1">+1</button><button data-v="10">+10</button></div><button id="answer">この数字で決定</button><p id="answerState" class="white"></p>`,'answering');document.querySelectorAll('[data-v]').forEach(b=>b.onclick=()=>{const el=document.getElementById('num');el.value=Math.max(1,Math.min(100,Number(el.value||50)+Number(b.dataset.v)))});document.getElementById('answer').onclick=async()=>{const number=Number.parseInt(document.getElementById('num').value,10);if(!(number>=1&&number<=100))return showError('1～100を入力してください');try{await post('/api/unique-answer',{id:me.id,sessionGeneration:me.sessionGeneration,number});document.getElementById('answerState').textContent=number+'で回答しました。締切まで変更できます。'}catch{showError('回答できませんでした')}}}
function showUniqueResult(r){const win=r.winningNumber===null?'ユニーク数字なし':`勝利数字：${r.winningNumber}`;const names=r.winners?.length?r.winners.join('、'):'勝者なし';setView('result',`<h1>最大ユニークナンバー 結果</h1><div class="big">${win}</div><p>${esc(names)}</p>${r.practice?'<p>練習のためポイント加算なし</p>':''}`,'result');setTimeout(standby,6000)}
function bind(fn){unbind();down=e=>{if(e.cancelable)e.preventDefault();const t=now();if(t-lastInput<25)return;lastInput=t;fn()};up=()=>{};screen.addEventListener('pointerdown',down,{passive:false})}
function unbind(){if(down)screen.removeEventListener('pointerdown',down);down=null;up=null}
document.addEventListener('visibilitychange',sendState);window.addEventListener('pageshow',sendState);window.addEventListener('pagehide',()=>{state='hidden';sendState()});setInterval(sendState,10000);document.addEventListener('dblclick',e=>e.preventDefault());boot();
</script></body></html>
